      }
    }

    if (!foundKey) {
      // If a final incoming direction is required, do not use a directionless fallback;
      // otherwise cars may reach the driveway from the wrong side and then fail at the building.
      // Median-barrier lane rule:
      // Do not silently fall back to a directionless path unless the caller explicitly allows it.
      // Building trips pass forceAnyPath=false so cars cannot cross the imagined center wall
      // or reverse direction at a driveway. They must find a legal U-turn/loop first.
      if (!finalPrevSet && opts.forceAnyPath === true) {
        const anyPath = findAnyConnectedPath(start, goal);
        if (anyPath.length) {
          if (useCache && anyPath.length > 1 && pathCache.size < 5000) pathCache.set(cacheKey, anyPath);
          return anyPath;
        }
      }
      if (!quiet) addAlert('หาเส้นทางไม่ได้', 'ถนนยังไม่เชื่อมต่อจากต้นทางถึงปลายทางจริง ๆ ต้องต่อถนนให้เป็น component เดียวกันก่อน', 1);
      return [];
    }

    const path = [];
    let k = foundKey;
    while (k) {
      path.push(curOf(k));
      k = came.get(k);
    }
    path.reverse();

    if (useCache && path.length > 1 && pathCache.size < 5000) pathCache.set(cacheKey, path);
    return path;
  }

  function heuristic(a, b) {
    const ax = a % MAP_W, ay = Math.floor(a / MAP_W);
    const bx = b % MAP_W, by = Math.floor(b / MAP_W);
    // Chebyshev เหมาะกับถนนที่ลากได้ทั้ง 90° และ 45° ช่วยให้ A* เลือกเส้นทางนิ่งกว่า Manhattan
    return Math.max(Math.abs(ax - bx), Math.abs(ay - by)) * 0.82;
  }

  function roadDegree(i) {
    return road[i] ? linkedNeighbors(i).length : 0;
  }

  function roadTravelCost(i, step, trafficAware = false) {
    const rd = roadDataById(road[i]) || DATA.roads.small;
    // Route choice v3: distance stays king. Larger roads are only slightly cheaper,
    // so AI will not take a huge loop just because it sees an 8-lane road.
    const laneFactor = rd.lanes >= 8 ? 0.92 : rd.lanes >= 4 ? 0.96 : 1.0;
    const trafficPenalty = trafficAware ? Math.max(0, getRoadRatio(i) - 0.95) * 0.28 : 0;
    const junctionPenalty = isSignalControlledJunction(i) ? 0.10 : roadDegree(i) >= 3 ? 0.04 : 0;
    return step * laneFactor + trafficPenalty + junctionPenalty;
  }

  function pathTurnPenalty(prev, cur, next) {
    if (prev == null || prev < 0 || cur == null || next == null) return 0;
    const a = xy(prev), b = xy(cur), c = xy(next);
    const dx1 = sign(b.x - a.x), dy1 = sign(b.y - a.y);
    const dx2 = sign(c.x - b.x), dy2 = sign(c.y - b.y);
    if (dx1 === -dx2 && dy1 === -dy2) return 22.0; // legal U-turn is last resort, not a normal route choice
    if (dx1 === dx2 && dy1 === dy2) return 0;
    const dot = dx1 * dx2 + dy1 * dy2;
    return dot <= 0 ? 0.36 : 0.14;
  }

  function samePathFromCurrent(v, path) {
    if (!v || !path || !path.length) return false;
    const remaining = v.path.slice(v.pathPos);
    if (remaining.length !== path.length) return false;
    for (let i = 0; i < path.length; i++) if (path[i] !== remaining[i]) return false;
    return true;
  }

  function applyVehiclePath(v, path, note = '', allowPathTouchedReroute = false) {
    // Patch 17: route lock แบบมีเงื่อนไข
    // ปฏิเสธ reroute ทั่วไป แต่ยอมเฉพาะกรณี road change แตะ path เดิมของรถคันนั้นจริง ๆ
    if (v && v.routeLocked && !allowPathTouchedReroute) {
      v.lastRouteNote = 'route locked: no reroute unless current path touched';
      return false;
    }
    if (!path || path.length === 0) return false;
    if (v && path[0] !== v.currentIdx) return false;
    releaseVehicleIntersectionReservation(v);
    clearNextCell(v);
    v.path = path.slice();
    v.pathPos = 0;
    v.t = 0;
    v.nextIdx = null;
    v.rerouted = true;
    v.phase = 'driving';
    v.stuckReason = null;
    v.speedFactor = Math.min(v.speedFactor ?? 1, VEHICLE_RESTART_SPEED_FACTOR);
    v.waitingGameMin = 0;
    v.rerouteCooldown = game.worldMin + 40;
    syncVehicleRouteMeta(v, note || 'route updated after path-touched road change');
    return true;
  }

  function markVehicleStuck(v, reason = 'ไปต่อไม่ได้', penaltyAmount = 5, alertTitle = 'รถค้าง') {
    if (!v) return false;
    releaseVehicleIntersectionReservation(v);
    clearNextCell(v);
    v.phase = 'stuck';
    v.stuckReason = reason;
    if (v.stuckSince == null) v.stuckSince = game.worldMin;
    if (v.nextStuckCheckAt == null) v.nextStuckCheckAt = game.worldMin + STUCK_ROUTE_CHECK_INTERVAL_MIN;
    v.waitingGameMin += 0;
    addWaitLoad(v.currentIdx, 1.2);
    const c = v.citizenId ? citizenById(v.citizenId) : null;
    if (c && !c.removed && game.worldMin - (v.lastStuckPenalty || -Infinity) >= STUCK_ALERT_COOLDOWN_MIN) {
      v.lastStuckPenalty = game.worldMin;
      c.satisfaction = clamp(c.satisfaction - penaltyAmount, 0, 100);
      c.lateToday = true;
      c.lateTaxPenalty = true;
    }
    if (!v.lastStuckAlert || game.worldMin - v.lastStuckAlert >= STUCK_ALERT_COOLDOWN_MIN) {
      v.lastStuckAlert = game.worldMin;
      const who = c ? `Citizen ${c.id}` : tripTypeName(v.type);
      addAlert(alertTitle, `${who} ${reason} • Patch 17 จะหาเส้นทางใหม่เฉพาะเมื่อถนนเปลี่ยนแตะ path เดิม`, 1, 'warn');
    }
    return false;
  }

  function currentLegalInitialPrev(v) {
    return v && v.pathPos > 0 ? v.path[v.pathPos - 1] : -1;
  }

  function vehicleCanForceThroughUTurn(v) {
    // Patch 25 No-Cross-Lane:
    // forceArrive ห้ามแปลว่า “กลับรถ/ข้ามเลนได้ทุกจุด” อีกต่อไป
    // ถ้าต้องเข้าฝั่งตรงข้าม ต้องหา U-turn/ทางวนที่ถูกกฎหมายก่อน
    return false;
  }

  function pathForVehicleCurrentDestination(v) {
    const initialPrev = currentLegalInitialPrev(v);
    if (v && v.destBuildingId) {
      const b = buildingById(v.destBuildingId);
      if (b) {
        // Patch 25 No-Cross-Lane:
        // Recovery ต้องหา access point ที่เข้าอาคารจากฝั่ง curb/เลนซ้ายของไทยเท่านั้น
        // ห้ามใช้ simple path ไป b.entrance เพราะจะทำให้รถเข้าจากฝั่งตรงข้าม/ข้ามเลนมั่ว
        return pathToBuildingAccess(v.currentIdx, b, {
          initialPrev,
          allowDeadEndUTurn: false,
          enforceNoUTurn: true,
          trafficAware: false,
          forceAnyPath: false,
          allowWrongLaneBuildingAccess: false
        });
      }
    }
    if (v && v.targetGateId) {
      const g = gates.find(x => x.id === v.targetGateId);
      if (g && g.entrance != null && road[g.entrance]) {
        return findPath(v.currentIdx, g.entrance, true, { initialPrev, allowDeadEndUTurn: true, trafficAware: false, forceAnyPath: false });
      }
    }
    const dest = v && v.path && v.path.length ? v.path[v.path.length - 1] : null;
    if (dest != null && road[dest]) return findPath(v.currentIdx, dest, true, { initialPrev, allowDeadEndUTurn: true, trafficAware: false, forceAnyPath: false });
    return [];
  }


  function pathForVehicleDestinationFrom(v, fromIdx, initialPrev, trafficAware = true) {
    if (!v || fromIdx == null || !road[fromIdx]) return [];
    if (v.destBuildingId) {
      const b = buildingById(v.destBuildingId);
      if (b) {
        return pathToBuildingAccess(fromIdx, b, {
          initialPrev,
          allowDeadEndUTurn: false,
          enforceNoUTurn: true,
          trafficAware,
          forceAnyPath: false,
          allowWrongLaneBuildingAccess: false
        });
      }
    }
    if (v.targetGateId) {
      const g = gates.find(x => x.id === v.targetGateId);
      if (g && g.entrance != null && road[g.entrance]) {
        return findPath(fromIdx, g.entrance, true, { initialPrev, allowDeadEndUTurn: true, trafficAware, forceAnyPath: false });
      }
    }
    const dest = v.path && v.path.length ? v.path[v.path.length - 1] : null;
    if (dest != null && road[dest]) return findPath(fromIdx, dest, true, { initialPrev, allowDeadEndUTurn: true, trafficAware, forceAnyPath: false });
    return [];
  }

  function findPathToNearestLegalUTurn(v) {
    if (!v || !road[v.currentIdx]) return [];
    const start = v.currentIdx;
    const startPrev = currentLegalInitialPrev(v);
    const keyOf = (cur, prev) => `${cur}|${prev == null ? -1 : prev}`;
    const queue = [{ cur: start, prev: startPrev, path: [start] }];
    const seen = new Set([keyOf(start, startPrev)]);
    const maxNodes = 2800;
    for (let q = 0; q < queue.length && q < maxNodes; q++) {
      const st = queue[q];
      if (st.cur !== start && canUTurnAt(st.cur)) return st.path;
      for (const ni of linkedNeighbors(st.cur)) {
        if (!road[ni]) continue;
        if (st.prev >= 0 && wouldUTurn(st.prev, st.cur, ni) && !canUTurnAtForPath(st.cur, st.prev, { allowDeadEndUTurn: true })) continue;
        const k = keyOf(ni, st.cur);
        if (seen.has(k)) continue;
        seen.add(k);
        queue.push({ cur: ni, prev: st.cur, path: st.path.concat([ni]) });
      }
    }
    return [];
  }

  function buildPathViaLegalUTurn(v) {
    const toTurn = findPathToNearestLegalUTurn(v);
    if (!toTurn.length) return [];
    const turnCell = toTurn[toTurn.length - 1];
    const prevAtTurn = toTurn.length > 1 ? toTurn[toTurn.length - 2] : currentLegalInitialPrev(v);
    const afterTurn = pathForVehicleDestinationFrom(v, turnCell, prevAtTurn, true);
    if (!afterTurn.length) return [];
    return appendUniquePath(toTurn, afterTurn);
  }

  function isAtBuildingDropoff(v) {
    if (!v || !v.destBuildingId) return false;
    const b = buildingById(v.destBuildingId);
    if (!b || v.currentIdx == null || !road[v.currentIdx]) return false;

    // Patch 25 Building Entry Fix:
    // createTrip() can choose ANY valid access point for the destination building, not only
    // b.entrance. The old check `v.currentIdx !== b.entrance` made cars reach a legal
    // side/curb access and then refuse to enter, forming queues in front of buildings.
    // Entry is now decided from the actual current road cell + the actual previous cell.
    const accesses = validAccessPointsForBuilding(b)
      .map(a => refreshAccessLegalLinks(a))
      .filter(a => a && a.entrance === v.currentIdx);
    if (!accesses.length) return false;

    const prev = v.pathPos > 0 ? v.path[v.pathPos - 1] : currentLegalInitialPrev(v);
    if (prev == null || prev < 0) return false;

    // Thailand left-side/near-lane rule: entering a building is legal only when the car
    // arrived from a road link that keeps the building on the driver's left/curb side.
    return accesses.some(a => a.entryOk && a.approachPrevs && a.approachPrevs.includes(prev) && moveDirKey(prev, v.currentIdx) === a.entryDirKey);
  }

  function rerouteVehicleHomeOrExit(v, reason = 'ทางขาด') {
    // Patch 17: ปิดการเปลี่ยนปลายทาง/หาเส้นทางใหม่ทั้งหมด
    // ถ้าถนนขาด/กลับรถไม่ได้/ไปต่อไม่ได้ รถต้องติดอยู่จริง ไม่หาย ไม่วาร์ป ไม่เปลี่ยนกลับบ้านเอง
    return markVehicleStuck(v, reason, 5, 'รถติดค้าง');
  }

  function shouldSleepVehicle(v) {
    if (!v) return true;
    // รถที่ต้อง animate จริง ๆ ห้าม sleep ไม่งั้นภาพกระตุก
    if (v.phase === 'driving' || v.phase === 'arriving' || v.phase === 'fadingOut') return false;
    if (v.phase === 'departing') {
      // คันแรกที่กำลังออกจากอาคารต้องอัปเดตทุกเฟรม ส่วนคันท้ายคิวให้หลับเป็นช่วง ๆ
      if (v.departureRoadEntered) return false;
      const b = v.exitBuildingId ? buildingById(v.exitBuildingId) : null;
      if (!b || !Array.isArray(b.exitQueue) || b.exitQueue[0] === v.id) return false;
      if (performance.now() < (v.sleepUntilReal || 0)) return true;
      v.sleepUntilReal = performance.now() + VEHICLE_QUEUE_SLEEP_REAL_SEC * 1000;
      return false;
    }
    if (v.phase === 'gate_waiting') {
      // หน้า Gate ให้คันหน้าคิวตื่นตลอด ส่วนคันท้ายคิวไม่ต้องลองออกทุกเฟรม
      if (isFrontStartQueueVehicle(v)) return false;
      if (performance.now() < (v.sleepUntilReal || 0)) return true;
      v.sleepUntilReal = performance.now() + VEHICLE_QUEUE_SLEEP_REAL_SEC * 1000;
      return false;
    }
    if (v.phase === 'stuck') {
      // รถค้างเช็กเป็นช่วง ๆ อยู่แล้ว จึงไม่ต้องเข้า update ทุกเฟรม
      if (game.worldMin < (v.nextStuckCheckAt || 0) && performance.now() < (v.sleepUntilReal || 0)) return true;
      v.sleepUntilReal = performance.now() + VEHICLE_STUCK_SLEEP_REAL_SEC * 1000;
      return false;
    }
    return false;
  }

  function updateVehicleLateState(v) {
    if (!v || !v.deadline || game.worldMin <= v.deadline || v.type === 'PassThroughTrip' || v.type === 'MoveInTrip') return;
    if (game.worldMin < (v.nextLateCheckAt || 0)) return;
    v.nextLateCheckAt = game.worldMin + VEHICLE_LATE_CHECK_GAME_MIN;
    const c = v.citizenId ? citizenById(v.citizenId) : null;
    if (!v.lateAlerted) {
      v.lateAlerted = true;
      v.lastLatePenalty = game.worldMin;
      if (c && !c.removed) {
        c.satisfaction = Math.max(0, c.satisfaction - LATE_INITIAL_SAT_PENALTY);
        c.lateToday = true; c.lateTaxPenalty = true; c.lateCountToday = (c.lateCountToday || 0) + 1;
        game.lateTripsToday++;
        c.state = `${c.state} (ล่าช้า)`;
        addAlert('เดินทางล่าช้า', `Citizen ${c.id} ยังไปไม่ถึงปลายทาง ระบบจะไม่ตัด Trip แต่จะหักความสุขแบบเบาลง`, 1, 'warn');
      }
    } else if (c && !c.removed && game.worldMin - (v.lastLatePenalty || v.deadline) >= 60) {
      v.lastLatePenalty = game.worldMin;
      c.satisfaction = Math.max(0, c.satisfaction - LATE_REPEAT_SAT_PENALTY);
      c.lateTaxPenalty = true;
    }
  }

  function updateVehicles(realDt, gameMinDt) {
    // Patch 44: queue front + reservation cleanup ไม่ต้อง scan ทุก tick รถ
    // แต่ต้องทำเป็นจังหวะสั้น ๆ เพื่อไม่ให้คิว Gate/อาคารตอบสนองช้า
    if (game.queueControlRealTick == null) game.queueControlRealTick = QUEUE_CONTROL_INTERVAL_REAL_SEC;
    game.queueControlRealTick += realDt;
    if (game.queueControlRealTick >= QUEUE_CONTROL_INTERVAL_REAL_SEC) {
      game.queueControlRealTick = 0;
      prepareQueueControl();
    }

    // Patch 44: late state ไม่จำเป็นต้องตรวจทุกคันทุก vehicle tick
    // เพราะ late เป็นหน่วยนาทีเกมอยู่แล้ว ตรวจทุก 0.5 วิจริงก็พอและลด O(vehicle) ซ้ำ ๆ
    if (game.vehicleLateScanRealTick == null) game.vehicleLateScanRealTick = VEHICLE_LATE_SCAN_INTERVAL_REAL_SEC;
    game.vehicleLateScanRealTick += realDt;
    const doLateScan = game.vehicleLateScanRealTick >= VEHICLE_LATE_SCAN_INTERVAL_REAL_SEC;
    if (doLateScan) game.vehicleLateScanRealTick = 0;

    let updated = 0;
    let slept = 0;
    for (let i = vehicles.length - 1; i >= 0; i--) {
      const v = vehicles[i];
      if (!v) continue;
      if (doLateScan) updateVehicleLateState(v);
      if (shouldSleepVehicle(v)) {
        // สะสมเวลารอแบบเบา ๆ เพื่อให้ Dashboard ยังอ่านค่าคิวได้ แต่ไม่เข้า physics เต็มทุกเฟรม
        if (v.phase === 'gate_waiting' || v.phase === 'departing' || v.phase === 'stuck') {
          v.waitingGameMin = (v.waitingGameMin || 0) + gameMinDt;
        }
        slept++;
        continue;
      }
      moveVehicle(v, realDt, gameMinDt);
      updated++;
    }
    game.vehicleUpdatedLastFrame = updated;
    game.vehicleSleptLastFrame = slept;
    game.vehicleLateScannedLastTick = doLateScan ? vehicles.length : 0;
  }

  function handleBlockedVehicle(v) {
    // Patch 17: ถ้ามาถึงจุดนี้แปลว่าลองคำนวณใหม่ตามเงื่อนไข path touched แล้วไม่สำเร็จ จึงให้ติดจริง
    return markVehicleStuck(v, 'ไปต่อไม่ได้เพราะเส้นทางเดิมถูกตัด/ถนนข้างหน้าหาย', 5, 'รถค้างเพราะถนนขาด');
  }

  function moveDepartingVehicle(v, realDt, gameMinDt) {
    const b = v.exitBuildingId ? buildingById(v.exitBuildingId) : null;
    if (!b || !road[v.currentIdx]) {
      return removeVehicleFromSimulation(v, 'ทางออกอาคารถูกตัด', true);
    }
    ensureBuildingVehicleStores(b);
    // Patch 21: update เฉพาะคันหน้าคิวอาคาร ลด O(N²) จาก indexOf/scan ทุกคันในคิวใหญ่
    const qIndex = (b.exitQueue && b.exitQueue[0] === v.id) ? 0 : 1;
    if (qIndex > 0) {
      v.waitingGameMin += gameMinDt;
      if (!v.queueWakeAt || game.worldMin >= v.queueWakeAt) v.queueWakeAt = game.worldMin + BUILDING_QUEUE_RETRY_GAME_MIN;
      return;
    }
    const firstDir = (v.routeDirKeys && v.routeDirKeys[0]) || (v.path.length > 1 ? moveDirKey(v.path[0], v.path[1]) : 'idle');
    if (!v.departureRoadEntered) {
      if (!canEnterCell(v.currentIdx, v.id, firstDir, vehiclePlannedLaneFor(v, v.currentIdx, firstDir))) {
        addWaitLoad(v.currentIdx, realDt * 2.4);
        v.speedFactor = Math.min(v.speedFactor ?? 1, VEHICLE_RESTART_SPEED_FACTOR);
        v.waitingGameMin += gameMinDt;
        if (v.waitingGameMin > 60) markCitizenTravelPain(v, 'exitQueue', 1, 90, false);
        if (v.waitingGameMin > 75 && !v.exitWaitAlerted) {
          v.exitWaitAlerted = true;
          addAlert('รถรอออกจากอาคาร', `${b.name || 'อาคาร'} มีรถรอออก เพราะถนนหน้าอาคารยังไม่ว่าง`, 1, 'warn');
        }
        return;
      }
      occupyCell(v.currentIdx, v.id, firstDir, vehiclePlannedLaneFor(v, v.currentIdx, firstDir));
      v.departureRoadEntered = true;
      v.departureTimer = 0;
      v.laneDirKey = firstDir;
      v.waitingGameMin = 0;
    }
    // Patch 10: เพิ่มความเร็วแอนิเมชันตอนรถเลื่อนจากช่องจอดออกสู่ถนน
    const visualSpeed = Math.min(game.speed || 1, 2.35) * VEHICLE_SPEED_SCALE * 1.35;
    v.departureTimer += realDt * visualSpeed;
    if (v.departureTimer >= (v.departureDuration || 0.48)) {
      removeVehicleFromExitQueue(v);
      v.phase = 'driving';
      v.t = 0;
      v.nextIdx = null;
      v.pathPos = 0;
      v.departureTimer = 0;
      // หลังออกจากอาคารให้เริ่มไวพอเล่นสนุก แล้วค่อย ๆ เร่งเต็มสปีดใน moveVehicle
      v.speedFactor = VEHICLE_START_SPEED_FACTOR;
      v.turnBrakeUntil = 0;
      v.departureDoneAt = game.worldMin;
    }
  }

  function moveGateWaitingVehicle(v, realDt, gameMinDt) {
    if (!v || !road[v.currentIdx]) {
      return removeVehicleFromSimulation(v, 'ถนนหน้า Gate/จุดเริ่มถูกตัด', true);
    }
    const firstDir = v.gateQueueDirKey || (v.routeDirKeys && v.routeDirKeys[0]) || (v.path.length > 1 ? moveDirKey(v.path[0], v.path[1]) : 'idle');
    if (!isFrontStartQueueVehicle(v)) {
      v.waitingGameMin += gameMinDt;
      if (game.worldMin >= (v.queueWakeAt || 0)) {
        addWaitLoad(v.currentIdx, realDt * 0.55);
        v.queueWakeAt = game.worldMin + START_QUEUE_RETRY_GAME_MIN;
      }
      return;
    }
    if (game.worldMin < (v.queueWakeAt || 0)) {
      v.waitingGameMin += gameMinDt;
      return;
    }
    if (!canEnterCell(v.currentIdx, v.id, firstDir, vehiclePlannedLaneFor(v, v.currentIdx, firstDir))) {
      addWaitLoad(v.currentIdx, realDt * 1.8);
      v.waitingGameMin += gameMinDt;
      v.queueWakeAt = game.worldMin + START_QUEUE_RETRY_GAME_MIN;
      return;
    }
    occupyCell(v.currentIdx, v.id, firstDir, vehiclePlannedLaneFor(v, v.currentIdx, firstDir));
    v.phase = 'driving';
    v.laneDirKey = firstDir;
    v.waitingGameMin = 0;
    v.queueWakeAt = 0;
    v.speedFactor = VEHICLE_GATE_START_SPEED_FACTOR;
    v.t = 0;
    v.nextIdx = null;
  }

  function updateStuckVehicle(v, realDt, gameMinDt) {
    // Patch 17: รถติดอยู่ในเกมได้ แต่ถ้าผู้เล่นสร้าง/ลบถนนที่แตะ path เดิมจริง ๆ
    // จึงค่อยลองคำนวณใหม่หนึ่งครั้ง ไม่วนหาเส้นทางทุกเฟรม
    if (!v) return;
    v.waitingGameMin += gameMinDt;
    if (game.worldMin < (v.nextStuckCheckAt || 0)) return;
    v.nextStuckCheckAt = game.worldMin + STUCK_ROUTE_CHECK_INTERVAL_MIN;
    addWaitLoad(v.currentIdx, 0.35);

    if (maybeRecalculateVehicleRouteForPathChange(v, 'รถค้างและมีถนนเปลี่ยนแตะ path เดิม', vehicleCurrentPathBroken(v))) return;

    const ni = v.path && v.path.length ? v.path[v.pathPos + 1] : null;
    if (ni == null) {
      v.phase = 'driving';
      return;
    }

    // ถ้าผู้เล่นสร้างถนนใหม่ทับตำแหน่งเดิมของเส้นทางที่รถล็อกไว้
    // รถคันเดิมจะไปต่อได้เฉพาะบน path เดิมเท่านั้น ไม่หา path ใหม่
    if (!road[v.currentIdx] || !road[ni]) return;
    const prevIdx = v.pathPos > 0 ? v.path[v.pathPos - 1] : null;
    if (wouldUTurn(prevIdx, v.currentIdx, ni) && !vehicleCanForceThroughUTurn(v) && !canUTurnAtForVehicle(v, v.currentIdx, prevIdx)) return;
    const dirKey = (v.routeDirKeys && v.routeDirKeys[v.pathPos]) || moveDirKey(v.currentIdx, ni);
    if (!canEnterCell(ni, v.id, dirKey, vehiclePlannedLaneFor(v, ni, dirKey))) return;
    if (isBlockedByIntersectionControl(v, v.currentIdx, ni)) return;

    v.phase = 'driving';
    v.stuckReason = null;
    v.speedFactor = Math.min(v.speedFactor ?? 1, VEHICLE_RESTART_SPEED_FACTOR);
    v.lastRouteNote = 'resumed on locked path after road/cell became available';
  }

  function moveVehicle(v, realDt, gameMinDt) {
    if (v.phase === 'departing') {
      moveDepartingVehicle(v, realDt, gameMinDt);
      return;
    }
    if (v.phase === 'gate_waiting') {
      moveGateWaitingVehicle(v, realDt, gameMinDt);
      return;
    }
    if (v.phase === 'arriving') {
      v.arrivalTimer = (v.arrivalTimer || 0) + realDt * Math.min(game.speed || 1, 2.4) * VEHICLE_SPEED_SCALE * 0.68;
      if (v.arrivalTimer >= (v.arrivalDuration || 0.35)) finishVehicleArrival(v);
      return;
    }
    if (v.phase === 'fadingOut') {
      v.fadeTimer = (v.fadeTimer || 0) + realDt * Math.min(game.speed || 1, 2.2);
      if (v.fadeTimer >= (v.fadeDuration || 0.45)) finishRemoveVehicle(v);
      return;
    }
    if (v.phase === 'stuck') {
      updateStuckVehicle(v, realDt, gameMinDt);
      return;
    }
    const rd = roadDataById(road[v.currentIdx]);
    if (rd) addFlowLoad(v.currentIdx, realDt * 2.8);
    // Drop-off node หน้าอาคาร: เข้าได้เฉพาะถ้าวิ่งมาถูกเลนใกล้อาคารตาม Building Access Point
    if (isAtBuildingDropoff(v)) { arriveVehicle(v); return; }
    if (v.pathPos >= v.path.length - 1) {
      if (v.destBuildingId) {
        markVehicleStuck(v, 'อยู่เลนนอก/เข้าผิดฝั่ง จึงเข้าอาคารไม่ได้ ต้องใช้เลนใกล้อาคารเท่านั้น', 3, 'เข้าอาคารผิดเลน');
        return;
      }
      arriveVehicle(v);
      return;
    }

    if (v.nextIdx == null) {
      if (maybeRecalculateVehicleRouteForPathChange(v, 'ถนนใหม่/ถนนที่แก้ไขแตะ path เดิม', false)) return;
      const ni = v.path[v.pathPos + 1];
      if (!road[ni]) {
        if (maybeRecalculateVehicleRouteForPathChange(v, 'ถนนใน path เดิมหาย', true)) return;
        handleBlockedVehicle(v);
        return;
      }
      const prevIdx = v.pathPos > 0 ? v.path[v.pathPos - 1] : null;
      if (wouldUTurn(prevIdx, v.currentIdx, ni) && !vehicleCanForceThroughUTurn(v) && !canUTurnAtForVehicle(v, v.currentIdx, prevIdx)) {
        // Patch 26: ไม่มีการหา U-turn/route ใหม่ระหว่างวิ่งอีกแล้ว
        // ถ้าเจอบล็อกนี้แปลว่า route ที่ถูกล็อกไว้เสีย หรือถนนใน route ถูกแก้จนใช้ไม่ได้
        // ปล่อยให้ติดจริง แล้วรอเฉพาะระบบ path-touched reroute จาก road change เท่านั้น
        addWaitLoad(v.currentIdx, realDt * 2.4);
        v.waitingGameMin += gameMinDt;
        if (!v.uTurnBlockedAlerted || game.worldMin - v.uTurnBlockedAlerted > STUCK_ALERT_COOLDOWN_MIN) {
          v.uTurnBlockedAlerted = game.worldMin;
          markVehicleStuck(v, 'เส้นทางล็อกไว้เจอจุดกลับรถผิดกฎหมาย ต้องมีทางวน/4-way/ปลายถนนที่กลับรถได้ตั้งแต่ตอนสร้าง Trip', 4, 'เส้นทางล็อกผิดกฎ');
        }
        return;
      }
      const dirKey = (v.routeDirKeys && v.routeDirKeys[v.pathPos]) || moveDirKey(v.currentIdx, ni);
      if (!canEnterCell(ni, v.id, dirKey, vehiclePlannedLaneFor(v, ni, dirKey))) {
        addWaitLoad(v.currentIdx, realDt * 2.6);
        v.speedFactor = Math.min(v.speedFactor ?? 1, VEHICLE_RESTART_SPEED_FACTOR);
        v.waitingGameMin += gameMinDt;
        if (v.waitingGameMin > 14) markCitizenTravelPain(v, 'queue', 1, 70, false);
        // Patch 17: รถติดท้ายแถวให้รอ ไม่ reroute หนีรถติด
        return;
      }
      if (isBlockedByIntersectionControl(v, v.currentIdx, ni)) {
        addWaitLoad(v.currentIdx, realDt * 2.8);
        addSignalLoad(ni, realDt * 1.4);
        v.speedFactor = Math.min(v.speedFactor ?? 1, VEHICLE_RESTART_SPEED_FACTOR);
        v.waitingGameMin += gameMinDt;
        if (v.waitingGameMin > 24) markCitizenTravelPain(v, 'signal', 1, 90, false);
        return;
      }
      // Patch 13: ไม่มีระบบเบรก/คำนวณโค้งก่อนเข้าแยกแล้ว รถเข้าช่วงถนนถัดไปตามปกติ
      occupyCell(ni, v.id, dirKey, vehiclePlannedLaneFor(v, ni, dirKey));
      v.nextIdx = ni;
      v.laneDirKey = dirKey;
      v.t = 0;
      v.waitingGameMin = Math.max(0, v.waitingGameMin - gameMinDt * 0.6);
    }

    const nr = roadDataById(road[v.nextIdx]) || rd || DATA.roads.small;
    const ratio = getRoadRatio(v.nextIdx);
    // Patch 35: movementSpeed ยังตามโหมดเวลา แต่คูณ VEHICLE_SPEED_SCALE เพื่อคุมความเร็วรถรวม
    const movementSpeed = vehicleMovementMultiplier();
    const dynamicSpeed = vehicleDynamicSpeedFactor(v, realDt);
    const speed = vehicleTilesPerSecond(v, nr, ratio) * movementSpeed * VEHICLE_SPEED_SCALE * vehicleTurnSlowFactor(v) * dynamicSpeed;
    v.t += realDt * speed;
    if (v.t >= 1) {
      releaseCell(v.currentIdx, v.id);
      v.currentIdx = v.nextIdx;
      if (v.reservedIntersectionExitCell === v.currentIdx || (v.reservedIntersectionClearPos != null && v.pathPos >= v.reservedIntersectionClearPos)) {
        releaseVehicleIntersectionReservation(v);
      }
      v.pathPos++;
      v.nextIdx = null;
      v.t = 0;
      if (isPlannedJunctionCell(v.currentIdx)) addSignalLoad(v.currentIdx, 0.35);
      if (v.waitingGameMin > 18) {
        // Patch 17: รอสะสมได้ แต่ไม่คำนวณเส้นทางใหม่หลังออกเดินทาง
      }
    }
  }

  function vehicleMovementMultiplier() {
    const s = Math.max(0, game.speed || 1);
    if (s <= 1) return 1;
    if (s <= 2) return 2;
    return Math.min(s, 5);
  }

  function trafficSlowFactor(ratio) {
    // More realistic flow: cars slow down gradually, but normal density should not feel like a traffic jam.
    if (ratio <= 0.60) return 1.00;
    if (ratio <= 0.90) return 0.90;
    if (ratio <= 1.15) return 0.72;
    if (ratio <= 1.45) return 0.55;
    if (ratio <= 1.85) return 0.38;
    if (ratio <= 2.30) return 0.24;
    return 0.16;
  }


  function vehicleSegmentTurnMeta(v, nextOverride = null) {
    if (!v) return { isTurn: false, inDir: 'idle', outDir: 'idle' };
    const next = nextOverride != null ? nextOverride : v.nextIdx;
    if (next == null) return { isTurn: false, inDir: 'idle', outDir: 'idle' };
    const prev = v.pathPos > 0 ? v.path[v.pathPos - 1] : null;
    if (prev == null) return { isTurn: false, inDir: 'idle', outDir: moveDirKey(v.currentIdx, next) };
    const inDir = moveDirKey(prev, v.currentIdx);
    const outDir = moveDirKey(v.currentIdx, next);
    return { isTurn: inDir !== outDir, inDir, outDir };
  }

  function vehicleDynamicSpeedFactor(v, realDt) {
    if (!v) return 1;
    let target = 1;
    let cur = Number.isFinite(v.speedFactor) ? v.speedFactor : 1;
    const rate = VEHICLE_ACCEL_RATE * (target >= cur ? 1 : 2.4);
    cur += (target - cur) * clamp(realDt * rate, 0, 1);
    v.speedFactor = clamp(cur, VEHICLE_START_SPEED_FACTOR, 1);
    return v.speedFactor;
  }

  function vehicleTurnSlowFactor(v) {
    // Patch 13: เอาระบบรถโค้ง/ชะลอเข้าโค้งออก รถจึงไม่โดนลดสปีดเพียงเพราะเปลี่ยนทิศ
    return 1;
  }

  function vehicleTilesPerSecond(v, rd, ratio) {
    // Speed v3: road type controls top speed, congestion smoothly reduces speed.
    // Complete stops are handled only by red lights/full cells/blocked exits.
    const base = rd.lanes >= 8 ? 5.8 : rd.lanes >= 4 ? 4.55 : 3.55;
    let factor = trafficSlowFactor(ratio);
    if (v && v.nextIdx != null && isPlannedJunctionCell(v.nextIdx)) factor *= 0.92;
    return Math.max(0.35, base * factor);
  }

  function intersectionExitReservationKey(cell, dirKey, lanePos) {
    return `${cell}|${dirKey || 'idle'}|${Math.max(0, Math.floor(lanePos || 0))}`;
  }

  function reservationCellFromKey(key) {
    return Number(String(key || '').split('|')[0]);
  }

  function isIntersectionReservationStale(owner, key = null) {
    if (!owner) return true;
    if (owner.phase === 'stuck' || owner.phase === 'fadingOut' || owner.phase === 'arriving') return true;
    const keys = Array.isArray(owner.reservedIntersectionExitKeys) ? owner.reservedIntersectionExitKeys : [];
    if (key && !keys.includes(key) && owner.reservedIntersectionExitKey !== key) return true;
    if (!keys.length && !owner.reservedIntersectionExitKey) return true;
    if (owner.reservedIntersectionClearPos != null && (owner.pathPos || 0) >= owner.reservedIntersectionClearPos) return true;
    if (owner.reservedIntersectionExitCell != null && owner.currentIdx === owner.reservedIntersectionExitCell) return true;
    const born = Number.isFinite(owner.reservedIntersectionExitBornAt) ? owner.reservedIntersectionExitBornAt : game.worldMin;
    if (game.worldMin - born > INTERSECTION_RESERVATION_STALE_GAME_MIN) return true;
    return false;
  }

  function parseIntersectionExitReservationKey(key) {
    const parts = String(key || '').split('|');
    return {
      cell: Number(parts[0]),
      dirKey: parts[1] || 'idle',
      lanePos: Math.max(0, Math.floor(Number(parts[2]) || 0))
    };
  }

  function cellExitReservationBlocks(i, vehicleId, dirKey = null, lanePos = null) {
    if (!intersectionExitReservations || !intersectionExitReservations.size) return false;
    // Patch 43: lane-aware junction exit reservation.
    // Patch 39 fixed stale reservations, but it still treated "one reserved exit cell"
    // as blocking the whole road cell. That made a 4-lane direction on an 8-lane road
    // leave the signal one car at a time. Now a reservation blocks only the exact
    // direction lane it owns. Different lanes in the same direction may start together.
    let desiredDir = dirKey || null;
    let desiredLane = lanePos;
    if (desiredDir && desiredLane == null) {
      const v = vehicleById(vehicleId);
      desiredLane = v ? vehiclePlannedLaneFor(v, i, desiredDir) : 0;
    }
    if (desiredLane != null) desiredLane = Math.max(0, Math.floor(desiredLane || 0));

    const prefix = `${i}|`;
    for (const [key, ownerId] of [...intersectionExitReservations.entries()]) {
      if (!key.startsWith(prefix)) continue;
      if (ownerId === vehicleId) continue;
      const owner = vehicleById(ownerId);
      if (isIntersectionReservationStale(owner, key)) {
        if (owner) releaseVehicleIntersectionReservation(owner);
        else intersectionExitReservations.delete(key);
        continue;
      }

      // If the caller does not know its direction/lane, stay conservative.
      // Movement calls normally provide both after Patch 43.
      if (!desiredDir || desiredLane == null) return true;

      const reserved = parseIntersectionExitReservationKey(key);
      if (reserved.dirKey === desiredDir && reserved.lanePos === desiredLane) return true;
    }
    return false;
  }

  function plannedIntersectionClearCells(plan) {
    if (!plan) return [];
    if (Array.isArray(plan.reserveCells) && plan.reserveCells.length) return plan.reserveCells.filter(c => c != null && road[c]);
    if (plan.clearIdx != null && road[plan.clearIdx]) return [plan.clearIdx];
    if (plan.exitIdx != null && road[plan.exitIdx]) return [plan.exitIdx];
    return [];
  }

  function reserveIntersectionExit(v, plan, exitDir, lanePos) {
    if (!v || !plan) return true;
    const cells = plannedIntersectionClearCells(plan);
    if (!cells.length) return true;
    const keys = cells.map(cell => intersectionExitReservationKey(cell, exitDir, lanePos));
    for (const key of keys) {
      const current = intersectionExitReservations.get(key);
      if (current != null && current !== v.id) return false;
    }
    // If the car already held a different junction reservation, clear it first.
    // This cannot create a route search; it only releases old bookkeeping.
    releaseVehicleIntersectionReservation(v);
    for (const key of keys) intersectionExitReservations.set(key, v.id);
    v.reservedIntersectionExitKeys = keys;
    v.reservedIntersectionExitKey = keys[0] || null; // legacy inspector/debug field
    v.reservedIntersectionExitCell = plan.clearIdx != null ? plan.clearIdx : cells[cells.length - 1];
    v.reservedIntersectionExitCells = cells;
    v.reservedIntersectionExitBornAt = game.worldMin;
    v.reservedIntersectionJunctionIdx = plan.junctionIdx;
    v.reservedIntersectionClearPos = Number.isFinite(plan.clearPos) ? plan.clearPos : null;
    v.reservedIntersectionEnterPos = Number.isFinite(plan.enterPos) ? plan.enterPos : null;
    return true;
  }

  function releaseVehicleIntersectionReservation(v) {
    if (!v) return;
    const keys = [];
    if (Array.isArray(v.reservedIntersectionExitKeys)) keys.push(...v.reservedIntersectionExitKeys);
    if (v.reservedIntersectionExitKey) keys.push(v.reservedIntersectionExitKey);
    for (const key of [...new Set(keys)]) {
      const owner = intersectionExitReservations.get(key);
      if (owner === v.id) intersectionExitReservations.delete(key);
    }
    v.reservedIntersectionExitKeys = null;
    v.reservedIntersectionExitKey = null;
    v.reservedIntersectionExitCell = null;
    v.reservedIntersectionExitCells = null;
    v.reservedIntersectionExitBornAt = null;
    v.reservedIntersectionJunctionIdx = null;
    v.reservedIntersectionClearPos = null;
    v.reservedIntersectionEnterPos = null;
  }

  function cleanupIntersectionReservations() {
    // Throttled safety net. Normal movement releases reservations when the owner
    // reaches the clear cell, but removed/stuck/old vehicles must never leave a
    // permanent block at a junction. Patch 39 also clears reservations that have
    // been held too long while the owner is still alive.
    if (!intersectionExitReservations || !intersectionExitReservations.size) return;
    if (game.worldMin < nextIntersectionReservationCleanupAt) return;
    nextIntersectionReservationCleanupAt = game.worldMin + INTERSECTION_RESERVATION_CLEANUP_GAME_MIN;
    for (const [key, ownerId] of [...intersectionExitReservations.entries()]) {
      const owner = vehicleById(ownerId);
      if (isIntersectionReservationStale(owner, key)) {
        if (owner) releaseVehicleIntersectionReservation(owner);
        else intersectionExitReservations.delete(key);
      }
    }
  }

  function isRedForMove(from, to) {
    // Legacy wrapper kept for inspector/debug paths. Vehicle movement uses
    // isBlockedByIntersectionControl() so every car follows the precomputed
    // createTrip() intersection plan instead of deciding a junction plan mid-route.
    if (!isSignalControlledJunction(to)) return false;
    if (isSignalControlledJunction(from)) return false;
    const st = signalState(to);
    if (st.allRed) return true;
    return moveAxis(from, to) !== st.phase;
  }

  function intersectionPlanForVehicleMove(v, from, to) {
    if (!v || !Array.isArray(v.intersectionPlan)) return null;
    const p = v.pathPos || 0;
    const direct = v.intersectionPlanByEnterPos && v.intersectionPlanByEnterPos[p];
    if (direct && direct.fromIdx === from && direct.junctionIdx === to) return direct;
    // Recovery for vehicles created before a route-meta rebuild or after a path-touched reroute.
    // This only reads the already locked path; it never searches a new route.
    return v.intersectionPlan.find(plan => plan && plan.enterPos === p && plan.fromIdx === from && plan.junctionIdx === to) || null;
  }

  function majorTrafficBlocksYieldPlan(v, plan) {
    if (!v || !plan || !plan.yieldControlled) return false;
    // Vehicles already on the through/major axis do not yield in the first pass.
    if (plan.axis === plan.majorAxis) return false;
    const cells = Array.isArray(plan.conflictProbeCells) ? plan.conflictProbeCells : [];
    for (const cell of cells) {
      const ids = allVehicleIdsInCell(cell);
      for (const id of ids) {
        if (id === v.id) continue;
        const other = vehicleById(id);
        if (!other) return true;
        const otherNext = other.nextIdx != null ? other.nextIdx : (other.path && other.path[other.pathPos + 1]);
        const otherAxis = otherNext != null ? moveAxis(other.currentIdx, otherNext) : null;
        if (otherAxis === plan.majorAxis) return true;
      }
    }
    return false;
  }

  function isBlockedByIntersectionControl(v, from, to) {
    if (!isPlannedJunctionCell(to)) return false;
    // Once a car is inside a junction box, it must be allowed to clear the box.
    if (isPlannedJunctionCell(from)) return false;

    const plan = intersectionPlanForVehicleMove(v, from, to);
    if (!plan) {
      if (v) {
        v.waitingGameMin += 0.01;
        markVehicleStuck(v, 'รถมาถึงทางแยกแต่ไม่มี junction plan จากตอนสร้าง Trip: route ต้องถูกคำนวณใหม่เฉพาะเมื่อถนนใน path เปลี่ยนเท่านั้น', 4, 'junction plan missing');
      }
      return true;
    }

    if (plan.controlled) {
      const st = signalState(to);
      const axis = Number.isFinite(plan.axis) ? plan.axis : moveAxis(from, to);
      if (st.allRed || axis !== st.phase) return true;

      // Yellow rule: cars that have not already reserved/started the box should stop.
      // This prevents late entries into a mixed-width/T-junction box while still letting cars clear it.
      if (st.yellow && !(v && v.intersectionCommitAt === to && v.intersectionCommitPos === (v.pathPos || 0))) return true;
    } else if (plan.yieldControlled) {
      // Small-road T-junction: no traffic light, but minor movement must wait for a
      // tiny, precomputed probe zone on the major road. No pathfinding or network scan here.
      if (majorTrafficBlocksYieldPlan(v, plan)) {
        if (v) v.lastIntersectionBlock = `yield-major:${plan.junctionIdx}`;
        return true;
      }
    }

    // Box-clear rule: green/yield is not enough; the exit cell after the junction must also be open.
    // The exit was planned at createTrip(). We only test occupancy here, not route alternatives.
    if (plan.exitIdx != null && road[plan.exitIdx]) {
      const exitDir = plan.exitDirKey || moveDirKey(to, plan.exitIdx);
      const clearCells = plannedIntersectionClearCells(plan);
      for (const cell of clearCells) {
        const lane = v ? vehiclePlannedLaneFor(v, cell, exitDir) : 0;
        if (!canEnterCell(cell, v ? v.id : 0, exitDir, lane)) {
          if (v) {
            v.intersectionExitBlockedAt = game.worldMin;
            v.lastIntersectionBlock = `exit-full:${plan.junctionIdx}->${cell}`;
          }
          return true;
        }
      }
      const reserveLane = v ? vehiclePlannedLaneFor(v, clearCells[0] || plan.exitIdx, exitDir) : 0;
      if (v && !reserveIntersectionExit(v, plan, exitDir, reserveLane)) {
        v.intersectionExitBlockedAt = game.worldMin;
        v.lastIntersectionBlock = `exit-reserved:${plan.junctionIdx}->${plan.clearIdx || plan.exitIdx}`;
        return true;
      }
    }

    if (v && plan) {
      v.intersectionCommitAt = plan.junctionIdx;
      v.intersectionCommitPos = v.pathPos || 0;
      v.currentIntersectionPlanId = plan.id;
    }
    return false;
  }

  function makeFallbackIntersectionMovePlan(v, from, to) {
    // Patch 31: disabled by design. Junction plans must be created with the locked trip route.
    // Keeping this function as a named stub prevents accidental route/plan generation while driving.
    return null;
  }

  function tryReroute(v, force = false) {
    // Patch 17: ปิด reroute ทั่วไป ฟังก์ชัน reroute เฉพาะเงื่อนไขอยู่ที่ maybeRecalculateVehicleRouteForPathChange()
    if (v) v.lastRouteNote = 'general reroute disabled; only path-touched road changes can recalc';
    return false;
  }

  function vehicleArrivalTargetPoint(v) {
    const base = roadCellVisualCenterWorld(v.currentIdx);
    if (v.destBuildingId) {
      const b = buildingById(v.destBuildingId);
      if (b) {
        // รถเข้าตึกให้เลี้ยวเข้าจากขอบถนนฝั่งอาคารจริง แล้วค่อยไปจอดในอาคาร
        return drivewayPointForBuilding(b, v.currentIdx);
      }
    }
    if (v.targetGateId || v.gateId) {
      const g = gates.find(x => x.id === (v.targetGateId || v.gateId));
      if (g) return { x: g.x, y: g.y };
    }
    return base;
  }

  function beginVehicleArrival(v) {
    if (!v || v.phase === 'arriving') return;
    releaseVehicleIntersectionReservation(v);
    clearNextCell(v);
    releaseCell(v.currentIdx, v.id);
    v.phase = 'arriving';
    v.arrivalTimer = 0;
    v.arrivalDuration = v.destBuildingId ? 0.92 : 0.46;
    if (v.destBuildingId) {
      const b = buildingById(v.destBuildingId);
      v.arrivalFromPoint = b ? roadPointForBuildingEntrance(b, v.currentIdx) : roadCellVisualCenterWorld(v.currentIdx);
    } else {
      v.arrivalFromPoint = roadCellVisualCenterWorld(v.currentIdx);
    }
    v.arrivalToPoint = vehicleArrivalTargetPoint(v);
    v.t = 0;
    v.nextIdx = null;
  }

  function arriveVehicle(v) {
    beginVehicleArrival(v);
  }

  function finishVehicleArrival(v) {
    finishRemoveVehicle(v);
    if (v.type === 'PassThroughTrip') return;
    const c = v.citizenId ? citizenById(v.citizenId) : null;
    if (!c || c.removed) return;
    c.currentVehicleId = null;
    const b = v.destBuildingId ? buildingById(v.destBuildingId) : null;
    if (b && v.type !== 'MoveOutTrip' && v.type !== 'PassThroughTrip') addParkedCarToBuilding(b, v);
    if (v.type === 'MoveInTrip') {
      if (b) {
        fulfillVehicleReservation(v);
        b.residents++;
        b.citizenIds.push(c.id);
        b.arrivals++;
        c.resident = true;
        c.hasHomeArrived = true;
        c.location = `building:${b.id}`;
        c.state = 'อยู่บ้าน';
        clearPendingAction(c);
        // Patch 25: รถย้ายเข้าถึงบ้านแล้วต้องจับคู่งาน/ปลุก demand งานจากออฟฟิศเดิมทันที
        // ไม่ต้องรอให้ผู้เล่นสร้างออฟฟิศใหม่เพื่อ trigger wakeCityDemandAfterBuildingAdded().
        activateNewResidentAfterMoveIn(c);
        if (!c.scheduleNote) c.scheduleNote = 'เพิ่งย้ายเข้าบ้านวันนี้ • เริ่มตารางชีวิตและหางานจากอาคารที่มีอยู่แล้ว';
      }
    } else if (v.type === 'WorkTrip') {
      releaseVehicleReservation(v, 'unexpected work arrival');
      if (b) b.arrivals++;
      c.location = `building:${b.id}`;
      c.state = game.worldMin > v.deadline ? 'อยู่ที่ทำงาน (มาสาย)' : 'อยู่ที่ทำงาน';
      clearPendingAction(c, 'goWork');
      if (game.worldMin > v.deadline && b) { b.delayed = (b.delayed || 0) + 1; c.lateToday = true; c.lateTaxPenalty = true; c.lateCountToday = (c.lateCountToday || 0) + 1; game.lateTripsToday++; }
      // Patch 12: +20 ยังให้รางวัลแรงเมื่อไปทำงานทัน แต่ไม่ดันเกิน 92 เพื่อกันความสุขล้นตลอด
      c.satisfaction = game.worldMin > v.deadline ? clamp(c.satisfaction - LATE_WORK_ARRIVAL_SAT_PENALTY, 0, 100) : Math.min(92, c.satisfaction + 20);
      // Patch 20: ถ้ารถติดจนถึงที่ทำงานหลังเวลาเลิกงานแล้ว อย่าปล่อยให้ชีวิตค้าง
      // ให้สร้าง afterWork/return-home demand ต่อทันทีผ่าน pending action สั้น ๆ
      const workEndAbs = absAt(absDay(), c.profile.workEndAt);
      if (game.worldMin >= workEndAbs + 5) {
        queueLifeAction(c, 'afterWork', {}, 'มาถึงงานหลังเวลาเลิกงาน');
        pushEvent(game.worldMin + 1, 'runQueuedAction', { citizenId: c.id });
      }
    } else if (v.type === 'LeisureTrip') {
      if (b) {
        fulfillVehicleReservation(v);
        b.visitors++;
        b.arrivals++;
        c.location = `building:${b.id}`;
        c.state = `อยู่${kindName(b.kind)}`;
        clearPendingAction(c, 'leisure');
        if (game.worldMin > v.deadline && b) { b.delayed = (b.delayed || 0) + 1; c.lateToday = true; c.lateTaxPenalty = true; c.lateCountToday = (c.lateCountToday || 0) + 1; game.lateTripsToday++; }
        // Patch 12: +15 จากกิจกรรมช่วยฟื้นความสุข แต่ตันที่ 94 เพื่อให้ปัญหายังมีน้ำหนัก
        c.satisfaction = game.worldMin > v.deadline ? clamp(c.satisfaction - LATE_LEISURE_ARRIVAL_SAT_PENALTY, 0, 100) : Math.min(94, c.satisfaction + 15);
        const leaveAt = game.worldMin > (v.activityEnd || 0) ? game.worldMin + 45 : (v.activityEnd || game.worldMin + 120);
        pushEvent(leaveAt, 'returnHome', { citizenId: c.id, reason: 'จบกิจกรรม' });
      }
    } else if (v.type === 'ReturnHomeTrip') {
      releaseVehicleReservation(v, 'returned home');
      if (b) b.arrivals++;
      c.location = `building:${c.homeId}`;
      c.state = 'อยู่บ้าน';
      clearPendingAction(c, 'returnHome');
      // Patch 12: กลับถึงบ้าน +5 แต่ตันที่ 90 ไม่ให้แค่กลับบ้านก็เต็ม 100 ทุกวัน
      c.satisfaction = Math.min(90, c.satisfaction + 5);
    } else if (v.type === 'MoveOutTrip') {
      releaseVehicleReservation(v, 'move out');
      const home = buildingById(c.homeId);
      if (home) {
        home.residents = Math.max(0, home.residents - 1);
        home.citizenIds = home.citizenIds.filter(id => id !== c.id);
      }
      const work = buildingById(c.workId);
      if (work) {
        work.employees = Math.max(0, work.employees - 1);
        work.workerIds = work.workerIds.filter(id => id !== c.id);
      }
      c.removed = true;
      c.resident = false;
      c.hasHomeArrived = false;
      const g = gates.find(x => x.id === v.gateId);
      if (g) g.outToday++;
    }

    // Patch 23: ถ้ามี demand ที่ถูกจำไว้ระหว่างยังอยู่บนรถ ให้ยิงหลัง Trip จบเพียงครั้งเดียว
    // ยกเว้น MoveInTrip เพราะรถเข้าบ้านใหม่ต้องจบสนิท ไม่เริ่มคำนวณทริปต่อทันที
    if (c && c.queuedLifeAction && v.type !== 'MoveInTrip') {
      pushEvent(game.worldMin + 1, 'runQueuedAction', { citizenId: c.id });
    }
  }

  function decayTraffic(realDt) {
    const flowDecay = Math.pow(0.90, realDt * 4);
    const waitDecay = Math.pow(0.72, realDt * 4);
    const signalDecay = Math.pow(0.76, realDt * 4);
    if (!activeTrafficCells.size) return;
    for (const i of Array.from(activeTrafficCells)) {
      if (!road[i]) {
        flowLoad[i] = 0; waitLoad[i] = 0; signalPassLoad[i] = 0;
        activeTrafficCells.delete(i);
        continue;
      }
      flowLoad[i] = flowLoad[i] > 0.01 ? flowLoad[i] * flowDecay : 0;
      waitLoad[i] = waitLoad[i] > 0.01 ? waitLoad[i] * waitDecay : 0;
      signalPassLoad[i] = signalPassLoad[i] > 0.01 ? signalPassLoad[i] * signalDecay : 0;
      if (flowLoad[i] === 0 && waitLoad[i] === 0 && signalPassLoad[i] === 0) activeTrafficCells.delete(i);
    }
  }

  function purgePastTripEvents() {
    // Stable fix: do not keep old daily events after skip mode.
    // Keeping a past daily event made dailyTick() run twice after returning to normal speed.
    events = events.filter(ev => ev.time >= game.worldMin);
    if (!events.some(ev => ev.type === 'daily')) {
      pushEvent(absAt(absDay() + 1, 0), 'daily', null);
    }
  }

  function settleVehiclesForSkip() {
    // Stable fix: summarize every active vehicle through the same arrival logic
    // used by real driving. This prevents ghost citizens, missing visitors,
    // and MoveOut citizens staying counted after skip mode.
    const list = vehicles.slice();
    for (const v of list) {
      clearNextCell(v);
      releaseCell(v.currentIdx, v.id);
      if (v.phase === 'departing') removeVehicleFromExitQueue(v);

      if (v.type === 'PassThroughTrip') {
        releaseVehicleReservation(v, 'skip summary');
        const c = v.citizenId ? citizenById(v.citizenId) : null;
        if (c && c.currentVehicleId === v.id) c.currentVehicleId = null;
        finishRemoveVehicle(v);
        continue;
      }

      finishVehicleArrival(v);
    }
    reconcileBuildingReservations();
    syncHomeResidentCounts();
  }

  function applySkipTrafficHeat(realDt) {
    const hour = minuteOfDay() / 60;
    const rush = (hour >= 6 && hour <= 10) || (hour >= 16.5 && hour <= 20) ? 1.9 : (hour >= 11 && hour <= 15 ? 1.05 : 0.55);
    for (const g of gates) {
      if (g.entrance != null && road[g.entrance]) addFlowLoad(g.entrance, realDt * 4.5 * rush);
    }
    for (const i of roadIndices) {
      if (mainRoad[i]) addFlowLoad(i, realDt * 0.42 * rush);
    }
    for (const b of buildings) {
      if (b.entrance == null || !road[b.entrance]) continue;
      const t = buildingType(b);
      const weight = (t.residents || 0) * 0.10 + (t.jobs || 0) * 0.07 + (t.service || 0) * 0.045;
      if (weight <= 0) continue;
      const load = realDt * weight * rush;
      addFlowLoad(b.entrance, load);
      if (load > 0.35) addWaitLoad(b.entrance, load * 0.18);
      for (const n of linkedNeighbors(b.entrance).slice(0, 3)) addFlowLoad(n, load * 0.34);
    }
  }

  function updateSkipMode(realDt, gameMinDt) {
    const beforeDay = absDay();
    game.worldMin += gameMinDt;
    applySkipTrafficHeat(realDt);
    decayTraffic(realDt * 0.8);
    if (absDay() !== beforeDay) {
      dailyTick();
      events = events.filter(ev => !(ev.type === 'daily' && ev.time <= game.worldMin));
      if (!events.some(ev => ev.type === 'daily')) pushEvent(absAt(absDay() + 1, 0), 'daily', null);
      purgePastTripEvents();
    }
    if (game.skipTarget != null && game.worldMin >= game.skipTarget) {
      game.worldMin = game.skipTarget;
      purgePastTripEvents();
      game.speed = 1; game.skipMode = false; game.skipTarget = null; updateSpeedButtons();
      addAlert('ข้ามวันเสร็จ', 'โหมดสรุปไม่สร้างรถจริง และแสดงสีความหนาแน่นถนนแทน', 1, 'good');
    }
  }

  function update(realDt) {
    if (game.speed === 0) return;
    const gameMinDt = realDt * 2 * game.speed;
    if (game.skipMode) { updateSkipMode(realDt, gameMinDt); return; }
    game.worldMin += gameMinDt;
    processEvents();
    game.pendingActionRealTick = (game.pendingActionRealTick || 0) + realDt;
    if (game.pendingActionRealTick >= MAX_PENDING_ACTION_SCAN_INTERVAL_REAL_SEC) {
      game.pendingActionRealTick = 0;
      processPendingActions();
    }
    immigrationManager(gameMinDt);
    passThroughManager(gameMinDt);

    // Patch 48: คืน physics รถเป็น 60Hz เพื่อให้ภาพรถออกตัว/เลี้ยว/ไหลตามถนนลื่นขึ้น
    // ยังใช้ accumulator กัน dt กระชากเมื่อ browser หน่วงชั่วคราว
    game.vehicleSimAccumReal = (game.vehicleSimAccumReal || 0) + realDt;
    game.vehicleSimAccumGame = (game.vehicleSimAccumGame || 0) + gameMinDt;
    if (game.vehicleSimAccumReal >= VEHICLE_SIM_INTERVAL_REAL_SEC) {
      const vr = game.vehicleSimAccumReal;
      const vg = game.vehicleSimAccumGame;
      game.vehicleSimAccumReal = 0;
      game.vehicleSimAccumGame = 0;
      updateVehicles(vr, vg);
    } else {
      game.vehicleUpdatedLastFrame = 0;
      game.vehicleSleptLastFrame = 0;
    }

    decayTraffic(realDt);
  }

  function computeStats() {
    reconcileBuildingReservations();
    syncHomeResidentCounts();
    const population = citizens.filter(isCountedPopulation).length;
    const movingIn = citizens.filter(c => !isCountedPopulation(c) && !c.removed && c.state === 'กำลังย้ายเข้า').length;
    const unemployed = citizens.filter(c => isCountedPopulation(c) && c.profile.workDays.length && !c.workId).length;
    const jobCap = buildings.reduce((s,b) => s + buildingType(b).jobs, 0);
    const jobsUsed = buildings.reduce((s,b) => s + b.employees, 0);
    const jobVac = Math.max(0, jobCap - jobsUsed);
    const avgSat = population ? citizens.filter(isCountedPopulation).reduce((s,c)=>s+c.satisfaction,0) / population : 100;
    let ratioSum = 0, rc = 0;
    for (const i of roadIndices) {
      if (!road[i]) continue;
      ratioSum += Math.min(2, getRoadRatio(i));
      rc++;
    }
    const avgRatio = rc ? ratioSum / rc : 0;
    const trafficFlow = clamp(100 - avgRatio * 65, 0, 100);
    const taxResidents = citizens.filter(c => isCountedPopulation(c) && !c.movingOut);
    const fullResidentTax = taxResidents.reduce((s, c) => s + (c.profile ? c.profile.tax : 0), 0);
    const residentTax = taxResidents.reduce((s, c) => s + citizenDailyTax(c), 0);
    const taxLost = Math.max(0, fullResidentTax - residentTax);
    const businessTax = buildings.reduce((s, b) => s + b.employees * 50, 0);
    const roadMaintenance = computeRoadMaintenance();
    const buildingMaintenance = buildings.reduce((s,b)=>s+buildingType(b).maintenance,0);
    const maintenance = roadMaintenance + buildingMaintenance;
    const lateResidents = taxResidents.filter(c => c.lateTaxPenalty || c.lateToday).length;
    const activeTrips = vehicles.length;
    const queuedTrips = vehicles.filter(v => v.phase === 'gate_waiting' || (v.phase === 'departing' && !v.departureRoadEntered)).length;
    const roadCars = vehicles.filter(v => v.phase === 'driving' || v.nextIdx != null || (v.phase === 'departing' && v.departureRoadEntered)).length;
    const arrivingTrips = vehicles.filter(v => v.phase === 'arriving').length;
    const stuckTrips = vehicles.filter(v => v.phase === 'stuck').length;
    const demandRows = computeDemandSummary();
    const demandShortage = demandRows.reduce((sum, d) => sum + Math.max(0, d.shortage || 0), 0);
    return { population, movingIn, unemployed, jobVac, avgSat, trafficFlow, residentTax, businessTax, maintenance, roadMaintenance, buildingMaintenance, taxLost, lateResidents, activeTrips, queuedTrips, roadCars, arrivingTrips, stuckTrips, demandShortage };
  }

  function getCachedProblemRows(force = false) {
    const now = performance.now ? performance.now() : Date.now();
    if (force || !Array.isArray(game.problemRowsCache) || now - (game.problemRowsCacheAt || 0) > PROBLEM_EXPLORER_REFRESH_MS) {
      game.problemRowsCache = problemExplorerImmediateRows();
      game.problemRowsCacheAt = now;
    }
    return game.problemRowsCache || [];
  }

  function renderStats() {
    const s = computeStats();
    game.lastStats = s;
    const net = s.residentTax + s.businessTax - s.maintenance;
    const latePct = s.population ? Math.round((s.lateResidents || 0) / s.population * 100) : 0;
    const problemNow = getCachedProblemRows(false);
    const rows = [
      { icon:'💰', label:'เงิน', value:formatCompact(game.money), cls:game.money < 0 ? 'bad' : 'good', inspect:'money' },
      { icon:'👥', label:'ประชากร', value:formatCompact(s.population), cls:s.population ? 'good' : 'bad', inspect:'population' },
      // v0.8.7: หมวดปัญหาแยกจากประชากร นับเฉพาะเคสที่ควรตรวจจริง
      { icon:'⚠️', label:'ปัญหา', value:problemNow.length ? `ต้องตรวจ ${problemNow.length}` : 'ปกติ', cls:problemNow.length ? 'warn problem-card' : 'good problem-card', inspect:'problem' },
      { icon:'😊', label:'ความสุข', value:`${Math.round(s.avgSat)}%`, cls:kpiState(s.avgSat, 80, 50), inspect:'happiness' },
      { icon:'📌', label:'ความต้องการ', value:s.demandShortage ? `${s.demandShortage}` : 'ปกติ', cls:s.demandShortage ? 'warn' : 'good', inspect:'demand' },
      { icon:'🛣', label:'จราจร', value:`ถนน ${s.roadCars || 0} / คิว ${s.queuedTrips || 0}`, cls:kpiState(latePct, 5, 25, true), inspect:'road' },
    ];
    statsEl.innerHTML = rows.map(r => `<div class="stat ${r.cls || ''} ${r.inspect ? 'clickable' : ''}" ${r.inspect ? `data-inspect="${r.inspect}"` : ''}><span class="label">${r.icon} ${r.label}</span><b>${r.value}</b></div>`).join('');
    return s;
  }

  function inspectMoneySummary() {
    const s = game.lastStats || computeStats();
    const net = (s.residentTax || 0) + (s.businessTax || 0) - (s.maintenance || 0);
    const taxResidents = citizens.filter(c => isCountedPopulation(c) && !c.movingOut);
    const fullPay = taxResidents.filter(c => !(c.lateTaxPenalty || c.lateToday)).length;
    const latePay = taxResidents.length - fullPay;
    selectionEl.innerHTML = `<div class="inspector-title">💰 รายงานเงิน</div>
      <div class="metric-grid">
        ${toolMetric('เงินปัจจุบัน', `${formatMoney(game.money)} บาท`)}
        ${toolMetric('สุทธิ/วัน', `${net >= 0 ? '+' : ''}${formatMoney(net)} บาท`)}
        ${toolMetric('รายรับ/วัน', `${formatMoney((s.residentTax||0)+(s.businessTax||0))} บาท`)}
        ${toolMetric('รายจ่าย/วัน', `${formatMoney(s.maintenance||0)} บาท`)}
      </div>
      <div class="panel-subtitle">รายรับ</div>
      <div class="breakdown-list">
        <div class="breakdown-row"><b><span>ภาษีประชากร</span><span>+${formatMoney(s.residentTax||0)}</span></b><div class="muted">เก็บเต็มจำนวน ${fullPay} คน • โดนหักล่าช้า ${latePay} คน • รายได้หาย ${formatMoney(s.taxLost||0)} บาท</div></div>
        <div class="breakdown-row"><b><span>ภาษีธุรกิจ/งาน</span><span>+${formatMoney(s.businessTax||0)}</span></b><div class="muted">คำนวณจากจำนวนพนักงานในอาคารงาน/บริการ</div></div>
      </div>
      <div class="panel-subtitle">รายจ่าย</div>
      <div class="breakdown-list">
        <div class="breakdown-row"><b><span>ค่าถนน</span><span>-${formatMoney(s.roadMaintenance||0)}</span></b><div class="muted">ถนนหลัก 8 เลนเริ่มเกมไม่คิดค่าบำรุง ส่วนถนนที่สร้างเพิ่มคิดตามชนิดถนน</div></div>
        <div class="breakdown-row"><b><span>รายจ่ายอื่น</span><span>รอปรับปรุง</span></b><div class="muted">ในอนาคตสามารถเพิ่มค่าบริการเมือง ค่าขนส่งสาธารณะ หรือค่าบำรุงอาคารเพิ่มเติมได้</div></div>
      </div>`;
  }

  function inspectRoadSummary() {
    const s = game.lastStats || computeStats();
    const pop = Math.max(1, s.population || 0);
    const latePct = Math.round((s.lateResidents || 0) / pop * 100);
    const rows = computeTravelDemandByTime();
    selectionEl.innerHTML = `<div class="inspector-title">🛣 รายงานถนนและเวลาเดินทาง</div>
      <div class="metric-grid">
        ${toolMetric('Traffic Flow', `${Math.round(s.trafficFlow || 0)}%`)}
        ${toolMetric('ล่าช้า', `${latePct}% (${s.lateResidents || 0} คน)`)}
        ${toolMetric('รถบนถนนจริง', `${s.roadCars || 0} คัน`)}
        ${toolMetric('รอคิวออก', `${s.queuedTrips || 0} คัน`)}
        ${toolMetric('Trip ทั้งหมด', `${s.activeTrips || 0} คัน`)}
        ${toolMetric('ค่าถนน/วัน', `${formatMoney(s.roadMaintenance || 0)} บาท`)}
      </div>
      <div class="panel-subtitle">ช่วงเวลาไหน คนอยากไปไหนมากที่สุด</div>
      <div class="breakdown-list">
        ${rows.length ? rows.map(r => `<div class="breakdown-row"><b><span>${escapeHtml(r.time)}</span><span>${r.count} คน</span></b><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div><div class="muted" style="margin-top:5px">ปลายทางหลัก: ${escapeHtml(r.label)}</div></div>`).join('') : '<div class="card muted">ยังไม่มีประชากรพอสำหรับสรุปช่วงเวลาเดินทาง</div>'}
      </div>`;
  }

  function computeTravelDemandByTime() {
    const buckets = new Map();
    const add = (bucket, label, n=1) => {
      if (!bucket || !label || n <= 0) return;
      const key = `${bucket}|${label}`;
      buckets.set(key, (buckets.get(key) || 0) + n);
    };
    const residents = citizens.filter(isCountedPopulation);
    for (const c of residents) {
      const p = c.profile || {};
      if (p.workDays && p.workDays.length && c.workId) add('06:00–10:30', 'ไปทำงาน/ออฟฟิศ/โรงงาน');
      if (p.afterWork) add('17:00–21:30', `ไป${kindName(p.afterWork)}หลังเลิกงาน`);
      if (p.weekendKind) add('09:00–16:00', `ไป${kindName(p.weekendKind)}วันหยุด`);
      if (p.trait === 'บ้านรวย') add('14:00–03:00', 'เที่ยว/กิน/ห้าง/ผับ');
    }
    const merged = new Map();
    for (const [key, count] of buckets.entries()) {
      const [time,label] = key.split('|');
      const cur = merged.get(time) || { time, label, count:0, topCount:0 };
      cur.count += count;
      if (count > cur.topCount) { cur.topCount = count; cur.label = label; }
      merged.set(time, cur);
    }
    const rows = [...merged.values()].sort((a,b)=>b.count-a.count).slice(0,5);
    const max = Math.max(1, ...rows.map(r=>r.count));
    return rows.map(r => ({ ...r, pct: Math.round(r.count / max * 100) }));
  }

  function inspectPopulationSummary() {
    const residents = citizens.filter(isCountedPopulation);
    const workers = residents.filter(c => c.profile.workDays.length);
    const unemployed = workers.filter(c => !c.workId);
    const traitCounts = new Map();
    for (const c of residents) traitCounts.set(c.profile.trait, (traitCounts.get(c.profile.trait) || 0) + 1);
    const traitRows = ['ขยัน','ชิล ๆ','สายชิล','บ้านรวย'].map(tr => {
      const count = traitCounts.get(tr) || 0;
      const pct = residents.length ? Math.round(count / residents.length * 100) : 0;

      .map(b => ({ b, t: buildingType(b), free: buildingType(b).jobs - b.employees }))

      .slice(0, 8);
    selectionEl.innerHTML = `<div class="inspector-title">👥 สรุปประชากร</div>
      <div class="muted">ข้อมูลนี้คำนวณจาก Citizen และอาคารจริงใน Simulation</div>
      <div class="metric-grid">
        ${toolMetric('ประชากรทั้งหมด', `${residents.length} คน`)}
        ${toolMetric('กำลังย้ายเข้า', `${game.lastStats ? game.lastStats.movingIn : 0} คน`)}
        ${toolMetric('คนที่ต้องทำงาน', `${workers.length} คน`)}
        ${toolMetric('ว่างงาน', `${unemployed.length} คน`)}
        ${toolMetric('งานว่างรวม', `${game.lastStats ? game.lastStats.jobVac : 0} ตำแหน่ง`)}
        ${toolMetric('ภาษีประชากร', `${formatMoney(game.lastStats ? game.lastStats.residentTax : 0)} /วัน`)}
      </div>
      <div class="panel-subtitle">อุปนิสัยประชากร</div>
      <div class="breakdown-list">${traitRows || '<div class="muted">ยังไม่มีประชากร</div>'}</div>

      <div class="vacancy-list">${vacancies.length ? vacancies.map(x => `<div class="vacancy-item"><b>${escapeHtml(x.t.name)} #${x.b.id}</b><br><span class="muted">ตำแหน่งว่าง ${x.free}/${x.t.jobs} • พิกัด ${x.b.x}, ${x.b.y}</span></div>`).join('') : '<div class="muted">ยังไม่มีงานว่าง หรือยังไม่มีอาคารงาน</div>'}</div>`;
  }

  function citizenDashboardLabel(mode) {
    return ({
      traffic:'รถติด / ค้างถนน',
      late:'ไปสาย / เสียภาษี',
      happiness:'ความสุขลด',
      nojob:'ไม่มีงาน',
      long:'เดินทางไกลเกินไป',
      movingfail:'ย้ายเข้าไม่สำเร็จ',
      building:'อาคารมีปัญหา',
      road:'ถนนคอขวด'
    })[mode] || 'ปัญหา';
  }

  function citizenDashboardIcon(mode) {
    return ({ traffic:'🚗', late:'⏱', happiness:'😟', nojob:'💼', long:'🧭', movingfail:'🏠', building:'🏢', road:'🛣' })[mode] || '⚠️';
  }

  function citizenProblemBase() {
    return citizens.filter(c => !c.removed && (c.resident || c.state === 'กำลังย้ายเข้า' || c.movingOut));
  }

  function isNormalMovingInCitizen(c) {
    if (!c || c.removed || c.resident || c.movingOut) return false;
    if (c.state !== 'กำลังย้ายเข้า') return false;
    const v = currentVehicleOfCitizen(c);
    // ย้ายเข้าที่กำลังวิ่งไปบ้านเป็นสถานะปกติ ไม่ใช่ปัญหา
    if (v && v.type === 'MoveInTrip' && !v.lateAlerted && (v.waitingGameMin || 0) < 18 && !(c.lateToday || c.lateTaxPenalty) && !(c.trafficPainToday || 0) && !c.lastKnownProblem) return true;
    // รอเข้าระบบ/ยังไม่มีรถ ก็ยังไม่นับเป็นปัญหาจนกว่าจะมีข้อความ error จริง
    if (!v && !(c.lateToday || c.lateTaxPenalty) && !(c.trafficPainToday || 0) && !c.lastKnownProblem) return true;
    return false;
  }

  function citizenHasRealProblem(c) {
    if (!c || c.removed) return false;
    if (isNormalMovingInCitizen(c)) return false;
    if (c.movingOut) return true;
    if (c.resident && (c.satisfaction || 100) < 55) return true;
    if (c.resident && c.profile && c.profile.workDays.length && !c.workId) return true;
    if (c.resident && (c.lateToday || c.lateTaxPenalty)) return true;
    if (c.resident && (c.trafficPainToday || 0) > 0) return true;
    if (c.lastKnownProblem && !isNormalMovingInCitizen(c)) return true;
    const v = currentVehicleOfCitizen(c);
    if (v && v.type === 'MoveInTrip' && (v.lateAlerted || (v.waitingGameMin || 0) >= 18 || c.lateToday || c.lateTaxPenalty || (c.trafficPainToday || 0) > 0)) return true;
    return false;
  }

  function citizenDashboardProblemScore(c) {
    if (!c || c.removed) return 0;
    if (!citizenHasRealProblem(c)) return 0;
    let score = 0;
    const v = currentVehicleOfCitizen(c);
    if (c.movingOut) score += 100;
    if ((c.satisfaction || 100) < 35) score += 60;
    else if ((c.satisfaction || 100) < 55) score += 30;
    if (c.profile && c.profile.workDays.length && !c.workId && c.resident) score += 45;
    if (c.lateToday || c.lateTaxPenalty) score += 40;
    score += Math.min(30, Math.round(c.trafficPainToday || 0) * 3);
    if (c.lastKnownProblem) score += 15;
    if (v && (v.waitingGameMin || 0) >= 8) score += Math.min(40, Math.round(v.waitingGameMin || 0));
    if (v && v.type === 'MoveInTrip' && (v.lateAlerted || (v.waitingGameMin || 0) >= 18)) score += 25;
    return score;
  }

  function citizenMiniStatus(c) {
    const parts = [];
    const v = currentVehicleOfCitizen(c);
    if (v) parts.push(`🚗 ${tripTypeName(v.type)}`);
    if (!c.resident && !c.removed) parts.push('📥 ย้ายเข้า');
    if (c.movingOut) parts.push('📦 ย้ายออก');
    if (v && (v.waitingGameMin || 0) >= 8) parts.push('🚧 ค้างถนน');
    if (c.lateToday || c.lateTaxPenalty) parts.push('⏱ ล่าช้า');
    if (c.profile && c.profile.workDays.length && !c.workId && c.resident) parts.push('💼 ไม่มีงาน');
    if (c.resident && (c.satisfaction || 0) < 55) parts.push('😟 สุขต่ำ');
    return parts.length ? parts.join(' • ') : 'สถานะปกติ';
  }

  function citizenTripDistanceScore(c) {
    const v = currentVehicleOfCitizen(c);
    if (v && Array.isArray(v.path)) return v.path.length;
    if (Array.isArray(c.tripHistory) && c.tripHistory.length) return c.tripHistory[0].pathLen || 0;
    return 0;
  }

  function citizenDashboardRows(mode = 'traffic') {
    const base = citizenProblemBase();
    let rows = [];
    if (mode === 'traffic') rows = base.filter(c => {
      const v = currentVehicleOfCitizen(c);
      return !!v && ((v.waitingGameMin || 0) >= 8 || (c.trafficPainToday || 0) > 0 || (c.lastKnownProblem && !isNormalMovingInCitizen(c)));
    });
    else if (mode === 'late') rows = base.filter(c => c.resident && (c.lateToday || c.lateTaxPenalty));
    else if (mode === 'happiness') rows = base.filter(c => c.resident && ((c.satisfaction || 100) < 55 || (c.trafficPainToday || 0) > 0));
    else if (mode === 'nojob') rows = base.filter(c => c.profile && c.profile.workDays.length && !c.workId && c.resident);
    else if (mode === 'long') rows = base.filter(c => c.resident && citizenTripDistanceScore(c) >= 80);
    else if (mode === 'movingfail') rows = base.filter(c => {
      const v = currentVehicleOfCitizen(c);
      return !c.resident && !c.removed && c.state === 'กำลังย้ายเข้า' && !isNormalMovingInCitizen(c) && (!!c.lastKnownProblem || !!(v && (v.lateAlerted || (v.waitingGameMin || 0) >= 18)));
    });
    else rows = base.filter(c => citizenHasRealProblem(c));
    rows = rows.slice().sort((a,b) => citizenDashboardProblemScore(b) - citizenDashboardProblemScore(a) || (a.satisfaction || 0) - (b.satisfaction || 0) || a.id - b.id);
    return rows;
  }

  function buildingProblemRows() {
    const rows = [];
    for (const b of buildings) {
      refreshBuildingAccess(b);
      const access = b.accessPoints || [];
      const valid = validAccessPointsForBuilding(b);
      const hasEntry = access.some(a => a.entryOk);
      const hasExit = access.some(a => a.exitOk);
      let reason = '';
      let score = 0;
      if (!access.length || !valid.length || b.entrance == null) { reason = 'ไม่มีถนนติดอาคารหรือหา entrance ไม่ได้'; score = 100; }
      else if (!hasEntry && !hasExit) { reason = 'รถเข้าและออกอาคารไม่ได้ตามเลน'; score = 85; }
      else if (!hasEntry) { reason = 'รถเข้าอาคารยาก/ผิดเลน'; score = 65; }
      else if (!hasExit) { reason = 'รถออกจากอาคารยาก อาจค้างหน้าอาคาร'; score = 55; }
      if (reason) rows.push({ type:'building', b, reason, score });
    }
    return rows.sort((a,b)=>b.score-a.score || a.b.id-b.b.id).slice(0, 20);
  }

  function roadProblemRows() {
    const rows = [];
    for (const i of roadIndices) {
      if (!road[i]) continue;
      const ratio = getRoadRatio(i);
      const waiting = waitLoad[i] || 0;
      const cars = cellVehicleCount(i);
      const cap = Math.max(1, laneCapacityAt(i));
      const signal = signalPassLoad[i] || 0;
      const score = ratio * 70 + waiting * 16 + Math.max(0, cars - cap) * 10 + signal * 12;
      if (ratio >= 0.95 || waiting >= 1.2 || cars > cap) rows.push({ type:'road', roadIdx:i, ratio, waiting, cars, cap, score });
    }
    return rows.sort((a,b)=>b.score-a.score).slice(0, 20);
  }

  function problemExplorerCategory(mode) {
    if (mode === 'building') return buildingProblemRows();
    if (mode === 'road') return roadProblemRows();
    return citizenDashboardRows(mode).map(c => ({ type:'citizen', c, score: citizenDashboardProblemScore(c) }));
  }

  function problemExplorerModes() {
    return ['traffic','late','happiness','nojob','long','movingfail','building','road'];
  }

  function problemExplorerImmediateRows() {
    const seen = new Set();
    const out = [];
    for (const mode of problemExplorerModes()) {
      for (const item of problemExplorerCategory(mode)) {
        const key = item.type === 'citizen' ? `c:${item.c.id}` : item.type === 'building' ? `b:${item.b.id}` : `r:${item.roadIdx}`;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ ...item, mode, label: citizenDashboardLabel(mode), icon: citizenDashboardIcon(mode) });
      }
    }
    return out.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0, 30);
  }

  function problemExplorerExplain(mode) {
    return ({

      happiness:'คนที่ความสุขต่ำ หรือโดนรถติดลดความสุขวันนี้',
      nojob:'ประชากรถาวรที่ควรทำงาน แต่ยังไม่มีที่ทำงาน',
      long:'คนที่ต้องเดินทางไกลเกินไป ควรวางบ้าน งาน หรือบริการให้ใกล้ขึ้น',
      movingfail:'คนย้ายเข้าที่ไม่ใช่สถานะปกติ เช่น ค้างนาน/เข้าเมืองไม่สำเร็จ',
      building:'อาคารที่ทางเข้าออกมีปัญหา รถอาจเข้า/ออกไม่ได้ตามเลน',
      road:'จุดถนนที่หนาแน่น คอขวด หรือมีรถรอมาก'
    })[mode] || 'รายการที่ควรตรวจ';
  }

  function buildingIssueRow(item) {

    return `<div class="citizen-list-row ${item.score >= 80 ? 'bad' : 'warn'}">
      <b><span>🏢 ${escapeHtml(t.name)} #${b.id}</span><span>${b.x},${b.y}</span></b>

      <div class="smart-tip"><b>เหตุผล:</b> ${escapeHtml(item.reason)}</div>

    </div>`;
  }

  function roadIssueRow(item) {
    const p = xy(item.roadIdx);
    return `<div class="citizen-list-row ${item.ratio >= 1.2 || item.cars > item.cap ? 'bad' : 'warn'}">
      <b><span>🛣 ถนน ${p.x},${p.y}</span><span>${roadStatus(item.ratio)}</span></b>

      <div class="mini-actions"><button data-action="focus-road" data-road-idx="${item.roadIdx}">ไปถนนนี้</button></div>

  function problemIssueRow(item) {
    if (!item) return '';
    if (item.type === 'citizen') return citizenListRow(item.c);
    if (item.type === 'building') return buildingIssueRow(item);
    if (item.type === 'road') return roadIssueRow(item);

  function inspectProblemDashboard(mode = 'overview', page = 0) {
    return inspectCitizenDashboard(mode, page);
  }

  function inspectCitizenDashboard(mode = 'overview', page = 0) {
    openCitizenDashboardPanel();
    const dashTarget = citizenDashboardTarget();
    game.citizenDashMode = mode;
    game.citizenDashPage = page;
    const modes = problemExplorerModes();
    const groups = modes.map(m => ({ mode:m, rows:problemExplorerCategory(m) }));
    const immediate = getCachedProblemRows(true);
    if (mode === 'overview') {
      const worst = immediate.slice(0, 6);
      const citizenProblemCount = immediate.filter(x => x.type === 'citizen').length;
      const infraProblemCount = immediate.filter(x => x.type === 'building' || x.type === 'road').length;
      const topModes = groups
        .filter(g => g.rows.length)
        .sort((a,b) => b.rows.length - a.rows.length)
        .slice(0, 3)
        .map(g => `${citizenDashboardLabel(g.mode)} ${g.rows.length}`)
        .join(' • ') || 'ยังไม่มี';
      dashTarget.innerHTML = `<div class="inspector-title">⚠️ ปัญหาเมือง</div>
        <div class="muted">แดชบอร์ดนี้ใช้ไล่ตรวจปัญหาจริงทีละหมวด ไม่ซ้ำกับสรุปประชากร • ย้ายเข้า/กำลังเดินทางปกติจะไม่ถูกนับ</div>
        <div class="panel-subtitle">สรุปเคสที่ต้องตรวจ</div>

          ${toolMetric('ต้องตรวจทั้งหมด', `${immediate.length} เคส`)}
          ${toolMetric('ปัญหาหนักสุด', topModes)}
          ${toolMetric('เกี่ยวกับ Citizen', `${citizenProblemCount} เคส`)}
          ${toolMetric('อาคาร/ถนน', `${infraProblemCount} เคส`)}
        </div>
        <div class="panel-subtitle">หมวดปัญหา</div>
        <div class="citizen-dashboard-grid">
          ${groups.map(g => `<button class="citizen-dash-card ${g.rows.length ? (g.mode === 'road' || g.mode === 'building' || g.mode === 'traffic' ? 'bad' : 'warn') : 'good'}" data-action="problem-dashboard" data-mode="${g.mode}" data-page="0"><span>${citizenDashboardIcon(g.mode)} ${citizenDashboardLabel(g.mode)}</span><b>${g.rows.length}</b></button>`).join('')}

        <button data-action="problem-dashboard" data-mode="${mode}" data-page="${Math.max(0, page - 1)}" ${page <= 0 ? 'disabled' : ''}>ก่อนหน้า</button>

  }

  function computeDemandSummary() {
    const residents = citizens.filter(c => isCountedPopulation(c) && !c.movingOut);
    const rows = [];
    const workers = residents.filter(c => c.profile.workDays.length);
    const unemployed = workers.filter(c => !c.workId).length;
    const jobCap = buildings.reduce((sum,b)=>sum+buildingType(b).jobs,0);
    const jobsUsed = buildings.reduce((sum,b)=>sum+b.employees,0);
    if (unemployed > 0) {
      const rec = smartDemandRecommendation('job', unemployed);
      rows.push({ key:'job', label:'งาน', icon:'🏢', need:workers.length, capacity:jobCap, used:jobsUsed, shortage:unemployed, recommendation:rec.text, targetBuildingId:rec.targetBuildingId, targetRoadIdx:rec.roadIdx, detail:`คนว่างงาน ${unemployed} คนจากคนที่ต้องทำงาน ${workers.length} คน` });
    }

    const serviceDemand = new Map([['shop',0],['restaurant',0],['mall',0],['park',0],['pub',0]]);
    const wd = weekday();
    for (const c of residents) {
      const p = c.profile;
      if (p.trait === 'บ้านรวย') {
        const kind = ['mall','restaurant','pub'][c.id % 3];
        serviceDemand.set(kind, (serviceDemand.get(kind)||0) + 1);
      } else if (p.workDays.includes(wd)) {
        if (p.afterWork && (p.trait !== 'ขยัน' || c.id % 6 === 0)) serviceDemand.set(p.afterWork, (serviceDemand.get(p.afterWork)||0) + 1);
      } else if (p.weekendKind) {
        serviceDemand.set(p.weekendKind, (serviceDemand.get(p.weekendKind)||0) + 1);
      }
    }
    for (const [kind, need] of serviceDemand.entries()) {
      if (!need) continue;
      const bs = buildings.filter(b => buildingType(b).kind === kind);
      const capacity = bs.reduce((sum,b)=>sum+buildingType(b).service,0);
      const used = bs.reduce((sum,b)=>sum+b.visitors+b.reservedService,0);
      const shortage = Math.max(0, need - capacity);
      const rec = smartDemandRecommendation(kind, shortage);
      rows.push({
        key: kind,
        label: kindName(kind),
        icon: ({shop:'🛒',restaurant:'🍜',mall:'🏬',park:'🌳',pub:'🎵'})[kind] || '📍',
        need,
        capacity,
        used,
        shortage,
        recommendation: rec.text,
        targetBuildingId: rec.targetBuildingId,
        targetRoadIdx: rec.roadIdx,
        detail: shortage > 0 ? `ต้องการ${kindName(kind)} ${need} คน แต่รองรับได้ ${capacity} คน ขาด ${shortage} คน` : `ต้องการ${kindName(kind)} ${need} คน รองรับได้ ${capacity} คน`
      });
    }

    const vacantHomeCap = buildings.reduce((sum,b)=>{
      const t = buildingType(b);
      if (t.kind !== 'home') return sum;
      return sum + Math.max(0, t.residents - actualResidentsInBuilding(b) - b.reservedResidents);
    },0);
    if (vacantHomeCap <= 0 && gates.some(g => g.entrance != null)) {
      const rec = smartDemandRecommendation('home', 1);
      rows.push({ key:'home', label:'บ้าน', icon:'🏠', need:1, capacity:0, used:0, shortage:1, recommendation:rec.text, targetBuildingId:rec.targetBuildingId, targetRoadIdx:rec.roadIdx, detail:'บ้านว่างไม่พอสำหรับคนย้ายเข้าใหม่' });
    }
    if (!gates.some(g => g.entrance != null)) {
      const rec = smartDemandRecommendation('gateRoad', 1);
      rows.push({ key:'gateRoad', label:'ถนนเข้าเมือง', icon:'🛣️', need:1, capacity:0, used:0, shortage:1, recommendation:rec.text, detail:'ยังไม่มีถนนเชื่อม Gate เข้าเมือง คนย้ายเข้าและรถผ่านเมืองเข้าไม่ได้' });
    }

    // รวมเหตุการณ์ Demand ที่เกิดขึ้นจริงวันนี้จาก Alert เพื่อไม่ให้ปัญหาที่เพิ่งเกิดหายไปจาก Dashboard
    const today = absDay();
    const alertDemand = new Map();
    for (const a of alerts) {
      if (Math.floor(a.t / 1440) !== today) continue;
      if (!a.title.startsWith('ต้องการ')) continue;
      const label = a.title.replace('ต้องการ','');
      alertDemand.set(label, (alertDemand.get(label)||0) + a.count);
    }
    for (const [label, count] of alertDemand.entries()) {
      const existing = rows.find(r => r.label === label);
      if (existing) existing.shortage = Math.max(existing.shortage, count);
      else rows.push({ key:`alert-${label}`, label, icon:'⚠️', need:count, capacity:0, used:0, shortage:count, recommendation:'ตรวจ Alert ล่าสุดและเพิ่มอาคารที่ขาดใกล้จุดที่ Citizen ออกเดินทางบ่อย', detail:`มี Demand เกิดขึ้นจริงจาก Simulation ${count} คน` });
    }
    return rows.sort((a,b)=>(b.shortage-a.shortage) || (b.need-a.need));
  }

  function inspectDemandSummary() {
    const rows = computeDemandSummary();
    const totalShortage = rows.reduce((sum,r)=>sum+Math.max(0,r.shortage||0),0);
    const cards = rows.length ? rows.map(r => {

    }).join('') : '<div class="card muted">✅ ตอนนี้ยังไม่มี Demand หลัก</div>';

  }
