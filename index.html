  function addGate(data) {
    const gate = { id: gates.length + 1, ...data, entrance: null, inToday: 0, outToday: 0, passToday: 0 };
    gates.push(gate);
    return gate;
  }

  function isGateCell(x, y) {
    return gates.find(g => Math.abs(g.x - x) <= 1 && Math.abs(g.y - y) <= 1);
  }

  function gateInsideVector(g) {
    // ทิศจากขอบแมปเข้าสู่ตัวเมือง ใช้ทำ Gate plaza และเลือกจุด spawn ด้านในเมือง
    let dx = 0, dy = 0;
    if (g.x <= 1) dx = 1;
    else if (g.x >= MAP_W - 2) dx = -1;
    if (g.y <= 1) dy = 1;
    else if (g.y >= MAP_H - 2) dy = -1;
    if (!dx && !dy) {
      dx = sign(MAP_W / 2 - g.x);
      dy = sign(MAP_H / 2 - g.y);
      if (Math.abs(MAP_W / 2 - g.x) >= Math.abs(MAP_H / 2 - g.y)) dy = 0;
      else dx = 0;
    }
    return { dx, dy };
  }

  function gatePerpVector(g) {
    const v = gateInsideVector(g);
    return v.dx ? { dx: 0, dy: 1 } : { dx: 1, dy: 0 };
  }

  function clampGatePoint(x, y) {
    return { x: clamp(Math.round(x), 1, MAP_W - 2), y: clamp(Math.round(y), 1, MAP_H - 2) };
  }

  function setGateInnerEntrance(g, x, y) {
    const p = clampGatePoint(x, y);
    const i = idx(p.x, p.y);
    if (road[i]) {
      g.innerEntrance = i;
      g.entrance = i;
      return true;
    }
    return false;
  }

  function directGateEntranceCell(g) {
    if (!g) return null;
    const v = gateInsideVector(g);
    const gx = Math.round(g.x), gy = Math.round(g.y);
    const candidates = [];
    // Prefer the first road cell just inside the city. This makes the Gate a spawn/drop point
    // on the real road, not a miniature plaza/intersection at the map edge.
    for (const depth of [1, 0, 2, 3, 4, 5, 6, 8, 10, 12]) {
      const x = gx + v.dx * depth;
      const y = gy + v.dy * depth;
      if (inBounds(x, y)) candidates.push(idx(x, y));
    }
    for (const i of candidates) if (road[i]) return i;

    // Fallback: stay close to the Gate and as straight as possible, never prefer a junction.
    let best = null;
    let bestScore = Infinity;
    for (let depth = 0; depth <= 28; depth++) {
      for (let side = -5; side <= 5; side++) {
        const x = gx + v.dx * depth + (v.dy ? side : 0);
        const y = gy + v.dy * depth + (v.dx ? side : 0);
        if (!inBounds(x, y)) continue;
        const i = idx(x, y);
        if (!road[i]) continue;
        const score = depth * 8 + Math.abs(side) * 20 + (roadDegree(i) >= 3 ? 80 : 0);
        if (score < bestScore) { bestScore = score; best = i; }
      }
      if (best != null && depth > 3) break;
    }
    return best;
  }

  function buildGatePlaza(g) {
    // Patch 30: City Gate no longer creates a small plaza/mini intersection.
    // It only chooses a direct spawn/drop cell on the already-built main road.
    const direct = directGateEntranceCell(g);
    if (direct != null) {
      g.innerEntrance = direct;
      g.entrance = direct;
    }
  }

  function updateGateEntrances() {
    for (const g of gates) {
      const direct = directGateEntranceCell(g);
      if (direct != null) {
        g.innerEntrance = direct;
        g.entrance = direct;
        continue;
      }
      g.innerEntrance = null;
      g.entrance = null;
    }
  }

  function recomputeConnectionsAround(x, y, radius = 2) {
    for (let yy = y - radius; yy <= y + radius; yy++) for (let xx = x - radius; xx <= x + radius; xx++) {
      if (!inBounds(xx, yy)) continue;
      const i = idx(xx, yy);
      connCache[i] = countConnections(xx, yy);
    }
  }
  function countConnections(x, y, roadsOverride = null) {
    const i = idx(x, y);
    const hasRoad = roadsOverride ? roadsOverride.has(i) || road[i] : road[i];
    if (!hasRoad) return 0;
    if (!roadsOverride) return linkedNeighbors(i).length;
    // During preview/checking, count possible branches conservatively so junctions stay <= 4 ways.
    let c = 0;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inBounds(nx, ny)) continue;
      const ni = idx(nx, ny);
      if (roadsOverride.has(ni) || road[ni]) c++;
    }
    return c;
  }

  function canAddRoadCells(cells, roadKey = 'small') {
    cells = normalizeRoadCellsForIntersections(cells);
    if (!cells || !cells.length) return { ok: false, reason: 'ไม่มีช่องถนนให้สร้าง' };
    const addSet = new Set(cells);
    const footprint = previewRoadFootprintCells(cells, roadKey);
    for (const fi of footprint) {
      if (buildGrid[fi]) return { ok: false, reason: 'พื้นที่ถนนชนอาคาร: ต้องเว้น footprint ถนนเต็มกริดก่อนวางอาคาร' };
    }
    const toCheck = new Set();
    for (const i of cells) {
      const {x, y} = xy(i);
      toCheck.add(i);
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx, ny)) toCheck.add(idx(nx, ny));
      }
    }
    for (const i of toCheck) {
      const p = xy(i);
      if (countConnections(p.x, p.y, addSet) > 4) return { ok: false, reason: 'ทางแยกเกิน 4 ขา' };
    }
    return { ok: true };
  }

  function placeRoadCell(x, y, roadKey = 'small', charge = true, isMain = false, deferNetworkRefresh = false) {
    if (!inBounds(x, y)) return false;
    const i = idx(x, y);
    const rd = DATA.roads[roadKey];
    const old = road[i];
    const oldRd = roadDataById(old);
    if (old && old >= rd.id) {
      if (isMain) mainRoad[i] = 1;
      return true;
    }
    const deltaCost = oldRd ? Math.max(0, rd.cost - oldRd.cost) : rd.cost;
    if (charge && !canSpend(deltaCost)) return false;
    if (!old) {
      game.roadCount++;
      registerRoadCell(i);
    }
    road[i] = rd.id;
    if (isMain) mainRoad[i] = 1;
    if (charge) game.money -= deltaCost;

    // Patch 27 Performance Fix:
    // When confirming a dragged road build, placeRoadCells() calls placeRoadCell()
    // many times in a row. The old code refreshed every gate, every building access,
    // cleared path cache, bumped roadVersion, and recorded route-change logs once per
    // road grid. A 50-grid road could therefore refresh the whole city 50+ times and
    // freeze the screen right after pressing OK. During batch builds, defer those heavy
    // operations and run them once in linkRoadCellsInOrder().
    if (!deferNetworkRefresh) {
      recomputeConnectionsAround(x, y, 2);
      pathCache.clear();
      roadVersion++;
      recordRoadNetworkChange(i, old ? 'road-upgraded-on-route-watch' : 'road-created-on-route-watch', 3);
      updateGateEntrances();
      refreshAllBuildingAccesses();
    }
    return true;
  }

  function removeRoadCell(x, y, charge = true) {
    if (!inBounds(x, y)) return false;
    const i = idx(x, y);
    if (!road[i]) return false;
    if (mainRoad[i]) return false; // ถนนหลักเชื่อม Gate ฟรีค่าบำรุง ล็อกไว้กันรื้อโดยไม่ตั้งใจ
    if (cellVehicleCount(i) > 0) return false;
    const oldRd = roadDataById(road[i]);
    const fee = oldRd.cost * 0.2;
    if (charge) game.money -= fee;
    removeRoadLinks(i);
    road[i] = 0;
    mainRoad[i] = 0;
    unregisterRoadCell(i);
    rebuildRoadFootprint();
    game.roadCount = Math.max(0, game.roadCount - 1);
    recomputeConnectionsAround(x, y, 2);
    pathCache.clear();
    roadVersion++;
    recordRoadNetworkChange(i, 'road-removed-on-route-watch', 3);
    updateGateEntrances();
    refreshAllBuildingAccesses();
    return true;
  }

  function getLineCells(x0, y0, x1, y1) {
    if (!inBounds(x0, y0) || !inBounds(x1, y1)) return [];
    let dx = x1 - x0, dy = y1 - y0;
    if (dx === 0 && dy === 0) return [idx(x0, y0)];
    const adx = Math.abs(dx), ady = Math.abs(dy);
    let sx = sign(dx), sy = sign(dy);
    if (adx > ady * 2) sy = 0;
    else if (ady > adx * 2) sx = 0;
    else { sx = sign(dx); sy = sign(dy); }
    const steps = sy === 0 ? adx : sx === 0 ? ady : Math.max(adx, ady);
    const cells = [];
    let x = x0, y = y0;
    for (let s = 0; s <= steps; s++) {
      if (inBounds(x, y)) cells.push(idx(x, y));
      x += sx; y += sy;
    }
    return [...new Set(cells)];
  }

  function canSpend(cost) {
    if (game.money < 0) return false;
    return game.money - cost >= -10000;
  }

  function addBuilding(typeKey, x, y, charge = true) {
    const t = DATA.buildings[typeKey];
    const check = canPlaceBuilding(typeKey, x, y, charge);
    if (!check.ok) return check;
    if (charge) game.money -= t.cost;
    const b = {
      id: nextBuildingId++, typeKey, kind: t.kind, name: t.name,
      x, y, w: t.w, h: t.h,
      residents: 0, reservedResidents: 0,
      employees: 0, reservedService: 0, visitors: 0,
      workerIds: [], citizenIds: [],
      entrance: check.entrance,
      entryDirKey: check.entryDirKey,
      entrySideKey: check.entrySideKey,
      accessPoints: check.accessPoints || [],
      builtAt: game.worldMin,
      arrivals: 0, fails: 0, delayed: 0,
      parkedCars: [],
      exitQueue: [],
      parkSeq: 0
    };
    buildings.push(b);
    registerBuilding(b);
    for (let yy = y; yy < y + t.h; yy++) for (let xx = x; xx < x + t.w; xx++) buildGrid[idx(xx, yy)] = b.id;
    if (charge) setStatus(`วาง ${t.name} ราคา ${formatMoney(t.cost)} บาท`);
    // Patch 24: เมื่อสร้างออฟฟิศ/ร้านอาหาร/บริการใหม่ ต้องปลุก demand ที่เคยหาไม่เจอทันที
    // ไม่ใช่รอถึง dailyTick รอบถัดไป เพราะผู้เล่นคาดหวังว่าสร้างแล้ว Citizen จะรู้จักปลายทางใหม่
    wakeCityDemandAfterBuildingAdded(b);
    return { ok: true, building: b };
  }

  function canPlaceBuilding(typeKey, x, y, checkMoney = true) {
    const t = DATA.buildings[typeKey];
    if (!t) return { ok:false, reason:'ไม่มีข้อมูลอาคาร' };
    if (x < 1 || y < 1 || x + t.w >= MAP_W - 1 || y + t.h >= MAP_H - 1) return { ok:false, reason:'พื้นที่เกินขอบแมป' };
    if (checkMoney && !canSpend(t.cost)) return { ok:false, reason:'เงินไม่พอ หรือเงินติดลบอยู่' };
    for (let yy = y; yy < y + t.h; yy++) for (let xx = x; xx < x + t.w; xx++) {
      const i = idx(xx, yy);
      if (road[i] || roadFootprint[i]) return { ok:false, reason:'พื้นที่ทับ footprint ถนน' };
      if (buildGrid[i]) return { ok:false, reason:'พื้นที่ทับสิ่งก่อสร้าง' };
    }
    const access = findAdjacentRoadForRect(x, y, t.w, t.h);
    if (!access) return { ok:false, reason:'อาคารต้องติดถนนและมีทางเข้าออก' };
    return { ok:true, entrance: access.entrance, entryDirKey: access.entryDirKey, entrySideKey: access.entrySideKey, accessPoints: buildingAccessCandidatesFromRect(x, y, t.w, t.h) };
  }


  function buildingType(b) { return DATA.buildings[b.typeKey]; }
  function buildingById(id) {
    const n = Number(id);
    return buildingByIdMap.get(n) || buildings.find(b => b.id === n) || null;
  }
  function actualResidentsInBuilding(b) {
    if (!b || buildingType(b).kind !== 'home') return 0;
    return citizens.reduce((n, c) => n + (isCountedPopulation(c) && c.homeId === b.id ? 1 : 0), 0);
  }
  function syncHomeResidentCounts() {
    for (const b of buildings) {
      if (buildingType(b).kind !== 'home') continue;
      const actual = actualResidentsInBuilding(b);
      if (b.residents !== actual) b.residents = actual;
      b.citizenIds = citizens.filter(c => isCountedPopulation(c) && c.homeId === b.id).map(c => c.id);
    }
  }

  function buildStarter(kind) {
    // v0.7.2 Gate Roads Only: start with only the free 8-lane Gate backbone.
    // No starter homes, shops, offices, parks, pubs, or other buildings are placed.
    buildCoreGateNetwork();
    updateGateEntrances();
  }

  function buildCoreGateNetwork() {
    const cx = 150, cy = 150;
    // central cross so the map always has a strong backbone
    buildRoadPath(cx, 0, cx, MAP_H - 1, 'large', false, true);
    buildRoadPath(0, cy, MAP_W - 1, cy, 'large', false, true);
    for (const g of gates) {
      if (g.x <= 1 || g.x >= MAP_W - 2) {
        buildRoadPath(cx, cy, g.x, cy, 'large', false, true);
        buildRoadPath(g.x, cy, g.x, g.y, 'large', false, true);
      } else {
        buildRoadPath(cx, cy, cx, g.y, 'large', false, true);
        buildRoadPath(cx, g.y, g.x, g.y, 'large', false, true);
      }
    }
    // Patch 30: City Gates are direct road spawn/drop points. No plaza and no mini-intersection.
    updateGateEntrances();
  }

  function buildRoadPath(x0,y0,x1,y1,roadKey,charge=true,isMain=false) {
    const cells = normalizeRoadCellsForIntersections(getLineCells(x0,y0,x1,y1));
    placeRoadCells(cells, roadKey, charge, isMain);
  }

  function placeRoadCells(cells, roadKey, charge=true, isMain=false) {
    cells = normalizeRoadCellsForIntersections(cells);
    const placed = [];
    for (const i of cells) {
      const p = xy(i);
      if (placeRoadCell(p.x, p.y, roadKey, charge, isMain, true)) placed.push(i);
    }
    if (!placed.length) return 0;

    // Heavy road-network refresh happens inside linkRoadCellsInOrder() once per build,
    // not once per road cell. This is the main fix for screen freeze after confirm.
    linkRoadCellsInOrder(placed);
    for (const i of placed) {
      const p = xy(i);
      recomputeConnectionsAround(p.x, p.y, 2);
    }
    return placed.length;
  }

  function addStarterBuildings(x, y) {
    // ย่านเริ่มต้นสร้างจากถนนจริงก่อน แล้วจึงวางอาคารที่ติดถนนทุกหลัง
    buildRoadPath(x - 6, y + 8, x + 78, y + 8, 'small', false);
    buildRoadPath(x - 6, y + 22, x + 78, y + 22, 'small', false);
    buildRoadPath(x + 20, y - 4, x + 20, y + 32, 'small', false);
    buildRoadPath(x + 42, y - 4, x + 42, y + 32, 'small', false);
    buildRoadPath(x + 64, y - 4, x + 64, y + 32, 'small', false);

    addBuilding('home_medium', x + 7, y + 5, false);
    addBuilding('home_medium', x + 7, y + 9, false);
    addBuilding('home_small', x + 14, y + 24, false);
    addBuilding('office_small', x + 24, y + 5, false);
    addBuilding('office_small', x + 46, y + 5, false);
    addBuilding('shop_small', x + 24, y + 10, false);
    addBuilding('restaurant_small', x + 31, y + 10, false);
    addBuilding('park_small', x + 46, y + 10, false);
    addBuilding('pub_small', x + 57, y + 10, false);
  }

  function scheduleDailyMaintenance() {
    pushEvent(nextAbsMinute(0), 'daily', null);
  }

  function pushEvent(time, type, payload) {
    events.push({ time, type, payload });
    if (events.length > 1 && events[events.length - 2].time > time) {
      events.sort((a,b) => a.time - b.time);
    }
  }

  function pushFutureCitizenEvent(time, type, payload, graceMin = 1) {
    if (time == null || time < game.worldMin + graceMin) return false;
    pushEvent(time, type, payload);
    return true;
  }

  function clearPendingAction(c, type = null) {
    if (!c || !c.pendingAction) return false;
    if (type && c.pendingAction.type !== type) return false;
    c.pendingAction = null;
    return true;
  }

  function queueLifeAction(c, type, data = {}, reason = 'รอทริปปัจจุบันจบ') {
    // Patch 23: ไม่สร้าง pending/retry event ซ้ำ ๆ อีกแล้ว
    // เก็บ demand ล่าสุดไว้ครั้งเดียว ถ้าคนยังอยู่บนรถ พอ Trip จบค่อยยิง event runQueuedAction หนึ่งครั้ง
    if (!c || c.removed) return false;
    c.queuedLifeAction = { type, data: { ...data }, reason, createdAt: game.worldMin };
    c.lastKnownProblem = reason;
    if (c.currentVehicleId) c.state = `มี demand: ${lifeActionName(type)} • รอทริปปัจจุบันจบ`;
    return true;
  }

  function lifeActionName(type) {
    return ({ goWork:'ไปทำงาน', afterWork:'เลิกงาน/กิจกรรมหลังงาน', leisure:'ไปกิจกรรม', returnHome:'กลับบ้าน', moveOut:'ย้ายออก' })[type] || type || 'เดินทาง';
  }

  function runQueuedLifeAction(c) {
    if (!c || c.removed || !c.queuedLifeAction) return false;
    if (c.currentVehicleId) return false;
    const qa = c.queuedLifeAction;
    c.queuedLifeAction = null;
    const data = qa.data || {};
    if (qa.type === 'goWork') startWorkTrip(c, data.deadline || (game.worldMin + 240));
    else if (qa.type === 'afterWork') startAfterWork(c);
    else if (qa.type === 'leisure') startLeisure(c, data.kind, data.endAbs || (game.worldMin + 180), data.reason || qa.reason || 'queued');
    else if (qa.type === 'returnHome') startReturnHome(c, data.reason || qa.reason || 'queued');
    else if (qa.type === 'moveOut') startMoveOut(c);
    return true;
  }

  function schedulePendingAction(c, type, data = {}, reason = 'รอสร้าง Trip', delayMin = LIFE_TRIP_RETRY_MIN) {
    if (!c || c.removed || c.movingOut) return false;
    const now = game.worldMin;
    const old = c.pendingAction && c.pendingAction.type === type ? c.pendingAction : null;
    const attempts = old ? (old.attempts || 0) + 1 : 1;
    const retryDelay = clamp(delayMin + Math.min(30, attempts * 2), LIFE_TRIP_RETRY_MIN, 45);
    const deadline = Number.isFinite(data.deadline) ? data.deadline : null;
    const activityEnd = Number.isFinite(data.endAbs) ? data.endAbs : null;
    const expiresAt = Math.max(
      now + LIFE_TRIP_RETRY_MAX_MIN,
      deadline != null ? deadline + 90 : 0,
      activityEnd != null ? activityEnd + 45 : 0
    );
    const retryAt = now + retryDelay + (c.id % 5);
    c.pendingAction = {
      type,
      data: { ...data },
      reason,
      attempts,
      retryAt,
      expiresAt,
      createdAt: old ? old.createdAt : now
    };
    if (!c.currentVehicleId && isCountedPopulation(c)) c.state = `รอออกเดินทาง (${reason})`;
    pushEvent(retryAt, 'retryAction', { citizenId: c.id });
    return true;
  }

  function runPendingAction(c) {
    if (!c || c.removed || !c.pendingAction) return false;
    const pa = c.pendingAction;
    if (game.worldMin + 0.01 < pa.retryAt) return false;
    if (game.worldMin > pa.expiresAt) {
      c.lastKnownProblem = `หมดเวลารอ ${pa.type}`;
      c.pendingAction = null;
      return false;
    }
    if (c.currentVehicleId) {
      schedulePendingAction(c, pa.type, pa.data, pa.reason || 'ยังอยู่บนรถ', LIFE_TRIP_RETRY_MIN);
      return false;
    }
    const data = { ...(pa.data || {}) };
    c.pendingAction = null;
    if (pa.type === 'goWork') startWorkTrip(c, data.deadline || (game.worldMin + 240));
    else if (pa.type === 'afterWork') startAfterWork(c);
    else if (pa.type === 'leisure') startLeisure(c, data.kind, data.endAbs || (game.worldMin + 180), data.reason || 'retry');
    else if (pa.type === 'returnHome') startReturnHome(c, data.reason || 'retry');
    else if (pa.type === 'moveOut') startMoveOut(c);
    return true;
  }

  function processPendingActions(limit = 80) {
    let handled = 0;
    for (const c of citizens) {
      if (!c || !c.pendingAction || c.pendingAction.retryAt > game.worldMin) continue;
      runPendingAction(c);
      handled++;
      if (handled >= limit) break;
    }
  }

  function isTripHeavyEvent(ev) {
    if (!ev) return false;
    return ev.type === 'goWork' || ev.type === 'leaveWork' || ev.type === 'weekendLeisure'
      || ev.type === 'richLeisure' || ev.type === 'returnHome' || ev.type === 'moveOut'
      || ev.type === 'retryAction' || ev.type === 'runQueuedAction';
  }

  function processEvents() {
    if (events.length > 1 && events[0].time > events[1].time) events.sort((a,b) => a.time - b.time);
    let handled = 0;
    let tripHandled = 0;
    while (events.length && events[0].time <= game.worldMin && handled < MAX_DUE_EVENTS_PER_FRAME) {
      const ev = events[0];
      if (isTripHeavyEvent(ev) && tripHandled >= MAX_TRIP_EVENTS_PER_FRAME) break;
      events.shift();
      handleEvent(ev);
      handled++;
      if (isTripHeavyEvent(ev)) tripHandled++;
    }
    game.eventsHandledLastFrame = handled;
    game.tripEventsHandledLastFrame = tripHandled;
    game.eventsBacklog = events.length && events[0].time <= game.worldMin ? events.filter(ev => ev.time <= game.worldMin).length : 0;
  }

  function handleEvent(ev) {
    if (ev.type === 'daily') {
      dailyTick();
      pushEvent(absAt(absDay() + 1, 0), 'daily', null);
      return;
    }
    const c = ev.payload && citizenById(ev.payload.citizenId);
    if (!c || c.removed) return;
    if (ev.type === 'retryAction') runPendingAction(c);
    else if (ev.type === 'runQueuedAction') runQueuedLifeAction(c);
    else if (ev.type === 'goWork') startWorkTrip(c, ev.payload.deadline);
    else if (ev.type === 'leaveWork') startAfterWork(c);
    else if (ev.type === 'weekendLeisure') startWeekendLeisure(c);
    else if (ev.type === 'richLeisure') startRichLeisure(c);
    else if (ev.type === 'returnHome') startReturnHome(c, ev.payload.reason || 'กลับบ้าน');
    else if (ev.type === 'moveOut') startMoveOut(c);
  }

  function citizenDailyTax(c) {
    if (!c || !isCountedPopulation(c) || c.movingOut) return 0;
    const base = c.profile ? c.profile.tax : 0;
    return c.lateTaxPenalty ? Math.round(base * 0.5) : base;
  }

  function workTimingForCitizenToday(c) {
    if (!c || !c.profile || !c.profile.workDays || !c.profile.workDays.length) return null;
    const today = absDay();
    const wd = weekday();
    if (!c.profile.workDays.includes(wd)) return null;
    const jitter = (c.id % 11) * 0.35;
    return {
      day: today,
      leaveAt: absAt(today, c.profile.leaveWorkAt) + jitter,
      deadline: absAt(today, c.profile.workStartDeadline),
      workEnd: absAt(today, c.profile.workEndAt)
    };
  }

  function canStartWorkTodayWithoutInstantLate(c) {
    const t = workTimingForCitizenToday(c);
    if (!t) return { ok:false, timing:null, reason:'not-workday' };
    // Before normal leave time: scheduleCitizenDay will create the proper goWork event.
    if (game.worldMin < t.leaveAt - 1) return { ok:true, timing:t, reason:'before-leave' };
    // After leave time but still safely before the deadline: allow an immediate catch-up trip.
    if (game.worldMin <= t.deadline - FIRST_DAY_WORK_DEADLINE_GRACE_MIN) return { ok:true, timing:t, reason:'catch-up-before-deadline' };
    // Past this point, sending the citizen to work today would create an artificial late penalty.
    return { ok:false, timing:t, reason:'missed-safe-work-window' };
  }

  function markWorkSkippedUntilNextShift(c, reason = 'พ้นช่วงออกไปทำงานของวันนี้') {
    if (!c) return false;
    c.missedTodayWorkWindow = true;
    c.firstWorkGraceDay = absDay();
    c.state = `อยู่บ้าน • พบงานแล้ว แต่${reason} เริ่มทำงานรอบถัดไป`;
    c.lastKnownProblem = '';
    return true;
  }

  function markCitizenTravelPain(v, reason = 'traffic', amount = 2, cooldown = 30, taxPenalty = false) {
    if (!v || !v.citizenId) return;
    const c = citizens.find(x => x.id === v.citizenId);
    if (!c || c.removed) return;
    const key = `pain_${reason}`;
    if (v[key] && game.worldMin - v[key] < cooldown) return;
    v[key] = game.worldMin;
    c.satisfaction = Math.max(0, c.satisfaction - amount);
    c.trafficPainToday = (c.trafficPainToday || 0) + amount;
    if (!Array.isArray(c.painLogToday)) c.painLogToday = [];
    c.painLogToday.unshift({ t: game.worldMin, reason, amount, roadIdx: v.currentIdx, vehicleId: v.id });
    if (c.painLogToday.length > 8) c.painLogToday.length = 8;
    c.lastKnownProblem = citizenPainReasonText(reason);
    if (taxPenalty) c.lateTaxPenalty = true;
  }

  function dailyTick() {
    reconcileBuildingReservations();
    const stats = computeStats();
    const eligibleResidents = citizens.filter(c => isCountedPopulation(c) && !c.movingOut);
    const fullResidentTax = eligibleResidents.reduce((s, c) => s + (c.profile ? c.profile.tax : 0), 0);
    const residentTax = eligibleResidents.reduce((s, c) => s + citizenDailyTax(c), 0);
    const taxLost = Math.max(0, fullResidentTax - residentTax);
    game.taxLostToday = taxLost;
    const businessTax = buildings.reduce((s, b) => s + b.employees * 50, 0);
    const roadMaint = computeRoadMaintenance();
    const buildingMaint = buildings.reduce((s, b) => s + buildingType(b).maintenance, 0);
    game.money += residentTax + businessTax - roadMaint - buildingMaint;
    if (game.money < -10000) game.money = -10000;

    for (const g of gates) { g.inToday = 0; g.outToday = 0; g.passToday = 0; }
    for (const b of buildings) { b.arrivals = 0; b.fails = 0; b.delayed = 0; }

    assignJobs();
    for (const c of citizens) {
      if (!isCountedPopulation(c)) continue;
      if (!c.workId && c.profile.workDays.length) c.unemployedDays++;
      else c.unemployedDays = 0;
      if (c.unemployedDays >= 2 && !c.movingOut) {
        c.satisfaction -= 28;
        addAlert('งานไม่พอ', `Citizen ${c.id} ไม่มีงานครบ 2 วันและเริ่มย้ายออก`, 1);
        c.movingOut = true;
        pushEvent(game.worldMin + 10 + (c.id % 30), 'moveOut', { citizenId: c.id });
      }
      const hadSeriousProblemToday = !!c.lateToday || !!c.lateTaxPenalty || (c.trafficPainToday || 0) >= 8 || (!c.workId && c.profile.workDays.length);
      if (c.satisfaction < 25 && !c.movingOut) {
        addAlert('ความพึงพอใจต่ำ', `Citizen ${c.id} ความสุขต่ำและเริ่มย้ายออก`, 1);
        c.movingOut = true;
        pushEvent(game.worldMin + 20 + (c.id % 40), 'moveOut', { citizenId: c.id });
      } else if (!hadSeriousProblemToday) {
        // Patch 12: +10 รายวันเป็นโบนัสฟื้นตัวสำหรับวันที่ไม่มีปัญหาจริง ๆ เท่านั้น
        // และตันที่ 86 เพื่อไม่ให้เมืองขึ้น 100% ตลอดจนมองไม่เห็นปัญหาการจราจร
        c.satisfaction = Math.min(86, c.satisfaction + 10);
      }
      c.lastTaxPaid = citizenDailyTax(c);
      c.lateTaxPenalty = false;
      c.lateToday = false;
      c.lateCountToday = 0;
      c.trafficPainToday = 0;
      c.painLogToday = [];
      c.lastKnownProblem = '';
      scheduleCitizenDay(c, absDay());
    }
    addAlert('สรุปรายวัน', `ภาษีประชากร +${formatMoney(residentTax)}${taxLost ? ` (เสียค่าปรับล่าช้า -${formatMoney(taxLost)})` : ''} / ธุรกิจ +${formatMoney(businessTax)} / บำรุง -${formatMoney(roadMaint + buildingMaint)}`, 1, 'good');
    game.lateTripsToday = 0;
  }

  function scheduleCitizenDay(c, day) {
    if (!isCountedPopulation(c) || c.movingOut) return;
    if (c.scheduledDays && c.scheduledDays.has(day)) return;
    if (!c.scheduledDays) c.scheduledDays = new Set();
    c.scheduledDays.add(day);
    const wd = day % 7;
    const p = c.profile;
    const jitter = (c.id % 11) * 0.35;
    const now = game.worldMin;
    const today = absDay();

    if (p.trait === 'บ้านรวย') {
      const richAt = absAt(day, p.richStart) + jitter;
      if (day > today || richAt > now + 1) pushEvent(richAt, 'richLeisure', { citizenId: c.id });
      else if (day === today) {
        // Patch 22: ไม่ยิงทริปเที่ยวทันทีตอนเพิ่งย้ายเข้าบ้าน ให้รอรอบถัดไป
        c.missedTodayLeisureWindow = true;
      }
      c.scheduleNote = `บ้านรวย: ไม่ทำงาน • ออกเที่ยว ${minLabel(p.richStart)} → 03:00`;
      return;
    }

    if (p.workDays.includes(wd)) {
      const leaveAt = absAt(day, p.leaveWorkAt) + jitter;
      const deadline = absAt(day, p.workStartDeadline);
      const endAt = absAt(day, p.workEndAt) + jitter;
      if (day > today || leaveAt > now + 1) {
        pushEvent(leaveAt, 'goWork', { citizenId: c.id, deadline });
      } else if (day === today) {
        // Patch 22: ถ้าประชาชนเพิ่งถึงบ้านหลังเวลาออกงานของวันนั้นแล้ว
        // อย่าสร้าง pending goWork ทันที เพราะจะทำให้รถเข้าบ้านแล้วเริ่มคำนวณทริปต่อและดูเหมือนค้าง
        // ให้รอรอบตารางชีวิตถัดไปแทน
        c.missedTodayWorkWindow = true;
      }
      if (day > today || endAt > now + 1) pushEvent(endAt, 'leaveWork', { citizenId: c.id });
      c.scheduleNote = `${p.trait}: ไปทำงาน ${minLabel(p.leaveWorkAt)} • เลิกงาน ${minLabel(p.workEndAt)}${p.afterWork ? ` • หลังงาน: ${kindName(p.afterWork)}` : ''}`;
    } else if (p.weekendKind) {
      const startAt = absAt(day, p.weekendStart) + jitter;
      const endAt = absAt(day, p.weekendEnd);
      if (day > today || startAt > now + 1) pushEvent(startAt, 'weekendLeisure', { citizenId: c.id });
      else if (day === today) {
        // Patch 22: ไม่สร้าง pending กิจกรรมย้อนหลังทันทีหลังย้ายเข้าบ้าน
        c.missedTodayLeisureWindow = true;
      }
      c.scheduleNote = `${p.trait}: วันไม่ทำงาน • ไป${kindName(p.weekendKind)} ${minLabel(p.weekendStart)}`;
    } else {
      c.scheduleNote = `${p.trait}: วันนี้อยู่บ้าน`;
    }
  }


  function hasQueuedCitizenEvent(type, citizenId, fromTime = game.worldMin - 1, toTime = Infinity) {
    return events.some(ev => ev && ev.type === type && ev.payload && ev.payload.citizenId === citizenId && ev.time >= fromTime && ev.time <= toTime);
  }

  function wakeWorkDemandAfterMoveIn(c) {
    // Patch 36: คนเพิ่งย้ายเข้าบ้านควรรู้จักตำแหน่งงานทันที
    // แต่ห้ามปลุกให้ไปทำงานย้อนหลังหลัง deadline เพราะจะทำให้เมืองความสุขตกทั้งเมือง
    // ทั้งที่รถบนถนนมีไม่กี่คันและปัญหาไม่ได้มาจากจราจรจริง
    if (!isCountedPopulation(c) || c.movingOut || c.removed || !c.profile || !c.profile.workDays.length) return false;

    rebuildJobCountsFromCitizens();
    if (!c.workId) assignJobFor(c);

    if (!c.workId) {
      c.state = 'อยู่บ้าน • ต้องการทำงาน แต่ยังไม่มีตำแหน่งงานว่าง';
      c.lastKnownProblem = 'ไม่มีตำแหน่งงานว่าง';
      return false;
    }

    const workTiming = canStartWorkTodayWithoutInstantLate(c);
    const home = buildingById(c.homeId);
    const work = buildingById(c.workId);
    const origin = currentBuildingOf(c) || home;
    if (!home || !work || !origin || origin.id === work.id || c.currentVehicleId) return false;

    if (!workTiming.timing) return false;

    if (workTiming.reason === 'before-leave') {
      // scheduleCitizenDay() ที่เพิ่งถูกเรียกใน activateNewResidentAfterMoveIn()
      // จะจัด event ไปทำงานตามเวลาออกเดินทางปกติอยู่แล้ว
      c.state = 'อยู่บ้าน • พบงานแล้ว รอเวลาออกไปทำงาน';
      c.lastKnownProblem = '';
      return true;
    }

    if (workTiming.reason === 'catch-up-before-deadline') {
      const deadline = workTiming.timing.deadline;
      if (!hasQueuedCitizenEvent('goWork', c.id, game.worldMin - 1, deadline + 5)) {
        pushEvent(game.worldMin + 1 + (c.id % 20) * 0.05, 'goWork', { citizenId: c.id, deadline });
      }
      c.state = 'อยู่บ้าน • พบงานแล้ว กำลังเตรียมไปทำงาน';
      c.lastKnownProblem = '';
      return true;
    }

    // พ้นช่วงปลอดภัยของวันนี้แล้ว: ไม่สร้าง WorkTrip ย้อนหลัง ไม่โดน late/tax penalty ฟรี
    markWorkSkippedUntilNextShift(c, 'พ้นช่วงออกไปทำงานของวันนี้แล้ว');
    return true;
  }

  function activateNewResidentAfterMoveIn(c) {
    if (!isCountedPopulation(c) || c.movingOut || c.removed) return false;
    if (!c.scheduledDays) c.scheduledDays = new Set();

    // Schedule วันนี้ตามปกติก่อน แล้ว wake งานเฉพาะถ้ายังไม่พ้นช่วงปลอดภัยของ deadline
    scheduleCitizenDay(c, absDay());
    const wokeWork = wakeWorkDemandAfterMoveIn(c);

    if (wokeWork && c.workId) {
      const work = buildingById(c.workId);
      if (work) addAlert('พบงานให้คนย้ายเข้า', `Citizen ${c.id} ย้ายเข้าบ้านแล้วจับคู่กับ ${buildingType(work).name} #${work.id} ที่ยังมีตำแหน่งว่าง`, 1, 'good');
    }
    return wokeWork;
  }

  function createCitizen(homeId, resident = false) {
    const profile = DATA.profiles[Math.floor(Math.random() * DATA.profiles.length)];
    const c = {
      id: nextCitizenId++,
      profile,
      homeId,
      workId: null,
      location: resident ? `building:${homeId}` : 'gate',
      state: resident ? 'อยู่บ้าน' : 'กำลังย้ายเข้า',
      satisfaction: 82,
      unemployedDays: 0,
      failCount: 0,
      lateToday: false,
      lateTaxPenalty: false,
      lateCountToday: 0,
      trafficPainToday: 0,
      painLogToday: [],
      tripHistory: [],
      lastKnownProblem: '',
      lastTaxPaid: 0,
      resident,
      // Patch 13: คนย้ายเข้าจะยังไม่นับเป็นประชากรจนกว่ารถจะถึงบ้านจริง
      hasHomeArrived: !!resident,
      movingOut: false,
      removed: false,
      currentVehicleId: null,
      lastTrip: null,
      pendingAction: null,
      scheduledDays: new Set(),
      scheduleNote: ''
    };
    citizens.push(c);
    registerCitizen(c);
    if (resident) {
      const h = buildingById(homeId);
      if (h) { h.residents++; h.citizenIds.push(c.id); }
      assignJobFor(c);
      scheduleCitizenDay(c, absDay());
    }
    return c;
  }

  function isCountedPopulation(c) {
    // Patch 13: นับประชากรเฉพาะ Citizen ที่ย้ายเข้าถึงบ้านสำเร็จแล้วเท่านั้น
    // รถย้ายเข้าที่ยังอยู่ระหว่างทางจาก Gate จะไม่นับรวมในประชากร/ความสุข/ภาษี
    return !!(c && c.resident && c.hasHomeArrived && !c.removed);
  }


  function computeRoadMaintenance() {
    let m = 0;
    for (const i of roadIndices) {
      const rd = roadDataById(road[i]);
      if (rd && !mainRoad[i]) m += rd.maintenance;
    }
    return m;
  }

  function rebuildJobCountsFromCitizens() {
    // Patch 24: employees/workerIds ต้อง sync จาก Citizen จริงเสมอ
    // กันเคสเลขตำแหน่งงานค้าง ทำให้สร้างออฟฟิศแล้วระบบยังคิดว่างานเต็มหรือหาไม่เจอ
    for (const b of buildings) {
      const t = buildingType(b);
      if (!t || t.jobs <= 0) continue;
      b.employees = 0;
      b.workerIds = [];
    }
    for (const c of citizens) {
      if (!isCountedPopulation(c) || c.movingOut || !c.workId) continue;
      const b = buildingById(c.workId);
      const t = b ? buildingType(b) : null;
      if (!b || !t || t.jobs <= 0 || (b.employees || 0) >= t.jobs) {
        c.workId = null;
        continue;
      }
      b.employees = (b.employees || 0) + 1;
      if (!Array.isArray(b.workerIds)) b.workerIds = [];
      if (!b.workerIds.includes(c.id)) b.workerIds.push(c.id);
    }
  }

  function assignJobs() {
    rebuildJobCountsFromCitizens();
    for (const c of citizens) {
      if (isCountedPopulation(c) && !c.movingOut && !c.workId && c.profile.workDays.length) assignJobFor(c);
    }
  }

  function homeVacantSlots(b) {
    if (!b) return 0;
    const t = buildingType(b);
    if (!t || t.kind !== 'home') return 0;
    return Math.max(0, (t.residents || 0) - actualResidentsInBuilding(b) - (b.reservedResidents || 0));
  }

  function totalVacantHomeSlots() {
    return buildings.reduce((sum, b) => sum + homeVacantSlots(b), 0);
  }

  function currentMovingInCount() {
    return citizens.filter(c => !isCountedPopulation(c) && !c.removed && c.state === 'กำลังย้ายเข้า').length;
  }

  function findImmigrationPathToHomeFromGate(gate, home) {
    if (!gate || gate.entrance == null || !home) return [];

    // 1) ทางถูกกฎหมายเต็มรูปแบบ: เข้าเฉพาะเลนใกล้บ้านตามกฎเลนไทย
    let path = pathToBuildingAccess(gate.entrance, home, { trafficAware:false, cache:true, forceAnyPath:true, allowDeadEndUTurn:true });
    if (path.length) return path;

    // 2) Fallback ยังเคารพเลนใกล้อาคาร: หาเส้นไปยัง approachPrev ของ driveway โดยตรง
    // ใช้กรณี A*/กฎกลับรถเข้มเกินไป แต่ถนนจริงเชื่อมถึงกันอยู่
    const accesses = validAccessPointsForBuilding(home).map(a => refreshAccessLegalLinks(a)).filter(a => a && a.entryOk && a.approachPrevs && a.approachPrevs.length);
    let bestPath = [];
    let bestScore = Infinity;
    for (const access of accesses) {
      for (const approachPrev of access.approachPrevs) {
        const p = findPathToApproachPrev(gate.entrance, approachPrev, access, { trafficAware:false, forceAnyPath:true, allowDeadEndUTurn:true });
        if (!p.length || !hasRoadLink(p[p.length - 1], access.entrance)) continue;
        const candidate = p.concat([access.entrance]);
        const exactBonus = moveDirKey(approachPrev, access.entrance) === access.entryDirKey ? -1.5 : 0;
        const score = candidate.length + (access.score || 0) + exactBonus;
        if (score < bestScore) { bestScore = score; bestPath = candidate; }
      }
    }
    if (bestPath.length) return bestPath;

    // 3) ถ้า Gate หลักยังไม่อยู่ component เดียวกัน แต่มี Gate อื่นเชื่อม component บ้าน ให้ระบบไปลอง Gate อื่นใน caller
    return [];
  }

  function reachableGateAndPathForHome(home) {
    if (!home || home.entrance == null) return null;
    updateGateEntrances();
    const open = gates.filter(g => g.entrance != null && road[g.entrance]);
    if (!open.length) return null;

    // เรียง Gate จากใกล้บ้านก่อน แต่ยังวนตามเวลาเล็กน้อยเพื่อไม่ให้ทุกคนเข้าประตูเดียวกัน
    const hx = home.x + home.w / 2, hy = home.y + home.h / 2;
    const sorted = open.slice().sort((a, b) => {
      const ap = xy(a.entrance), bp = xy(b.entrance);
      return (Math.abs(ap.x - hx) + Math.abs(ap.y - hy)) - (Math.abs(bp.x - hx) + Math.abs(bp.y - hy));
    });
    const rotate = sorted.length ? (Math.floor(game.worldMin / 18) % sorted.length) : 0;
    const ordered = sorted.slice(rotate).concat(sorted.slice(0, rotate));

    for (const gate of ordered) {
      const path = findImmigrationPathToHomeFromGate(gate, home);
      if (path.length) return { gate, path };
    }
    return null;
  }

  function findReachableVacantHomePlan() {
    for (const home of buildings) {
      if (homeVacantSlots(home) <= 0) continue;
      const route = reachableGateAndPathForHome(home);
      if (route) return { home, gate: route.gate, path: route.path };
    }
    return null;
  }

  function assignJobFor(c) {
    // Patch 22: Job assignment ต้องไม่ทำ pathfinding/feasibility ทุกครั้งที่คนถึงบ้าน
    // งานเป็น “ความต้องการ” ก่อน ส่วนเส้นทางจริงให้ createTrip คำนวณแค่ตอนถึงเวลาออกเดินทาง
    if (!c || !c.profile || !c.profile.workDays.length) return false;
    const home = buildingById(c.homeId);
    if (!home) return false;
    let best = null, bestD = Infinity;
    for (const b of buildings) {
      const t = buildingType(b);
      if (!t || t.jobs <= 0) continue;
      if ((b.employees || 0) >= t.jobs) continue;
      // ไม่เช็ก path ตรงนี้แล้ว ลดการคำนวณซ้ำตอน MoveIn/Arrival/Build
      const d = Math.abs(home.x - b.x) + Math.abs(home.y - b.y);
      const load = ((b.employees || 0) / Math.max(1, t.jobs)) * 12;
      const score = d + load;
      if (score < bestD) { bestD = score; best = b; }
    }
    if (!best) {
      c.workId = null;
      c.lastKnownProblem = 'มีความต้องการทำงาน แต่ยังไม่มีตำแหน่งงานว่าง';
      return false;
    }
    best.employees = (best.employees || 0) + 1;
    if (!Array.isArray(best.workerIds)) best.workerIds = [];
    if (!best.workerIds.includes(c.id)) best.workerIds.push(c.id);
    c.workId = best.id;
    return true;
  }


  function serviceDemandWindowForCitizen(c, kind) {
    if (!c || !c.profile || !kind) return null;
    const p = c.profile;
    const day = absDay();
    const wd = weekday();
    if (p.trait === 'บ้านรวย' && ['mall','restaurant','pub'].includes(kind)) {
      return { kind, startAbs: absAt(day, p.richStart), endAbs: absAt(day + 1, 3 * 60), reason: 'บ้านรวยเที่ยวกลางคืน' };
    }
    if (p.workDays.includes(wd) && p.afterWork === kind && (p.trait !== 'ขยัน' || c.id % 6 === 0)) {
      return { kind, startAbs: absAt(day, p.afterWorkStart || p.workEndAt), endAbs: absAt(day, p.afterWorkEnd), reason: 'หลังเลิกงาน' };
    }
    if (!p.workDays.includes(wd) && p.weekendKind === kind) {
      return { kind, startAbs: absAt(day, p.weekendStart), endAbs: absAt(day, p.weekendEnd), reason: 'วันหยุด' };
    }
    return null;
  }

  function wakePendingDemand(c, delay = 0.5) {
    if (!c || !c.pendingAction) return false;
    c.pendingAction.retryAt = Math.min(c.pendingAction.retryAt || Infinity, game.worldMin + delay + (c.id % 20) * 0.05);
    pushEvent(c.pendingAction.retryAt, 'retryAction', { citizenId: c.id });
    return true;
  }

  function wakeCityDemandAfterBuildingAdded(b) {
    const t = buildingType(b);
    if (!t) return;
    // Patch 27: building confirm should not run city-wide job/service wake for homes.
    // Homes are handled by immigrationManager(); waking every citizen immediately after
    // every home build creates avoidable post-confirm stalls.
    if (t.kind === 'home') return;
    if (t.jobs > 0) assignJobs();
    let woke = 0;
    const now = game.worldMin;
    const today = absDay();
    const wd = weekday();

    for (const c of citizens) {
      if (!isCountedPopulation(c) || c.movingOut || c.removed) continue;

      if (c.pendingAction) {
        const pa = c.pendingAction;
        const matchWork = t.jobs > 0 && pa.type === 'goWork';
        const matchService = t.service > 0 && pa.type === 'leisure' && pa.data && pa.data.kind === t.kind;
        if (matchWork || matchService) {
          if (matchWork) {
            const timing = canStartWorkTodayWithoutInstantLate(c);
            if (!timing.ok || timing.reason === 'before-leave') {
              markWorkSkippedUntilNextShift(c, 'ยังไม่ถึงเวลางานหรือพ้นช่วงปลอดภัยของวันนี้');
              c.pendingAction = null;
              continue;
            }
          }
          if (wakePendingDemand(c, 0.5)) woke++;
          continue;
        }
      }

      if (c.currentVehicleId) continue;

      if (t.jobs > 0 && c.profile && c.profile.workDays.includes(wd)) {
        if (!c.workId) assignJobFor(c);
        const work = buildingById(c.workId);
        const origin = currentBuildingOf(c) || buildingById(c.homeId);
        const timing = canStartWorkTodayWithoutInstantLate(c);
        const startAbs = timing.timing ? timing.timing.leaveAt - 30 : absAt(today, c.profile.leaveWorkAt) - 30;
        const deadline = timing.timing ? timing.timing.deadline : absAt(today, c.profile.workStartDeadline);
        const safeToWakeWork = timing.ok && timing.reason !== 'before-leave';
        const wantsWork = (c.state && c.state.includes('ทำงาน'))
          || (c.lastKnownProblem && (c.lastKnownProblem.includes('งาน') || c.lastKnownProblem.includes('ทำงาน')))
          || (now >= startAbs && safeToWakeWork && origin && work && origin.id !== work.id);
        if (wantsWork && work && origin && origin.id !== work.id) {
          if (safeToWakeWork) {
            pushEvent(now + 0.5 + (c.id % 20) * 0.05, 'goWork', { citizenId: c.id, deadline });
            woke++;
            continue;
          }
          markWorkSkippedUntilNextShift(c, 'พ้นช่วงปลอดภัยของงานวันนี้แล้ว');
        }
      }

      if (t.service > 0 && c.profile) {
        const win = serviceDemandWindowForCitizen(c, t.kind);
        if (!win || now > win.endAbs + 5) continue;
        const origin = currentBuildingOf(c) || buildingById(c.homeId);
        if (origin && origin.kind === t.kind) continue;
        const wantsService = (c.state && c.state.includes(`ต้องการ${kindName(t.kind)}`))
          || (c.lastKnownProblem && c.lastKnownProblem.includes(kindName(t.kind)))
          || (now >= win.startAbs - 30 && now <= win.endAbs);
        if (wantsService) {
          schedulePendingAction(c, 'leisure', { kind: t.kind, endAbs: win.endAbs, reason: win.reason }, `มี${kindName(t.kind)}ใหม่แล้ว`, 1);
          woke++;
        }
      }
    }

    if (woke > 0) {
      addAlert('ปลุก Demand ใหม่', `สร้าง ${t.name} แล้ว Citizen ${woke} คนจะลองหา${t.jobs > 0 ? 'งาน' : kindName(t.kind)}ใหม่`, 1, 'good');
    }
  }

  function immigrationManager(gameMinutes) {
    game.immigrationTick += gameMinutes;
    // Patch 19: ยังปล่อยรถย้ายเข้ารวดเดียวตามบ้านว่างทั้งหมด
    // แต่คำนวณ path แบบรายอาคาร ไม่ใช่หา path ใหม่ทุก 1 คน เพื่อลด freeze ตอนบ้านใหญ่
    if (game.immigrationTick < 1) return;
    game.immigrationTick = 0;

    const residentsForSat = citizens.filter(isCountedPopulation);
    const population = residentsForSat.length;
    const avgSatForImmigration = residentsForSat.length
      ? residentsForSat.reduce((sum, c) => sum + c.satisfaction, 0) / residentsForSat.length
      : 100;

    if (avgSatForImmigration <= 80) {
      const d = absDay();
      if (game.lowSatImmigrationAlertDay !== d) {
        game.lowSatImmigrationAlertDay = d;
        addAlert('ประชากรหยุดย้ายเข้า', `ความสุขเฉลี่ย ${Math.round(avgSatForImmigration)}% ต้องมากกว่า 80% จึงจะมีคนย้ายเข้า`, 1, 'warn');
      }
      return;
    }

    const vacantSlots = totalVacantHomeSlots();
    if (vacantSlots <= 0) return;

    if (!gates.some(g => g.entrance != null)) {
      addAlert('ต้องการถนนเข้าเมือง', 'ไม่มี Gate ที่เชื่อมถนนเข้าบ้านว่างได้ คนย้ายเข้าไม่ได้', 1);
      return;
    }

    let moved = 0;
    let blockedHomes = 0;
    const homePlans = [];
    for (const home of buildings) {
      const t = buildingType(home);
      if (!t || t.kind !== 'home') continue;
      const slots = homeVacantSlots(home);
      if (slots <= 0) continue;
      const route = reachableGateAndPathForHome(home);
      if (!route) { blockedHomes += slots; continue; }
      homePlans.push({ home, gate: route.gate, path: route.path, slots });
    }

    outerMoveIn:
    for (const plan of homePlans) {
      const { home, gate, path, slots } = plan;
      for (let n = 0; n < slots; n++) {
        if (moved >= MAX_IMMIGRATION_TRIPS_PER_TICK) break outerMoveIn;
        const c = createCitizen(home.id, false);
        home.reservedResidents++;
        const ok = createTrip({
          citizen: c,
          fromIdx: gate.entrance,
          toIdx: home.entrance,
          type: 'MoveInTrip',
          deadline: game.worldMin + 1440,
          destBuildingId: home.id,
          gateId: gate.id,
          prePath: path,
          allowGateQueue: true,
          priorityTrip: true
        });
        if (!ok) {
          home.reservedResidents--;
          c.removed = true;
          blockedHomes++;
          continue;
        }
        gate.inToday++;
        moved++;
      }
    }

    if (moved > 0) {
      const remainingVacant = totalVacantHomeSlots();
      addAlert('คนย้ายเข้า', `ทยอยปล่อยรถย้ายเข้า ${moved} คัน/รอบ • บ้านว่างเหลือ ${remainingVacant} ช่อง • จะนับประชากรเมื่อถึงบ้านจริง`, 0.4, 'good');
    }
    if (blockedHomes > 0 && moved === 0) {
      addAlert('คนย้ายเข้าไม่ถึงบ้าน', `มีบ้านว่าง ${blockedHomes} ช่อง แต่ยังไม่มีเส้นทางที่เข้าเลนใกล้บ้านได้จริงจาก City Gate • ต่อถนนให้เชื่อม Gate หรือทำทางวน/U-turn ใกล้บ้าน`, 1, 'warn');
    }
  }

  function passThroughManager(gameMinutes) {
    // Patch 17: รถผ่านเมืองเคยคำนวณเส้นทางเป็นรอบ ๆ ทุก 20 นาทีเกม
    // ที่สปีด 5x จะตรงกับอาการกระตุกประมาณทุก 2 วินาทีจริง
    // จึงลดรอบและปิดเมื่อเมืองใหญ่ เพื่อให้ CPU ไปอยู่กับรถประชากรหลัก
    game.passTick += gameMinutes;
    if (game.passTick < PASS_THROUGH_INTERVAL_MIN) return;
    game.passTick = 0;
    const countedPopForTraffic = game.lastStats ? (game.lastStats.population || 0) : citizens.filter(isCountedPopulation).length;
    if (countedPopForTraffic >= PASS_THROUGH_DISABLE_POPULATION) return;
    if (vehicles.length > MAX_ACTIVE_VEHICLES * 0.45) return;
    const open = gates.filter(g => g.entrance != null);
    if (open.length < 2) return;
    const a = open[(Math.floor(game.worldMin / 90) + open.length) % open.length];
    const b = open[(Math.floor(game.worldMin / 131) + 1) % open.length];
    if (a.id === b.id) return;
    const path = findPath(a.entrance, b.entrance, true, { trafficAware:false, cache:true });
    if (!path.length) return;
    const ok = createTrip({ citizen: null, fromIdx: a.entrance, toIdx: b.entrance, type: 'PassThroughTrip', deadline: game.worldMin + 600, gateId: a.id, targetGateId: b.id, prePath: path });
    if (ok) { a.passToday++; b.passToday++; }
  }

  function findVacantHome() {
    return buildings.find(b => {
      const t = buildingType(b);
      if (t.kind !== 'home') return false;
      return actualResidentsInBuilding(b) + b.reservedResidents < t.residents;
    });
  }
  function chooseOpenGate() {
    const open = gates.filter(g => g.entrance != null);
    if (!open.length) return null;
    return open[(Math.floor(game.worldMin / 18) + open.length) % open.length];
  }

  function startWorkTrip(c, deadline) {
    if (!isCountedPopulation(c) || c.movingOut) return;
    if (c.currentVehicleId) {
      queueLifeAction(c, 'goWork', { deadline }, 'ถึงเวลาไปทำงาน แต่ยังอยู่บนรถ');
      return;
    }
    if (!c.workId) {
      if (!assignJobFor(c)) {
        const d = absDay();
        if (c.noJobPenaltyDay !== d) {
          c.noJobPenaltyDay = d;
          c.satisfaction = clamp(c.satisfaction - 10, 0, 100);
          addAlert('งานไม่พอ', `Citizen ${c.id} มีความต้องการทำงาน แต่ยังไม่มีตำแหน่งงานว่าง`, 1, 'warn');
        }
        c.state = 'ต้องการทำงาน แต่ยังไม่มีงานว่าง';
        c.lastKnownProblem = 'ไม่มีตำแหน่งงานว่าง';
        schedulePendingAction(c, 'goWork', { deadline }, 'รอออฟฟิศ/ตำแหน่งงานว่าง', 20);
        return;
      }
    }
    const home = buildingById(c.homeId), work = buildingById(c.workId);
    const origin = currentBuildingOf(c) || home;
    if (!origin || !work) {
      c.workId = null;
      c.state = 'ต้องการทำงาน แต่ยังหาปลายทางงานไม่ได้';
      c.lastKnownProblem = 'ปลายทางงานหายหรือยังไม่พร้อม';
      schedulePendingAction(c, 'goWork', { deadline }, 'รอปลายทางงานพร้อม', 20);
      return;
    }
    const ok = createTrip({ citizen: c, fromIdx: origin.entrance, toIdx: work.entrance, type: 'WorkTrip', deadline, fromBuildingId: origin.id, destBuildingId: work.id, priorityTrip: true });
    if (ok) {
      c.state = 'กำลังไปทำงาน';
      clearPendingAction(c, 'goWork');
    } else {
      // Patch 22: ไม่มี path จริง = บันทึก demand ว่าออกไม่ได้ ไม่สร้าง retry loop
      c.state = 'ต้องการไปทำงาน แต่ยังไม่มีเส้นทาง';
      c.lastKnownProblem = 'ไม่มีเส้นทางไปทำงาน';
      addAlert('ไม่มีเส้นทางไปทำงาน', `Citizen ${c.id} มีงานแล้ว แต่ถนน/ทางเข้าอาคารยังเชื่อมไม่ถึง`, 1, 'warn');
      schedulePendingAction(c, 'goWork', { deadline }, 'รอถนนเชื่อมไปทำงาน', 20);
    }
  }

  function startAfterWork(c) {
    if (!isCountedPopulation(c) || c.movingOut) return;
    if (c.currentVehicleId) {
      queueLifeAction(c, 'afterWork', {}, 'ถึงเวลาเลิกงาน แต่ยังเดินทางไม่เสร็จ');
      return;
    }
    const p = c.profile;
    if (p.afterWork && (p.trait !== 'ขยัน' || c.id % 6 === 0)) {
      startLeisure(c, p.afterWork, absAt(absDay(), p.afterWorkEnd), 'หลังเลิกงาน');
    } else {
      startReturnHome(c, 'เลิกงาน');
    }
  }
  function startWeekendLeisure(c) {
    if (!isCountedPopulation(c) || c.movingOut) return;
    if (c.currentVehicleId) {
      const p = c.profile;
      queueLifeAction(c, 'leisure', { kind: p.weekendKind, endAbs: absAt(absDay(), p.weekendEnd), reason: 'วันหยุด' }, 'ถึงเวลากิจกรรมวันหยุด แต่ยังอยู่บนรถ');
      return;
    }
    const p = c.profile;
    if (!p.weekendKind) return;
    startLeisure(c, p.weekendKind, absAt(absDay(), p.weekendEnd), 'วันหยุด');
  }
  function startRichLeisure(c) {
    if (!isCountedPopulation(c) || c.movingOut) return;
    if (c.currentVehicleId) {
      const kind = ['mall','restaurant','pub'][c.id % 3];
      queueLifeAction(c, 'leisure', { kind, endAbs: absAt(absDay() + 1, 3 * 60), reason: 'บ้านรวยเที่ยวกลางคืน' }, 'ถึงเวลาออกเที่ยว แต่ยังอยู่บนรถ');
      return;
    }
    const kind = ['mall','restaurant','pub'][c.id % 3];
    const endAbs = absAt(absDay() + 1, 3 * 60);
    startLeisure(c, kind, endAbs, 'บ้านรวยเที่ยวกลางคืน');
  }


  function currentBuildingOf(c) {
    if (!c.location || !c.location.startsWith('building:')) return null;
    return buildingById(Number(c.location.split(':')[1]));
  }

  // ================================================================
  // Building driveway + visible parking system
  // Cars no longer vanish when entering buildings. They park inside the
  // building, queue at the driveway, then wait for the road cell to be free
  // before turning out onto the road.
  // ================================================================
  function ensureBuildingVehicleStores(b) {
    if (!b) return null;
    if (!Array.isArray(b.parkedCars)) b.parkedCars = [];
    if (!Array.isArray(b.exitQueue)) b.exitQueue = [];
    if (!Number.isFinite(b.parkSeq)) b.parkSeq = 0;
    return b;
  }

  function buildingCenterPoint(b) {
    return { x: b.x + b.w / 2 - 0.5, y: b.y + b.h / 2 - 0.5 };
  }

  function accessForBuildingEntrance(b, entrance = null) {
    if (!b) return null;
    if (!b.accessPoints || !b.accessPoints.length) refreshBuildingAccess(b);
    const e = entrance != null ? entrance : b.entrance;
    return (b.accessPoints || []).find(a => a.entrance === e) || (b.accessPoints || [])[0] || null;
  }

  function drivewayPointForBuilding(b, entrance = null) {
    if (!b) return { x: 0, y: 0 };
    const center = buildingCenterPoint(b);
    const access = accessForBuildingEntranceAndFootprint(b, entrance);
    const roadP = roadAccessSidePointWorld(access, b) || (access && access.entrance != null ? roadCellVisualCenterWorld(access.entrance) : null);
    if (!roadP) return center;
    // ทางเชื่อมจะเริ่มจากขอบถนนฝั่งอาคาร ไม่ใช่แกนกลางถนน เพื่อแก้ปัญหาอาคารเหมือนต่อเข้าฝั่งตรงข้าม
    return {
      x: roadP.x + (center.x - roadP.x) * 0.58,
      y: roadP.y + (center.y - roadP.y) * 0.58
    };
  }

  function roadPointForBuildingEntrance(b, entrance = null) {
    const access = accessForBuildingEntranceAndFootprint(b, entrance);
    if (!access) return b ? buildingCenterPoint(b) : { x: 0, y: 0 };
    return roadAccessSidePointWorld(access, b) || roadCellVisualCenterWorld(access.entrance);
  }

  function drivewayAngleForBuilding(b, entrance = null, outward = false) {
    const drive = drivewayPointForBuilding(b, entrance);
    const roadP = roadPointForBuildingEntrance(b, entrance);
    return outward
      ? Math.atan2(roadP.y - drive.y, roadP.x - drive.x)
      : Math.atan2(drive.y - roadP.y, drive.x - roadP.x);
  }

  function parkingPointForBuilding(b, seq = 0) {
    const padX = Math.max(0.35, Math.min(0.8, b.w * 0.16));
    const padY = Math.max(0.35, Math.min(0.8, b.h * 0.20));
    const usableW = Math.max(0.6, b.w - padX * 2);
    const usableH = Math.max(0.6, b.h - padY * 2);
    const cols = Math.max(1, Math.min(5, Math.floor(usableW / 0.72) || 1));
    const rows = Math.max(1, Math.min(6, Math.floor(usableH / 0.62) || 1));
    const capacity = Math.max(1, cols * rows);
    const s = ((seq % capacity) + capacity) % capacity;
    const col = s % cols;
    const row = Math.floor(s / cols);
    return {
      x: b.x + padX + (col + 0.5) * usableW / cols,
      y: b.y + padY + (row + 0.5) * usableH / rows
    };
  }

  function queuePointForBuilding(b, queueIndex = 0, entrance = null) {
    const drive = drivewayPointForBuilding(b, entrance);
    const center = buildingCenterPoint(b);
    const dx = center.x - drive.x;
    const dy = center.y - drive.y;
    const len = Math.max(0.001, Math.hypot(dx, dy));
    const ux = dx / len;
    const uy = dy / len;
    // Car 1 Grid: รถรอออกจากอาคารเรียงห่างกันประมาณ 1 กริด ไม่ซ้อนเป็นก้อน
    const offset = 0.45 + queueIndex * 0.92;
    return {
      x: drive.x + ux * offset,
      y: drive.y + uy * offset
    };
  }

  function removeVehicleFromExitQueue(v) {
    if (!v || !v.exitBuildingId) return;
    const b = buildingById(v.exitBuildingId);
    if (!b || !Array.isArray(b.exitQueue)) return;
    b.exitQueue = b.exitQueue.filter(id => id !== v.id);
  }

  function takeParkedCarFromBuilding(b, citizenId = null, fallbackVehicleId = null, tripType = 'Trip') {
    ensureBuildingVehicleStores(b);
    let pick = -1;
    if (citizenId != null) pick = b.parkedCars.findIndex(c => c.citizenId === citizenId);
    if (pick < 0) pick = 0;
    if (pick >= 0 && pick < b.parkedCars.length) return b.parkedCars.splice(pick, 1)[0];
    const seq = b.parkSeq++;
    return {
      id: fallbackVehicleId || -1,
      citizenId,
      type: tripType,
      color: vehicleColor(tripType),
      parkSeq: seq,
      point: parkingPointForBuilding(b, seq),
      angle: drivewayAngleForBuilding(b, b.entrance, true),
      synthetic: true
    };
  }

  function addParkedCarToBuilding(b, v) {
    if (!b || !v || v.type === 'PassThroughTrip' || v.type === 'MoveOutTrip') return null;
    ensureBuildingVehicleStores(b);
    // One citizen should have one visible parked car in a building.
    if (v.citizenId != null) {
      for (const other of buildings) {
        ensureBuildingVehicleStores(other);
        other.parkedCars = other.parkedCars.filter(c => c.citizenId !== v.citizenId);
      }
    }
    const seq = b.parkSeq++;
    const car = {
      id: v.id,
      citizenId: v.citizenId,
      type: v.type,
      color: v.color || vehicleColor(v.type),
      parkSeq: seq,
      point: parkingPointForBuilding(b, seq),
      angle: drivewayAngleForBuilding(b, b.entrance, false),
      arrivedAt: game.worldMin
    };
    b.parkedCars.push(car);
    return car;
  }

  function departureQueueIndex(v) {
    if (v && Number.isFinite(v.renderQueueSlot)) return v.renderQueueSlot;
    if (v && Number.isFinite(v.queueSlot)) return v.queueSlot;
    const b = v && v.exitBuildingId ? buildingById(v.exitBuildingId) : null;
    if (!b || !Array.isArray(b.exitQueue)) return 0;
    const i = b.exitQueue.indexOf(v.id);
    return i < 0 ? 0 : i;
  }

  function startLeisure(c, kind, endAbs, reason) {
    if (!isCountedPopulation(c) || c.movingOut) return;
    if (Number.isFinite(endAbs) && game.worldMin > endAbs + 5) {
      if ((currentBuildingOf(c) || buildingById(c.homeId))?.id !== c.homeId) startReturnHome(c, 'หมดเวลากิจกรรม');
      return;
    }
    if (c.currentVehicleId) {
      queueLifeAction(c, 'leisure', { kind, endAbs, reason }, 'ถึงเวลาไปกิจกรรม แต่ยังอยู่บนรถ');
      return;
    }
    const origin = currentBuildingOf(c) || buildingById(c.homeId);
    if (!origin) return;
    const target = findServiceBuilding(kind, origin.entrance);
    if (!target) {
      const d = absDay();
      if (c.noServicePenaltyDay !== d) {
        c.noServicePenaltyDay = d;
        c.satisfaction = clamp(c.satisfaction - 9, 0, 100);
        addAlert(`ต้องการ${kindName(kind)}`, `${reason}: ไม่มีอาคารหรือ Capacity ว่างสำหรับ ${kindName(kind)} จะลองใหม่อัตโนมัติ`, 1, 'warn');
      }
      c.state = `ต้องการ${kindName(kind)} แต่ยังไม่มีปลายทางว่าง`;
      c.lastKnownProblem = `ไม่มี${kindName(kind)}หรือ Capacity ไม่พอ`;
      schedulePendingAction(c, 'leisure', { kind, endAbs, reason }, `รอ${kindName(kind)}หรือ Capacity ว่าง`, 20);
      if (origin.id !== c.homeId && game.worldMin >= endAbs - 20) startReturnHome(c, 'ปลายทางกิจกรรมเต็ม');
      return;
    }
    target.reservedService++;
    const ok = createTrip({ citizen: c, fromIdx: origin.entrance, toIdx: target.entrance, type: 'LeisureTrip', deadline: endAbs, fromBuildingId: origin.id, destBuildingId: target.id, reservedService: true, activityEnd: endAbs, priorityTrip: true });
    if (ok) {
      c.state = `กำลังไป${kindName(kind)}`;
      clearPendingAction(c, 'leisure');
    } else {
      target.reservedService--;
      const d = absDay();
      if (c.noRoutePenaltyDay !== d) {
        c.noRoutePenaltyDay = d;
        c.satisfaction = clamp(c.satisfaction - 12, 0, 100);
        addAlert('ยังออกไปกิจกรรมไม่ได้', `${reason}: ${kindName(kind)} มีอยู่ แต่รถยังออกไม่ได้/เส้นทางไม่พร้อม จะ retry`, 1, 'warn');
      }
      c.state = `ต้องการไป${kindName(kind)} แต่ยังไม่มีเส้นทาง`;
      c.lastKnownProblem = `ไม่มีเส้นทางไป${kindName(kind)}`;
      schedulePendingAction(c, 'leisure', { kind, endAbs, reason }, `รอถนนเชื่อมไป${kindName(kind)}`, 20);
    }
  }

  function kindName(kind) {
    return ({ shop:'ร้านค้า', restaurant:'ร้านอาหาร', mall:'ห้าง', park:'สวน', pub:'ผับ' })[kind] || kind;
  }


  function tripTypeName(type) {
    return ({ WorkTrip:'ไปทำงาน', LeisureTrip:'ไปกิจกรรม/บริการ', ReturnHomeTrip:'กลับบ้าน', MoveInTrip:'ย้ายเข้า', MoveOutTrip:'ย้ายออก', PassThroughTrip:'รถผ่านเมือง' })[type] || type || '-';
  }

  function citizenPainReasonText(reason) {
    return ({
      traffic:'รถติดหรือรอคิวนาน',
      late:'เดินทางล่าช้า',
      signal:'รอสัญญาณไฟนาน',
      queue:'ติดคิวหน้าอาคาร',
      noRoute:'ไม่มีเส้นทางไปปลายทาง',
      noService:'บริการ/กิจกรรมไม่พอ',
      noJob:'ไม่มีที่ทำงาน'
    })[reason] || reason || 'ยังไม่พบสาเหตุชัดเจน';

  function recordCitizenTripStart(c, v) {
    if (!c || !v) return;
    if (!Array.isArray(c.tripHistory)) c.tripHistory = [];
    c.tripHistory.unshift({
      t: game.worldMin,
      vehicleId: v.id,
      type: v.type,
      fromBuildingId: v.fromBuildingId || null,
      destBuildingId: v.destBuildingId || null,
      pathLen: Array.isArray(v.path) ? v.path.length : 0,

    });

  function buildingShortLabel(b) {
    if (!b) return '-';
    const t = buildingType(b);
    return `${t.name} #${b.id} (${b.x},${b.y})`;
  }

  function roadShortLabel(i) {
    if (i == null || i < 0) return '-';
    const p = xy(i);
    const rd = roadDataById(road[i]);
    const ratio = road[i] ? getRoadRatio(i) : 0;
    return `${rd ? rd.name : 'ถนน'} ${p.x},${p.y} • ${roadStatus(ratio)}`;
  }

  function vehicleById(id) {
    const n = Number(id);
    return vehicleByIdMap.get(n) || null;
  }

  function citizenById(id) {
    const n = Number(id);
    return citizenByIdMap.get(n) || citizens.find(c => c.id === n) || null;
  }

  function currentVehicleOfCitizen(c) {
    if (!c || !c.currentVehicleId) return null;
    return vehicleById(c.currentVehicleId);
  }

  function citizenLocationText(c) {
    if (!c) return '-';
    if (c.currentVehicleId) return `อยู่บนรถ #${c.currentVehicleId}`;
    if (c.location && c.location.startsWith('building:')) {
      const b = buildingById(Number(c.location.split(':')[1]));
      return b ? buildingShortLabel(b) : c.location;
    }
    return c.location || '-';
  }

  function citizenDestinationText(c) {
    const v = currentVehicleOfCitizen(c);
    if (v) {
      const b = v.destBuildingId ? buildingById(v.destBuildingId) : null;
      const g = v.targetGateId || v.gateId ? gates.find(x => x.id === (v.targetGateId || v.gateId)) : null;
      return b ? buildingShortLabel(b) : g ? g.name : '-';
    }
    if (!c) return '-';
    if (c.state && c.state.includes('ทำงาน') && c.workId) return buildingShortLabel(buildingById(c.workId));
    return c.scheduleNote || 'ยังไม่มีทริปต่อไป';
  }

  function citizenProblemSummary(c) {
    if (!c) return 'ไม่มีข้อมูล Citizen';
    const issues = [];
    if (c.removed) issues.push('ออกจากเมืองแล้ว');
    if (c.movingOut) issues.push('กำลังย้ายออกเพราะความสุข/งานมีปัญหา');
    // v0.8.4: "กำลังย้ายเข้า" เป็นสถานะปกติ ไม่ใช่เหตุผลปัญหา
    if (!c.resident && !c.removed && isNormalMovingInCitizen(c)) issues.push('กำลังย้ายเข้า: สถานะปกติ รอรถถึงบ้าน');
    if (c.resident && c.profile && c.profile.workDays.length && !c.workId) issues.push('ไม่มีที่ทำงาน');
    if (c.lateToday || c.lateTaxPenalty) issues.push('เดินทางล่าช้า วันนี้เสียภาษีเหลือครึ่งเดียว');
    if ((c.trafficPainToday || 0) > 0) issues.push(`โดนผลกระทบรถติด -${Math.round(c.trafficPainToday)} ความสุข`);
    if (c.lastKnownProblem && !isNormalMovingInCitizen(c)) issues.push(c.lastKnownProblem);
    if (!issues.length) issues.push('ยังไม่พบปัญหาหลัก วันนี้สถานะปกติ');
    return issues.join(' • ');
  }

  function worstRoadOnVehiclePath(v) {
    if (!v || !Array.isArray(v.path) || !v.path.length) return null;
    let best = null;
    let bestScore = -Infinity;
    const a = Math.max(0, (v.pathPos || 0) - 8);
    const b = Math.min(v.path.length, (v.pathPos || 0) + 60);
    for (let k = a; k < b; k++) {
      const i = v.path[k];
      if (!road[i]) continue;
      const score = getRoadRatio(i) * 1.8 + waitLoad[i] * 0.8 + flowLoad[i] * 0.06 + signalPassLoad[i] * 0.5;
      if (score > bestScore) { bestScore = score; best = i; }
    }
    return best;
  }

  function roadCellsNearBuilding(b, radius = 12) {
    const out = [];
    if (!b) return out;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const minX = clamp(Math.floor(cx - radius), 0, MAP_W - 1);
    const maxX = clamp(Math.ceil(cx + radius), 0, MAP_W - 1);
    const minY = clamp(Math.floor(cy - radius), 0, MAP_H - 1);
    const maxY = clamp(Math.ceil(cy + radius), 0, MAP_H - 1);
    for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) {
      const i = idx(x, y);
      if (road[i]) out.push(i);
    }
    return out;
  }

  function worstRoadNearBuildings(buildingIds, radius = 14) {
    let best = null, bestScore = -Infinity;
    const seen = new Set();
    for (const id of buildingIds || []) {
      const b = buildingById(id);
      if (!b) continue;
      for (const i of roadCellsNearBuilding(b, radius)) {
        if (seen.has(i)) continue;
        seen.add(i);
        const score = getRoadRatio(i) * 2 + waitLoad[i] * 0.75 + flowLoad[i] * 0.04 + signalPassLoad[i] * 0.5;
        if (score > bestScore) { bestScore = score; best = i; }
      }
    }
    return best;
  }

  function preferredOriginForService(c, kind) {
    if (!c) return null;
    if (kind === 'restaurant' && c.workId && c.profile && c.profile.workDays.includes(weekday())) return buildingById(c.workId);
    if ((kind === 'mall' || kind === 'pub' || kind === 'park' || kind === 'shop') && c.homeId) return buildingById(c.homeId);
    return currentBuildingOf(c) || buildingById(c.homeId) || buildingById(c.workId);
  }

  function citizenNeedsServiceToday(c, kind) {
    if (!c || !c.resident || c.removed || c.movingOut || !c.profile) return false;
    const p = c.profile;
    if (p.trait === 'บ้านรวย') return ['mall','restaurant','pub'].includes(kind);
    if (p.workDays.includes(weekday())) return p.afterWork === kind && (p.trait !== 'ขยัน' || c.id % 6 === 0);
    return p.weekendKind === kind;
  }

  function rankDemandOrigins(kind) {
    const counts = new Map();
    const residents = citizens.filter(c => isCountedPopulation(c) && !c.movingOut);
    if (kind === 'job') {
      for (const c of residents) {
        if (!c.profile.workDays.length || c.workId) continue;
        const h = buildingById(c.homeId);
        if (h) counts.set(h.id, (counts.get(h.id) || 0) + 1);
      }
    } else if (kind === 'home') {
      for (const g of gates) if (g.entrance != null) counts.set(`gate:${g.id}`, Math.max(1, g.inToday || 1));
    } else if (['shop','restaurant','mall','park','pub'].includes(kind)) {
      for (const c of residents) {
        if (!citizenNeedsServiceToday(c, kind)) continue;
        const b = preferredOriginForService(c, kind);
        if (b) counts.set(b.id, (counts.get(b.id) || 0) + 1);
      }
    }
    return [...counts.entries()].map(([id, count]) => ({ id, count, building: typeof id === 'number' ? buildingById(id) : null }))
      .sort((a,b)=>b.count-a.count).slice(0, 3);
  }

  function smartDemandRecommendation(kind, shortage = 0) {
    if (kind === 'gateRoad') return { text:'ควรต่อถนนจาก Gate เข้าเมืองก่อน เพื่อให้คนย้ายเข้าและรถผ่านเมืองเริ่มทำงาน', targetBuildingId:null, roadIdx:null };
    const origins = rankDemandOrigins(kind);
    const buildingIds = origins.filter(o => o.building).map(o => o.building.id);
    const bottleneck = worstRoadNearBuildings(buildingIds, 14);
    const main = origins.find(o => o.building)?.building || null;
    let text = '';
    if (kind === 'job') {
      text = main ? `คนว่างงานกระจุกใกล้ ${buildingShortLabel(main)} แนะนำสร้างออฟฟิศ/โรงงานใกล้กลุ่มบ้านนี้ หรือทำถนนไปย่านงานให้สั้นลง` : 'แนะนำสร้างออฟฟิศหรือโรงงานเพิ่มใกล้กลุ่มบ้านที่มีประชากร';
    } else if (kind === 'home') {
      text = 'บ้านว่างหมดแล้ว แนะนำสร้างบ้านใหม่ใกล้ถนนที่เชื่อม Gate เพื่อให้คนย้ายเข้าถึงบ้านง่าย';
    } else if (['shop','restaurant','mall','park','pub'].includes(kind)) {
      const place = main ? buildingShortLabel(main) : 'กลุ่มบ้าน/ออฟฟิศที่มีรถออกเยอะ';
      text = `แนะนำสร้าง${kindName(kind)}เพิ่มใกล้ ${place} เพราะมีความต้องการประมาณ ${formatCompact(shortage)} คนที่ยังรองรับไม่พอ`;
    } else {
      text = 'แนะนำดูจุดที่ประชาชนออกเดินทางบ่อย และเพิ่มอาคารที่ขาดใกล้จุดนั้น';
    }
    if (bottleneck != null && getRoadRatio(bottleneck) > 0.75) text += ` • ถนนที่น่าตรวจ: ${roadShortLabel(bottleneck)}`;
    return { text, targetBuildingId: main ? main.id : null, roadIdx: bottleneck };
  }

  function focusGrid(x, y, zoom = null) {
    const z = zoom || game.zoom;
    game.zoom = clamp(z, 0.22, 5.2);
    game.pan.x = window.innerWidth / 2 - x * TILE * game.zoom;
    game.pan.y = window.innerHeight / 2 - y * TILE * game.zoom;
  }

  function focusBuilding(b) {
    if (!b) return;
    focusGrid(b.x + b.w / 2, b.y + b.h / 2, Math.max(game.zoom, 1.25));
  }

  function focusRoadIdx(i) {
    if (i == null) return;
    const p = xy(i);
    focusGrid(p.x + .5, p.y + .5, Math.max(game.zoom, 1.45));
  }

  function updateFollowCamera() {
    if (!game.followVehicleId) return;
    const v = vehicleById(game.followVehicleId);
    if (!v) {
      game.followVehicleId = null;
      return;
    }
    const pos = vehicleDrawPosition(v);
    focusGrid(pos.x + .5, pos.y + .5, game.zoom);
  }

  function findServiceBuilding(kind, fromIdx) {
    // Patch 22: Service selection ห้าม pathfinding ทุกอาคาร
    // เลือกจาก capacity + ระยะทางคร่าว ๆ เท่านั้น แล้วให้ createTrip คำนวณ path จริงครั้งเดียวตอนสร้าง demand
    reconcileBuildingReservations();
    const fromP = (fromIdx != null && fromIdx >= 0) ? xy(fromIdx) : null;
    let best = null, bestCost = Infinity;
    for (const b of buildings) {
      const t = buildingType(b);
      if (!t || t.kind !== kind || t.service <= 0) continue;
      const remaining = t.service - (b.visitors || 0) - (b.reservedService || 0);
      if (remaining <= 0) continue;
      const loadRatio = ((b.visitors || 0) + (b.reservedService || 0)) / Math.max(1, t.service);
      const d = fromP ? Math.abs(fromP.x - b.x) + Math.abs(fromP.y - b.y) : 0;
      const cost = d + loadRatio * 18;
      if (cost < bestCost) { bestCost = cost; best = b; }
    }
    return best;
  }

  function startReturnHome(c, reason) {
    if (!isCountedPopulation(c) || c.removed) return;
    if (c.currentVehicleId) {
      queueLifeAction(c, 'returnHome', { reason }, 'ถึงเวลากลับบ้าน แต่ยังอยู่บนรถ');
      return;
    }
    const origin = currentBuildingOf(c) || buildingById(c.workId) || buildingById(c.homeId);
    const home = buildingById(c.homeId);
    if (!origin || !home || origin.id === home.id) {
      c.location = `building:${c.homeId}`;
      c.state = 'อยู่บ้าน';
      clearPendingAction(c, 'returnHome');
      return;
    }
    const ok = createTrip({ citizen: c, fromIdx: origin.entrance, toIdx: home.entrance, type: 'ReturnHomeTrip', deadline: game.worldMin + 480, fromBuildingId: origin.id, destBuildingId: home.id, priorityTrip: true });
    if (ok) {
      if (origin.kind !== 'home' && buildingType(origin).service > 0) origin.visitors = Math.max(0, origin.visitors - 1);
      c.state = `กำลังกลับบ้าน (${reason})`;
      clearPendingAction(c, 'returnHome');
    } else {
      c.state = 'ต้องการกลับบ้าน แต่ยังไม่มีเส้นทาง';
      c.lastKnownProblem = 'ไม่มีเส้นทางกลับบ้าน';
      addAlert('ไม่มีเส้นทางกลับบ้าน', `Citizen ${c.id} อยู่ต่างอาคาร แต่ถนนกลับบ้านยังเชื่อมไม่ถึง`, 1, 'warn');
    }
  }

  function startMoveOut(c) {
    if (!isCountedPopulation(c) || c.removed) return;
    if (c.currentVehicleId) {
      queueLifeAction(c, 'moveOut', {}, 'ต้องการย้ายออก แต่ยังอยู่บนรถ');
      return;
    }
    const home = buildingById(c.homeId);
    const gate = chooseOpenGate();
    if (!home || !gate || gate.entrance == null) return;
    const ok = createTrip({ citizen: c, fromIdx: home.entrance, toIdx: gate.entrance, type: 'MoveOutTrip', deadline: game.worldMin + 1440, fromBuildingId: home.id, gateId: gate.id, priorityTrip: true });
    if (ok) {
      c.state = 'กำลังย้ายออก';
      c.movingOut = true;
      clearPendingAction(c, 'moveOut');
    } else {
      c.state = 'ต้องการย้ายออก แต่ยังไม่มีเส้นทาง';
      c.lastKnownProblem = 'ไม่มีเส้นทางย้ายออก';

  function isValidBuildingAccessEntrance(b, roadIdx) {

    if (!b || !Array.isArray(path) || path.length < 2) return false;
    const entrance = path[path.length - 1];
    const prev = path[path.length - 2];
    if (entrance == null || prev == null || !road[entrance] || !road[prev]) return false;
    const list = validAccessPointsForBuilding(b).map(a => refreshAccessLegalLinks(a));

  }

  function pathStartsWithLegalBuildingExit(path, b) {
    if (!b || !Array.isArray(path) || path.length < 2) return false;
    const entrance = path[0];
    const next = path[1];
    if (entrance == null || next == null || !road[entrance] || !road[next]) return false;
    const list = validAccessPointsForBuilding(b).map(a => refreshAccessLegalLinks(a));

      const cur = path[p];
      const next = path[p + 1];
      if (wouldUTurn(prev, cur, next) && !canUTurnAtForPath(cur, prev, opts)) {

  function validateLockedTripPath(opts, path) {
    if (!Array.isArray(path) || !path.length) return [];
    const from = opts.fromIdx;
    const to = opts.toIdx;
    const fromBuilding = opts.fromBuildingId ? buildingById(opts.fromBuildingId) : null;
    const destBuilding = opts.destBuildingId ? buildingById(opts.destBuildingId) : null;
    const actualFrom = path[0];
    const actualTo = path[path.length - 1];

    // ห้ามมี U-turn กลางทาง ยกเว้นจุดที่กฎหมาย/เกมอนุญาตไว้ตั้งแต่ตอนวาง route

      if (path.length > 1 && !pathStartsWithLegalBuildingExit(path, fromBuilding)) return [];
    } else if (actualFrom !== from) return [];

      if (path.length > 1 && !pathEndsWithLegalBuildingApproach(path, destBuilding)) return [];

  function buildLockedTripPathForCreation(opts) {
    const from = opts.fromIdx;
    const to = opts.toIdx;
    if (from == null || to == null || !road[from] || !road[to]) return [];
    const hasBuildingAccess = !!(opts.fromBuildingId || opts.destBuildingId);
    const isLifeTrip = isLifeTripType(opts.type);

    // เพราะ fallback นั้นคือสาเหตุที่ทำให้รถเลือกทางสั้นแต่กลับรถ/ข้ามฝั่งผิดกฎ แล้วไปแก้ซ้ำใน moveVehicle()
    const strictOpts = {

      prePath: null,
      trafficAware: false,
      cache: !hasBuildingAccess,
      allowDeadEndUTurn: true,
      enforceNoUTurn: true,
      forceAnyPath: false,
      allowWrongLaneBuildingAccess: false

      : (isLifeTrip

        : constrainedPathForTrip(strictOpts));

    if (path.length) return path;

  function releaseVehicleReservation(v, reason = '') {

    return true;

  function removeVehicleFromSimulation(v, reason = '', releaseReserve = true, animate = true) {

    removeVehicleFromExitQueue(v);

      if (v.reserve.kind === 'resident') residentHolds.set(b.id, (residentHolds.get(b.id) || 0) + 1);
      if (v.reserve.kind === 'service') serviceHolds.set(b.id, (serviceHolds.get(b.id) || 0) + 1);

  function vehicleColor(type) {

  class MinHeap {

  function findAnyConnectedPath(start, goal, opts = {}) {

    // ใช้ BFS บน roadLinks โดยไม่สนกฎเลน/กลับรถ เพื่อกันเคส A* ตัดเพราะ maxIter หรือกฎเข้มเกินไป
    if (start === goal) return [start];
    if (start == null || goal == null || !road[start] || !road[goal]) return [];
    const token = nextPathSearchToken();
    const queue = new Int32Array(MAP_SIZE);
    let head = 0, tail = 0;
    searchMark[start] = token;
    cameFrom[start] = -1;
    queue[tail++] = start;
    const maxNodes = Math.max(1, Math.min(MAP_SIZE, opts.maxNodes || MAP_SIZE));

    while (head < tail && head < maxNodes) {

      if (cur === goal) break;
      const ns = linkedNeighbors(cur);
      for (let k = 0; k < ns.length; k++) {
        const ni = ns[k];
        if (!road[ni] || searchMark[ni] === token) continue;
        searchMark[ni] = token;
        cameFrom[ni] = cur;
        queue[tail++] = ni;
        if (ni === goal) { head = tail; break; }

    if (searchMark[goal] !== token) return [];
    const path = [];
    let cur = goal;
    let guard = 0;
    while (cur >= 0 && guard++ < MAP_SIZE) {
      path.push(cur);
      if (cur === start) break;
      cur = cameFrom[cur];
    }
    if (path[path.length - 1] !== start) return [];
    path.reverse();
    return path;

  function findPath(start, goal, quiet = false, opts = {}) {
