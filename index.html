  function renderAlerts() {
    const s = game.lastStats || computeStats();
    const residents = citizens.filter(isCountedPopulation);
    const net = (s.residentTax || 0) + (s.businessTax || 0) - (s.maintenance || 0);
    const demandRows = computeDemandSummary().slice(0, 4);
    const feed = [];

    if (!residents.length) {
      feed.push({ cls:'warn', icon:'🏠', title:'เมืองยังไม่มีประชากร', detail:'สร้างบ้านและเชื่อมถนนเข้ากับ Gate เพื่อให้คนย้ายเข้า' });
    }
    if ((s.demandShortage || 0) > 0) {
      feed.push({ cls:'warn', icon:'📌', title:'Demand ยังขาด', detail:`มีความต้องการที่ยังรองรับไม่พอ ${s.demandShortage} หน่วย กดการ์ด “ความต้องการ” ด้านบนเพื่อดูรายละเอียด` });
    }
    if ((s.avgSat || 100) <= 80 && residents.length) {
      feed.push({ cls:'bad', icon:'😊', title:'ความสุขไม่เกิน 80%', detail:'ระบบย้ายเข้าต้องการความสุขเฉลี่ยมากกว่า 80% จึงจะปล่อยคนใหม่เข้าบ้านว่าง' });
    }
    if ((s.lateResidents || 0) > 0) {
      feed.push({ cls:'bad', icon:'⏱', title:'มีคนเดินทางล่าช้า', detail:`วันนี้มี ${s.lateResidents} คนโดนหักภาษีล่าช้า ทำให้รายได้หาย ${formatMoney(s.taxLost || 0)} บาท` });
    }
    if (net < 0) {
      feed.push({ cls:'bad', icon:'💸', title:'รายวันติดลบ', detail:`สุทธิ/วัน ${formatMoney(net)} บาท ตรวจค่าถนนและรายรับจากประชากร` });
    }

    const recent = alerts.slice(0, 7).map(a => ({
      cls: a.kind === 'good' ? 'good' : (a.kind === 'warn' ? 'warn' : 'bad'),
      icon: a.kind === 'good' ? '✅' : '⚠️',
      title: `${a.title}${a.count > 1 ? ` ×${a.count}` : ''}`,
      detail: a.detail
    }));

    const demandHtml = demandRows.length ? demandRows.map(d => {
      const shortage = Math.max(0, d.shortage || 0);
      const cls = shortage > 0 ? 'warn' : 'good';
      const value = d.capacity ? `${d.used || 0}/${d.capacity}` : `${d.need || 0}`;
      return `<div class="city-feed-item ${cls}"><b>${d.icon || '📌'} ${escapeHtml(d.label)} <span class="muted">${escapeHtml(value)}</span></b>${escapeHtml(d.detail || (shortage ? `ขาด ${shortage}` : 'รองรับพอ'))}${d.recommendation && shortage > 0 ? `<div class="smart-tip">${escapeHtml(d.recommendation)}</div>` : ''}</div>`;
    }).join('') : '<div class="city-feed-empty">✅ Demand หลักยังปกติ</div>';

    const feedHtml = feed.concat(recent).slice(0, 9).map(item => `
      <div class="city-feed-item ${item.cls || ''}">
        <b>${item.icon || '•'} ${escapeHtml(item.title)}</b>
        ${escapeHtml(item.detail || '')}
      </div>`).join('') || '<div class="city-feed-empty">✅ เมืองยังไม่มีแจ้งเตือนสำคัญ</div>';

    alertsEl.innerHTML = `
      <div class="city-feed-summary">
        <div class="city-feed-card"><span>เวลา</span><b>D${absDay()+1} ${minLabel(minuteOfDay())}</b></div>
        <div class="city-feed-card"><span>สุทธิ/วัน</span><b>${net >= 0 ? '+' : ''}${formatCompact(net)}</b></div>
        <div class="city-feed-card"><span>Flow</span><b>${Math.round(s.trafficFlow || 0)}%</b></div>
        <div class="city-feed-card"><span>ถนน/คิว</span><b>${s.roadCars || 0}/${s.queuedTrips || 0}</b></div>
      </div>
      <div class="city-feed-section-title"><span>Demand Alert</span><span class="muted">${demandRows.length} รายการ</span></div>
      ${demandHtml}
      <div class="city-feed-section-title"><span>อัปเดตเมือง</span><span class="muted">ล่าสุด</span></div>
      ${feedHtml}`;
  }


  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    drawTerrain(w, h);
    const view = visibleGridBounds(w, h);
    drawGrid(view);
    drawRoads(view);
    drawBuildings(view);
    drawGates();
    drawVehicles();
    drawTrackedVehiclePath();
    drawPreview();
    drawHoverInfo();
  }

  function visibleGridBounds(w, h) {
    const a = screenToGrid(-80, -80);
    const b = screenToGrid(w + 80, h + 80);
    return { minX: clamp(a.x, 0, MAP_W - 1), minY: clamp(a.y, 0, MAP_H - 1), maxX: clamp(b.x, 0, MAP_W - 1), maxY: clamp(b.y, 0, MAP_H - 1) };
  }

  function drawTerrain(w, h) {
    const city = DATA.cities[game.cityKey];
    const g = ctx.createLinearGradient(0, 0, w, h);
    if (city.terrain === 'island') {
      g.addColorStop(0, '#7ec8d7');
      g.addColorStop(.30, '#9bd2c3');
      g.addColorStop(.46, '#d8c982');
      g.addColorStop(.54, '#8fc476');
      g.addColorStop(1, '#6faa63');
    } else if (city.terrain === 'river') {
      g.addColorStop(0, '#9acb88');
      g.addColorStop(.46, '#86bd76');
      g.addColorStop(.5, '#4aa6c8');
      g.addColorStop(.55, '#83b973');
      g.addColorStop(1, '#77ad67');
    } else if (city.terrain === 'mountain') {
      g.addColorStop(0, '#7fac70');
      g.addColorStop(.26, '#a4a571');
      g.addColorStop(.34, '#7aa268');
      g.addColorStop(1, '#79b16a');
    } else {
      g.addColorStop(0, '#a3c879');
      g.addColorStop(.52, '#95bf6d');
      g.addColorStop(1, '#85ae62');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // Subtle map texture: softer than the old debug-like terrain.
    ctx.save();
    ctx.globalAlpha = .10;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 34; i++) {
      const x = (i * 193 + 41) % Math.max(1, w);
      const y = (i * 137 + 79) % Math.max(1, h);
      const rw = 90 + (i * 31) % 180;
      const rh = 24 + (i * 17) % 78;
      ctx.beginPath();
      ctx.ellipse(x, y, rw, rh, (i % 7) * .35, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (city.terrain === 'river') {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(24, 119, 151, .72)';
      ctx.lineWidth = Math.max(70, h * .09);
      ctx.beginPath();
      ctx.moveTo(w * .44, -40);
      ctx.bezierCurveTo(w * .55, h * .18, w * .34, h * .36, w * .48, h * .55);
      ctx.bezierCurveTo(w * .62, h * .73, w * .44, h * .9, w * .57, h + 50);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(226, 248, 255, .40)';
      ctx.lineWidth = Math.max(13, h * .015);
      ctx.stroke();
      ctx.restore();
    }

    if (city.terrain === 'mountain') {
      ctx.save();
      ctx.globalAlpha = .25;
      ctx.fillStyle = '#405b3a';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(-60, h * (.1 + i * .18));
        ctx.lineTo(w * (.16 + i * .02), h * (.03 + i * .18));
        ctx.lineTo(w * (.3 + i * .03), h * (.16 + i * .18));
        ctx.lineTo(-60, h * (.25 + i * .18));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Soft vignette keeps the play area readable under UI panels.
    const vignette = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*.2, w/2, h/2, Math.max(w,h)*.72);
    vignette.addColorStop(0, 'rgba(255,255,255,0)');
    vignette.addColorStop(1, 'rgba(15,23,42,.16)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0,0,w,h);
  }

  function drawGrid(view) {
    if (!game.debug && game.zoom < 1.05) return;
    const zt = TILE * game.zoom;
    ctx.strokeStyle = game.debug ? 'rgba(15,23,42,.13)' : 'rgba(15,23,42,.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = view.minX; x <= view.maxX; x++) {
      const sx = Math.floor(x * zt + game.pan.x) + .5;
      ctx.moveTo(sx, view.minY * zt + game.pan.y);
      ctx.lineTo(sx, (view.maxY + 1) * zt + game.pan.y);
    }
    for (let y = view.minY; y <= view.maxY; y++) {
      const sy = Math.floor(y * zt + game.pan.y) + .5;
      ctx.moveTo(view.minX * zt + game.pan.x, sy);
      ctx.lineTo((view.maxX + 1) * zt + game.pan.x, sy);
    }
    ctx.stroke();
  }

  function roadVisualFootprintGrids(rt) {
    const rd = roadDataById(rt) || DATA.roads.small;
    // Patch 3: ขนาดภาพถนนตามสเกลที่กำหนด
    // ถนน 2 และ 4 เลน ใช้พื้นที่กว้าง 2 กริด, ถนน 8 เลน ใช้พื้นที่กว้าง 4 กริด
    return rd.lanes >= 8 ? 4 : 2;
  }

  function roadVisualFootprintWidth(rt, zt) {
    return zt * roadVisualFootprintGrids(rt);
  }

  function roadVisualWidth(rt, zt) {
    const rd = roadDataById(rt) || DATA.roads.small;
    const footprint = roadVisualFootprintWidth(rt, zt);
    // เว้นไหล่ทางเล็กน้อยใน footprint เพื่อไม่ให้โมเดลถนนดูทึบจนเกินไป
    const ratio = rd.lanes >= 8 ? 0.86 : rd.lanes >= 4 ? 0.82 : 0.78;
    return Math.max(2, footprint * ratio);
  }

  function roadShoulderVisualWidth(rt, zt) {
    return roadVisualFootprintWidth(rt, zt) * 0.98;
  }

  function roadShadowVisualWidth(rt, zt) {
    return roadVisualFootprintWidth(rt, zt);
  }

  function roadBaseColor(rt, cellIdx = null) {
    if (cellIdx != null && mainRoad[cellIdx]) return '#465d74';
    if (rt === 1) return '#68737e';
    if (rt === 2) return '#5e6b76';
    return '#566472';
  }

  function roadShoulderColor(rt, cellIdx = null) {
    if (cellIdx != null && mainRoad[cellIdx]) return '#31475d';
    if (rt === 1) return '#3f4851';
    if (rt === 2) return '#3a444e';
    return '#34404b';
  }

  function roadPoint(x, y, zt) {
    return { sx: x * zt + game.pan.x + zt / 2, sy: y * zt + game.pan.y + zt / 2 };
  }

  function drawLaneMarkings(seg, p1, p2, width, zt) {
    const lanes = roadDataById(seg.rt).lanes;
    if (lanes <= 1) return;
    const dx = p2.sx - p1.sx, dy = p2.sy - p1.sy;
    const len = Math.hypot(dx, dy) || 1;
    const isStraight = Math.abs(dx) < 0.01 || Math.abs(dy) < 0.01;
    // Do not draw lane stripes on curves/intersection cells; those are handled by junction markings.
    if (!isStraight || isJunctionCell(seg.i) || isJunctionCell(seg.j)) return;

    const nx = -dy / len, ny = dx / len;
    const shorten = Math.min(len * 0.16, zt * 0.38);
    const ax = p1.sx + (dx / len) * shorten;
    const ay = p1.sy + (dy / len) * shorten;
    const bx = p2.sx - (dx / len) * shorten;
    const by = p2.sy - (dy / len) * shorten;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Center divider. Double yellow on wider roads, single yellow on 2-lane roads.
    ctx.strokeStyle = 'rgba(255, 220, 86, .90)';
    ctx.lineWidth = clamp(zt * .026, .9, 1.7);
    if (lanes >= 4 && game.zoom > .58) {
      const gap = clamp(width * .018, 1.0, 2.8);
      for (const c of [-gap, gap]) {
        ctx.beginPath();
        ctx.moveTo(ax + nx * c, ay + ny * c);
        ctx.lineTo(bx + nx * c, by + ny * c);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }

    // Lane boundaries: symmetric and lane-aware. 8 lanes = 3 white boundaries per side.
    if (lanes >= 4 && game.zoom > .54) {
      ctx.strokeStyle = 'rgba(246, 249, 252, .44)';
      ctx.lineWidth = clamp(zt * .013, .55, 1.05);
      ctx.setLineDash([Math.max(6, zt * .40), Math.max(4, zt * .26)]);
      const offsets = [];
      for (let k = 1; k < lanes; k++) {
        const o = (k / lanes) - 0.5;
        if (Math.abs(o) < 0.0001) continue;
        offsets.push(o);
      }
      for (const o of offsets) {
        ctx.beginPath();
        ctx.moveTo(ax + nx * width * o, ay + ny * width * o);
        ctx.lineTo(bx + nx * width * o, by + ny * width * o);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function visibleRoadSegments(view) {
    const cacheKey = `${roadVersion}:${view.minX}:${view.minY}:${view.maxX}:${view.maxY}`;
    if (roadSegmentCacheKey === cacheKey && roadSegmentCacheData) return roadSegmentCacheData;
    const segs = [];
    const dots = [];
    const seen = new Set();
    for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
      const i = idx(x,y);
      const rt = road[i];
      if (!rt) continue;
      const links = linkedNeighbors(i);
      if (!links.length) dots.push({ x, y, i, rt });
      for (const ni of links) {
        if (!road[ni]) continue;
        const key = i < ni ? `${i}:${ni}` : `${ni}:${i}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const n = xy(ni);
        // Draw only visible-ish segments, but keep edges crossing viewport borders.
        if (n.x < view.minX - 1 || n.x > view.maxX + 1 || n.y < view.minY - 1 || n.y > view.maxY + 1) continue;
        segs.push({ x1:x, y1:y, x2:n.x, y2:n.y, i, j:ni, rt:Math.max(rt, road[ni]) });
      }
    }
    const data = { segs, dots };
    roadSegmentCacheKey = cacheKey;
    roadSegmentCacheData = data;
    return data;
  }


  function drawRoads(view) {
    const zt = TILE * game.zoom;
    const { segs } = visibleRoadSegments(view);
    const showRoadDetail = !game.heatmap && !game.skipMode;

    // Patch 46 Visual Pass:
    // Roads are still drawn from roadFootprint[] for exact gameplay alignment,
    // but now use a light shadow/bevel pass so the map reads like a city game,
    // not flat debug rectangles.
    ctx.save();
    if (showRoadDetail) {
      ctx.fillStyle = 'rgba(15, 23, 42, .16)';
      for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
        const i = idx(x, y);
        if (!roadFootprint[i]) continue;
        const sx = x * zt + game.pan.x;
        const sy = y * zt + game.pan.y;
        ctx.fillRect(sx + zt * .055, sy + zt * .075, zt + .6, zt + .6);
      }
    }

    for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
      const i = idx(x, y);
      const rt = roadFootprint[i];
      if (!rt) continue;
      const owner = roadOwnerAtGridCell(i);
      const sx = x * zt + game.pan.x;
      const sy = y * zt + game.pan.y;
      const heat = (game.heatmap || game.skipMode) && owner != null;
      ctx.fillStyle = heat ? trafficColor(getRoadRatio(owner)) : roadBaseColor(rt, owner);
      ctx.fillRect(sx, sy, zt + .5, zt + .5);

      if (showRoadDetail && game.zoom > .34) {
        ctx.fillStyle = 'rgba(255,255,255,.045)';
        ctx.fillRect(sx + zt * .08, sy + zt * .08, zt * .84, Math.max(1, zt * .10));
        ctx.fillStyle = 'rgba(0,0,0,.035)';
        ctx.fillRect(sx + zt * .08, sy + zt * .82, zt * .84, Math.max(1, zt * .10));
      }

      // Outer shoulder only. This keeps wide-road intersections clean.
      ctx.strokeStyle = roadShoulderColor(rt, owner);
      ctx.lineWidth = Math.max(1, zt * .050);
      ctx.beginPath();
      if (y <= 0 || !roadFootprint[idx(x, y - 1)]) { ctx.moveTo(sx, sy); ctx.lineTo(sx + zt, sy); }
      if (y >= MAP_H - 1 || !roadFootprint[idx(x, y + 1)]) { ctx.moveTo(sx, sy + zt); ctx.lineTo(sx + zt, sy + zt); }
      if (x <= 0 || !roadFootprint[idx(x - 1, y)]) { ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + zt); }
      if (x >= MAP_W - 1 || !roadFootprint[idx(x + 1, y)]) { ctx.moveTo(sx + zt, sy); ctx.lineTo(sx + zt, sy + zt); }
      ctx.stroke();
    }
    ctx.restore();

    // Lane markings follow centerline graph, but are rendered as lane boundaries.
    if (showRoadDetail && game.zoom > .44) {
      ctx.save();
      for (const s of segs) {
        const p1 = roadCellScreenCenter(s.i, zt);
        const p2 = roadCellScreenCenter(s.j, zt);
        const width = roadVisualWidth(s.rt, zt);
        drawLaneMarkings(s, p1, p2, width, zt);
      }
      ctx.restore();
    }

    // Junction graphics: normal mode gets clean road markings; debug mode gets planning boxes.
    for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
      const i = idx(x,y);
      if (!road[i]) continue;
      const info = junctionInfo(i);
      if (!info.isJunction) continue;
      const rt = road[i];
      const p = roadCellScreenCenter(i, zt);
      const width = roadVisualWidth(rt, zt);
      if (showRoadDetail && game.zoom > .48) {
        if (info.planned) drawIntersectionBoxMarkings(i, zt, info);
        else drawJunctionMarkings(p.sx, p.sy, roadVisualFootprintWidth(rt, zt), i, info);
      }
      if (showRoadDetail && game.zoom > .56 && info.controlled) drawTrafficSignalForBox(i, zt, info);
      if (game.debug) {
        const sig = signalState(i);
        const box = info.planned ? intersectionBoxInfo(i) : null;
        const dbg = box ? intersectionBoxScreenCenter(box, zt) : p;
        const dbgSize = clamp(width * .32, 6, 20);
        ctx.fillStyle = !info.controlled ? 'rgba(255,255,255,.38)' : sig.allRed ? '#ff5252' : (sig.phase ? '#52a8ff' : '#52ff82');
        roundRect(ctx, dbg.sx - dbgSize / 2, dbg.sy - dbgSize / 2, dbgSize, dbgSize, 3); ctx.fill();
      }
    }

    if (game.debug) {
      for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
        const i = idx(x,y);
        if (roadFootprint[i] && !road[i]) {
          ctx.fillStyle = 'rgba(56,189,248,.12)';
          ctx.fillRect(x*zt+game.pan.x, y*zt+game.pan.y, zt, zt);
        }
        if (!road[i]) continue;
        const p = roadCellScreenCenter(i, zt);
        if (cellVehicleCount(i) > 0) {
          ctx.fillStyle = 'rgba(255,255,255,.38)';
          ctx.beginPath(); ctx.arc(p.sx, p.sy, clamp(zt*.16, 2, 6), 0, Math.PI*2); ctx.fill();
        }
        if (waitLoad[i] > 0.1) {
          ctx.fillStyle = 'rgba(255,0,0,.26)';
          ctx.fillRect(x*zt+game.pan.x, y*zt+game.pan.y, zt, zt);
        }
      }
    }
  }

  function dirInfoFromTo(from, to) {
    const fx = from % MAP_W, fy = Math.floor(from / MAP_W);
    const tx = to % MAP_W, ty = Math.floor(to / MAP_W);
    return { dx: sign(tx - fx), dy: sign(ty - fy) };
  }

  function cardinalArmKey(dx, dy) {
    if (dx === 1 && dy === 0) return 'E';
    if (dx === -1 && dy === 0) return 'W';
    if (dx === 0 && dy === 1) return 'S';
    if (dx === 0 && dy === -1) return 'N';
    return null;
  }

  function armAxisFromDir(dx, dy) {
    if (Math.abs(dx) > Math.abs(dy)) return 0; // east/west phase
    if (Math.abs(dy) > Math.abs(dx)) return 1; // north/south phase
    return null; // diagonal roads are not signal-controlled in Patch 28
  }

  function resetJunctionInfoCacheIfNeeded() {
    if (junctionInfoCacheVersion === roadVersion) return;
    junctionInfoCacheVersion = roadVersion;
    junctionInfoCache = new Map();
  }

  function roadLaneCountGraphCell(i) {
    const rt = road[i] || roadFootprint[i] || 1;
    const rd = roadDataById(rt);
    return rd ? rd.lanes : 2;
  }

  function maxLaneCountForJunctionInfo(links, cell) {
    let maxLanes = roadLaneCountGraphCell(cell);
    for (const n of links || []) maxLanes = Math.max(maxLanes, roadLaneCountGraphCell(n));
    return maxLanes;
  }

  function cardinalArmCount(cardinal) {
    return (cardinal.E ? 1 : 0) + (cardinal.W ? 1 : 0) + (cardinal.N ? 1 : 0) + (cardinal.S ? 1 : 0);
  }

  function oppositeCardinalPairOnly(cardinal) {
    return (cardinal.E && cardinal.W && !cardinal.N && !cardinal.S) || (cardinal.N && cardinal.S && !cardinal.E && !cardinal.W);
  }


  function armDirKey(a) {
    return a ? cardinalArmKey(a.dx, a.dy) : null;
  }

  function armRunDepthFrom(cell, arm, maxSteps = 6) {
    const key = armDirKey(arm);
    if (!key || !arm || arm.n == null || !road[arm.n]) return 0;
    let depth = 1;
    let prev = cell;
    let cur = arm.n;
    for (let step = 1; step < maxSteps; step++) {
      let best = null;
      let bestDist = Infinity;
      for (const nb of linkedNeighbors(cur)) {
        if (nb === prev || !road[nb]) continue;
        const d = dirInfoFromTo(cur, nb);
        if (cardinalArmKey(d.dx, d.dy) !== key) continue;
        const cp = xy(cur), np = xy(nb);
        const dist = Math.max(Math.abs(np.x - cp.x), Math.abs(np.y - cp.y));
        if (dist < bestDist) { bestDist = dist; best = nb; }
      }
      if (best == null) break;
      depth++;
      prev = cur;
      cur = best;
    }
    return depth;
  }

  function pruneFalseCornerContinuationArms(cell, best) {
    // Patch 34:
    // A wide-road corner can produce one tiny bridge/link tail behind the visual road end.
    // If we count that tail, a simple L-corner becomes a T-junction and gets a fake box/signal.
    // We keep only arms that behave like real road approaches. A one-node tail on the through
    // pair is removed when the other through direction and the perpendicular turn both continue.
    const out = { E: best.E || null, W: best.W || null, N: best.N || null, S: best.S || null };
    const depth = () => ({
      E: armRunDepthFrom(cell, out.E),
      W: armRunDepthFrom(cell, out.W),
      N: armRunDepthFrom(cell, out.N),
      S: armRunDepthFrom(cell, out.S)
    });
    const has = () => ({ E: !!out.E, W: !!out.W, N: !!out.N, S: !!out.S });
    function removeIfFalseThroughTail(a, b, side1, side2) {
      const h = has();
      if (!(h[a] && h[b] && (h[side1] || h[side2]))) return false;
      const d = depth();
      const sideDepth = Math.max(h[side1] ? d[side1] : 0, h[side2] ? d[side2] : 0);
      // Strict corner override:
      // A real through road must visibly continue past the width of the current road.
      // On an 8-lane end-cap, the false tail can be 2-3 graph nodes long because of
      // bridge/footprint links, so <=1 was not enough. Requiring the through side to
      // continue roughly the full visual width prevents an L-corner from becoming a T.
      const requiredThroughDepth = Math.max(2, Math.min(4, roadGraphWidthCells(cell)));
      if (d[a] < requiredThroughDepth && d[b] >= requiredThroughDepth && sideDepth >= 2) { out[a] = null; return true; }
      if (d[b] < requiredThroughDepth && d[a] >= requiredThroughDepth && sideDepth >= 2) { out[b] = null; return true; }
      return false;
    }
    let changed = true;
    let guard = 0;
    while (changed && guard++ < 4) {
      changed = false;
      changed = removeIfFalseThroughTail('N', 'S', 'E', 'W') || changed;
      changed = removeIfFalseThroughTail('E', 'W', 'N', 'S') || changed;
    }
    return out;
  }

  function junctionMajorAxis(info) {
    // Returns 0 for east/west major, 1 for north/south major.
    // For a T-junction, the through road is the opposite pair if present.
    // If there is no clean opposite pair, use the highest-lane axis as a stable fallback.
    if (!info) return 0;
    const c = info.cardinal || {};
    if (c.E && c.W) return 0;
    if (c.N && c.S) return 1;
    let bestAxis = 0;
    let bestLanes = -1;
    for (const a of info.arms || []) {
      const ax = armAxisFromDir(a.dx, a.dy);
      if (ax == null) continue;
      const lanes = roadLaneCountGraphCell(a.n);
      if (lanes > bestLanes) { bestLanes = lanes; bestAxis = ax; }
    }
    return bestAxis;
  }

  function junctionInfo(i) {
    resetJunctionInfoCacheIfNeeded();
    const cached = junctionInfoCache.get(i);
    if (cached) return cached;

    const rawLinks = road[i] ? linkedNeighbors(i).filter(n => road[n]) : [];
    const rawArms = rawLinks.map(n => ({ n, ...dirInfoFromTo(i, n) }));

    // Patch 32: classify by LOGICAL arms, not raw graph links.
    // Wide-road bridge links can create 3+ raw neighbors around a simple corner.
    // That visual case is only a longer road/curve, not a T-junction or traffic signal.
    // We collapse duplicate links that point to the same cardinal side before deciding.
    let cardinal = { E:false, W:false, N:false, S:false };
    const cardinalBest = { E:null, W:null, N:null, S:null };
    const diagonalArms = [];
    const axes = new Set();
    let diagonal = false;

    function armDistance(a) {
      const p = xy(i), q = xy(a.n);
      return Math.max(Math.abs(q.x - p.x), Math.abs(q.y - p.y));
    }

    for (const a of rawArms) {
      const ck = cardinalArmKey(a.dx, a.dy);
      if (ck) {
        cardinal[ck] = true;
        const old = cardinalBest[ck];
        if (!old || armDistance(a) < armDistance(old)) cardinalBest[ck] = a;
      } else {
        diagonal = true;
        diagonalArms.push(a);
      }
      const ax = armAxisFromDir(a.dx, a.dy);
      if (ax != null) axes.add(ax);
    }

    const prunedCardinalBest = pruneFalseCornerContinuationArms(i, cardinalBest);
    cardinal = {
      E: !!prunedCardinalBest.E,
      W: !!prunedCardinalBest.W,
      N: !!prunedCardinalBest.N,
      S: !!prunedCardinalBest.S
    };

    const logicalCardinalArms = ['E','W','N','S'].map(k => prunedCardinalBest[k]).filter(Boolean);
    const arms = logicalCardinalArms.concat(diagonalArms);
    const links = arms.map(a => a.n);
    const rawDegree = rawLinks.length;
    const degree = arms.length;
    const cardinalCount = cardinalArmCount(cardinal);
    const maxLanes = maxLaneCountForJunctionInfo(links, i);

    const twoArmStraight = degree === 2 && !diagonal && oppositeCardinalPairOnly(cardinal);
    const twoArmCurve = degree === 2 && !diagonal && !twoArmStraight;
    const deadEnd = degree <= 1;
    const orthogonalOnly = !diagonal && cardinalCount === degree;
    const fourWayOrthogonal = orthogonalOnly && cardinal.E && cardinal.W && cardinal.N && cardinal.S;
    const armDepths = {
      E: armRunDepthFrom(i, prunedCardinalBest.E),
      W: armRunDepthFrom(i, prunedCardinalBest.W),
      N: armRunDepthFrom(i, prunedCardinalBest.N),
      S: armRunDepthFrom(i, prunedCardinalBest.S)
    };
    const requiredThroughDepth = Math.max(2, Math.min(4, roadGraphWidthCells(i)));
    const realEWThroughPair = cardinal.E && cardinal.W && armDepths.E >= requiredThroughDepth && armDepths.W >= requiredThroughDepth;
    const realNSThroughPair = cardinal.N && cardinal.S && armDepths.N >= requiredThroughDepth && armDepths.S >= requiredThroughDepth;
    const hasThroughPair = realEWThroughPair || realNSThroughPair;
    const tJunction = orthogonalOnly && cardinalCount === 3 && axes.size === 2 && hasThroughPair;
    const bigTSignal = tJunction && maxLanes >= 4;

    // Only true 3-arm T-junctions and true 4-arm crossings are junctions.
    // A raw graph corner with duplicate bridge links must remain road/curve.
    const controlled = !!(road[i] && (fourWayOrthogonal || bigTSignal));
    const planned = !!(road[i] && (fourWayOrthogonal || tJunction));
    const isJunction = planned;
    const majorAxis = planned ? junctionMajorAxis({ cardinal, arms, axes }) : null;

    let kind = 'road';
    if (deadEnd) kind = 'dead-end';
    else if (twoArmStraight) kind = 'straight';
    else if (twoArmCurve) kind = 'curve';
    else if (fourWayOrthogonal) kind = 'signal4';
    else if (tJunction) kind = bigTSignal ? 'signalT' : 'yieldT';
    else if (rawDegree >= 3 && cardinalCount <= 2 && !diagonal) kind = twoArmStraight ? 'straight' : 'curve';
    else if (rawDegree >= 3) kind = diagonal ? 'merge-diagonal' : 'road';

    const info = {
      cell: i,
      links,
      rawLinks,
      arms,
      rawArms,
      cardinal,
      axes,
      diagonal,
      degree,
      rawDegree,
      cardinalCount,
      maxLanes,
      armDepths,
      requiredThroughDepth,
      realEWThroughPair,
      realNSThroughPair,
      twoArmStraight,
      twoArmCurve,
      deadEnd,
      tJunction,
      fourWayOrthogonal,
      majorAxis,
      isJunction,
      planned,
      controlled,
      kind
    };
    junctionInfoCache.set(i, info);
    return info;
  }

  function isJunctionCell(i) {
    return junctionInfo(i).isJunction;
  }
  function isPlannedJunctionCell(i) {
    return junctionInfo(i).planned;
  }
  function isSignalControlledJunction(i) {
    return junctionInfo(i).controlled;
  }
  function resetIntersectionBoxCacheIfNeeded() {
    if (intersectionBoxCacheVersion === roadVersion) return;
    intersectionBoxCacheVersion = roadVersion;
    intersectionBoxCache = new Map();
  }

  function roadGraphWidthCells(i) {
    if (i == null || i < 0 || i >= MAP_SIZE) return 1;
    const rt = road[i] || roadFootprint[i] || 1;
    return roadFootprintGridWidthFromRoadId(rt);
  }

  function roadAxisCenterForCell(i, axis) {
    const p = xy(i);
    const w = roadGraphWidthCells(i);
    // axis 0 = east/west road: horizontal movement, vertical thickness.
    // axis 1 = north/south road: vertical movement, horizontal thickness.
    if (axis === 0) return { x: p.x + 0.5, y: p.y + w / 2 };
    return { x: p.x + w / 2, y: p.y + 0.5 };
  }

  function averageOrFallback(values, fallback) {
    if (!values.length) return fallback;
    return values.reduce((s, v) => s + v, 0) / values.length;
  }

  function roadWidthForIntersectionAxis(info, axis) {
    // axis 0 = horizontal E/W road thickness; axis 1 = vertical N/S road thickness.
    const widths = [];
    for (const a of info.arms || []) {
      const ax = armAxisFromDir(a.dx, a.dy);
      if (ax === axis) widths.push(roadGraphWidthCells(a.n));
    }
    if (!widths.length) widths.push(roadGraphWidthCells(info.cell));
    return clamp(Math.max(...widths), 2, 8);
  }

  function intersectionAxisCenterFallback(info, axis) {
    const p = xy(info.cell);
    const width = roadWidthForIntersectionAxis(info, axis);
    // axis 0 = horizontal road. Its center line is halfway through the horizontal road thickness on Y.
    // axis 1 = vertical road. Its center line is halfway through the vertical road thickness on X.
    if (axis === 0) return { x: p.x + 0.5, y: p.y + width / 2 };
    return { x: p.x + width / 2, y: p.y + 0.5 };
  }

  function centeredAxisCoordinateForIntersection(info, axis) {
    // Patch 41:
    // Signal/box center must be the real crossing of the two road center-lines.
    // For mixed roads (4 lanes x 8 lanes), do NOT average every raw bridge/end-cap link;
    // prefer the true opposite pair when it exists, then fall back to the real axis width
    // of the junction cell. This keeps the signal dot at the middle of the 4x8 overlap.
    const samples = [];
    const primary = [];
    for (const a of info.arms || []) {

      return 'rgba(19, 91, 51, .46)';
    }

    function drawSignalHead(h) {
      const activeName = signalColorForAxis(h.axis, st);
      const boxW = headSize * 1.12;
      const boxH = headSize * 3.10;
      ctx.save();
      ctx.translate(x + h.px, y + h.py);
      ctx.rotate(h.rot);

      // Pole arm points inward to the intersection so the head no longer floats randomly.
      ctx.strokeStyle = poleColor;
      ctx.lineWidth = Math.max(1.1, headSize * .22);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, boxH * .55);
      ctx.lineTo(0, boxH * 1.05);
      ctx.stroke();

      ctx.fillStyle = 'rgba(7, 11, 16, .96)';
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = Math.max(.7, headSize * .08);
      roundRect(ctx, -boxW / 2, -boxH / 2, boxW, boxH, headSize * .22);
      ctx.fill();
      ctx.stroke();

      const lamps = [
        { name:'red', y:-boxH*.27 },
        { name:'yellow', y:0 },
        { name:'green', y:boxH*.27 }
      ];
      for (const lamp of lamps) {
        const active = lamp.name === activeName;
        if (active) {
          ctx.save();
          ctx.globalAlpha = .32;
          ctx.fillStyle = lampColor(lamp.name, activeName);
          ctx.beginPath();
          ctx.arc(0, lamp.y, headSize * .62, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = 'rgba(0,0,0,.58)';
        ctx.beginPath();
        ctx.arc(0, lamp.y, headSize * .42, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = lampColor(lamp.name, activeName);
        ctx.beginPath();
        ctx.arc(0, lamp.y, headSize * .29, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle = poleColor;
    ctx.lineWidth = Math.max(1.0, headSize * .18);
    ctx.lineCap = 'round';
    for (const h of heads) {
      ctx.beginPath();
      ctx.moveTo(x + h.px * .78, y + h.py * .78);
      ctx.lineTo(x + h.px * .96, y + h.py * .96);
      ctx.stroke();
      drawSignalHead(h);
    }

    // Small phase indicator at center, useful when zoomed out.
    ctx.fillStyle = st.allRed ? 'rgba(255,59,69,.82)' : st.yellow ? 'rgba(255,212,79,.82)' : (st.phase ? 'rgba(82,168,255,.82)' : 'rgba(49,230,107,.82)');
    ctx.beginPath();
    ctx.arc(x, y, clamp(headSize * .36, 1.8, 4.2), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawAccessArrow(access, zt, color = 'rgba(34,197,94,.88)') {
    if (!access || access.entrance == null) return;
    const e = roadCellScreenCenter(access.entrance, zt);
    const d = parseDirKey(access.entryDirKey || '0,0');
    const cx = e.sx;
    const cy = e.sy;
    const len = clamp(zt * .42, 5, 13);
    const ax = cx - d.dx * len * .55;
    const ay = cy - d.dy * len * .55;
    const bx = cx + d.dx * len * .55;
    const by = cy + d.dy * len * .55;
    const angle = Math.atan2(by - ay, bx - ax);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = clamp(zt * .055, 1.4, 3.2);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.translate(bx, by); ctx.rotate(angle);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-len*.34, -len*.20); ctx.lineTo(-len*.34, len*.20); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawParkedCarsInBuilding(b, zt) {
    ensureBuildingVehicleStores(b);
    if (game.zoom < 0.48 || !b.parkedCars.length) return;
    // Visual pass: parked cars are decoration, not traffic. Cap them hard to avoid clutter
    // and keep large homes/malls from turning into colored noise.
    const maxDraw = Math.min(b.parkedCars.length, 12);
    for (let i = 0; i < maxDraw; i++) {
      const car = b.parkedCars[i];
      const p = car.point || parkingPointForBuilding(b, car.parkSeq || i);
      const sx = p.x * zt + game.pan.x + zt / 2;
      const sy = p.y * zt + game.pan.y + zt / 2;
      if (sx < -30 || sy < -30 || sx > window.innerWidth + 30 || sy > window.innerHeight + 30) continue;
      const fake = { ...car, color: car.color || vehicleColor(car.type), type: car.type || 'ReturnHomeTrip' };
      drawCar(fake, sx, sy, zt * 0.72, car.angle || 0, zt * 0.70, 1);
    }
    if (b.parkedCars.length > maxDraw && game.zoom > 0.56) {
      const center = buildingCenterPoint(b);
      const sx = center.x * zt + game.pan.x + zt / 2;
      const sy = center.y * zt + game.pan.y + zt / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(15,23,42,.76)';
      ctx.strokeStyle = 'rgba(255,255,255,.78)';
      ctx.lineWidth = 1;
      roundRect(ctx, sx - 15, sy - 10, 30, 18, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '900 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`+${b.parkedCars.length - maxDraw}`, sx, sy);
      ctx.restore();
    }
  }

  // Version 2 cleanup: old duplicate drawBuildings/drawBuildingMapLabel/drawBuildingIcon removed; the polished definitions below are the active renderer.

  function lightenColor(hex, amt) { return mixColor(hex, '#ffffff', amt); }
  function darkenColor(hex, amt) { return mixColor(hex, '#000000', amt); }
  function mixColor(hex, to, amt) {
    const a = parseColor(hex), b = parseColor(to);
    const r = Math.round(a.r + (b.r-a.r)*amt), g = Math.round(a.g + (b.g-a.g)*amt), bl = Math.round(a.b + (b.b-a.b)*amt);
    return `rgb(${r},${g},${bl})`;
  }
  function parseColor(hex) {
    const h = String(hex).replace('#','');
    return { r:parseInt(h.slice(0,2),16)||0, g:parseInt(h.slice(2,4),16)||0, b:parseInt(h.slice(4,6),16)||0 };
  }

  function drawGates() {
    const zt = TILE * game.zoom;
    for (const g of gates) {
      const sx = g.x * zt + game.pan.x + zt/2;
      const sy = g.y * zt + game.pan.y + zt/2;
      ctx.save();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      const r = Math.max(10, zt*.72);
      const grd = ctx.createRadialGradient(sx-r*.3, sy-r*.35, r*.1, sx, sy, r);
      grd.addColorStop(0, '#fff0aa');
      grd.addColorStop(1, g.entrance != null ? '#ffd166' : '#ff6b6b');
      ctx.fillStyle = grd;
      ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1b1510'; ctx.font = `900 ${Math.max(11, zt*.5)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('G', sx, sy+1);
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, r*.72, 0, Math.PI*2); ctx.stroke();
      if (g.entrance != null && road[g.entrance]) {
        const ep = roadCellScreenCenter(g.entrance, zt);
        ctx.strokeStyle = 'rgba(255,209,102,.95)';
        ctx.lineWidth = Math.max(2, zt * .12);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ep.sx, ep.sy);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.96)';
        ctx.strokeStyle = 'rgba(15,23,42,.55)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, ep.sx - r*.45, ep.sy - r*.28, r*.9, r*.56, r*.18);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#0f172a';
        ctx.font = `900 ${Math.max(8, zt*.28)}px sans-serif`;
        ctx.fillText('IN', ep.sx, ep.sy + 1);
      }
      if (game.zoom > .52) {
        const label = g.name;
        ctx.font = '700 12px sans-serif';
        const tw = ctx.measureText(label).width + 16;
        ctx.fillStyle = 'rgba(9,14,20,.76)';
        roundRect(ctx, sx + r + 6, sy - 18, tw, 26, 9); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(label, sx + r + 14, sy - 1);
      }
      ctx.restore();
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
  function easeInOutCubic(t) {
    t = clamp(t, 0, 1);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function normalizePointVector(dx, dy) {
    const len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }
  function cubicPoint(a, c1, c2, b, t) {
    const u = 1 - t;
    return {
      x: u*u*u*a.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*b.x,
      y: u*u*u*a.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*b.y
    };
  }
  function cubicTangentAngle(a, c1, c2, b, t) {
    const u = 1 - t;
    const dx = 3*u*u*(c1.x-a.x) + 6*u*t*(c2.x-c1.x) + 3*t*t*(b.x-c2.x);
    const dy = 3*u*u*(c1.y-a.y) + 6*u*t*(c2.y-c1.y) + 3*t*t*(b.y-c2.y);
    return Math.atan2(dy, dx);
  }
  function adaptiveTurnControlDistance(v, a, b, prevPoint) {
    const ids = [v && v.pathPos > 0 ? v.path[v.pathPos - 1] : null, v && v.currentIdx, v && v.nextIdx].filter(i => i != null && i >= 0);
    let lanes = 2;
    for (const i of ids) lanes = Math.max(lanes, roadLaneCountAt(i) || 0);
    const wanted = lanes >= 8 ? 1.18 : lanes >= 4 ? 0.78 : 0.46;
    const inLen = Math.hypot(a.x - prevPoint.x, a.y - prevPoint.y) || 1;
    const outLen = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    // Wider roads need a wider curve, but the control point must never exceed
    // the available segment length or the Bezier will overshoot and look like a wobble.
    return clamp(wanted, 0.34, Math.max(0.34, Math.min(inLen, outLen) * 0.82));
  }

  function smoothTurnDrawPoint(v, _a, _b, t) {
    if (!v || v.nextIdx == null) return null;
    const pts = vehicleSegmentVisualPoints(v, v.nextIdx);
    if (!pts.isTurn) return null;
    const a = pts.currentIn;
    const b = pts.next;
    const prev = pts.prev;
    const inV = normalizePointVector(a.x - prev.x, a.y - prev.y);
    const outV = normalizePointVector(b.x - pts.currentOut.x, b.y - pts.currentOut.y);
    const turnControl = adaptiveTurnControlDistance(v, a, b, prev);
    const c1 = { x: a.x + inV.x * turnControl, y: a.y + inV.y * turnControl };
    const c2 = { x: b.x - outV.x * turnControl, y: b.y - outV.y * turnControl };
    const eased = easeInOutCubic(t);
    const p = cubicPoint(a, c1, c2, b, eased);
    p.phaseT = t;
    p.angle = cubicTangentAngle(a, c1, c2, b, eased);
    return p;
  }

  function gateQueueIndexForVehicle(v) {
    if (!v) return 0;
    if (Number.isFinite(v.renderQueueSlot)) return v.renderQueueSlot;
    if (Number.isFinite(v.queueSlot)) return v.queueSlot;
    return 0;
  }

  function gateQueuePointForVehicle(v) {
    const base = roadCellVisualCenterWorld(v.currentIdx);
    const q = gateQueueIndexForVehicle(v);
    const dir = parseDirKey(v.gateQueueDirKey || (v.routeDirKeys && v.routeDirKeys[0]) || '0,0');
    // Car 1 Grid: คิวหน้า Gate ต้องเรียงท้ายกันทีละ 1 กริด ไม่กระจุกซ้อนในจุดเดียว
    const back = 0.62 + q * 1.02;
    const side = 0;
    return {
      x: base.x - dir.dx * back + (-dir.dy) * side,
      y: base.y - dir.dy * back + (dir.dx) * side,
      phaseT: 0
    };
  }

  function vehicleDrawPosition(v) {
    if (v.phase === 'gate_waiting') return gateQueuePointForVehicle(v);
    if (v.phase === 'departing') {
      const b = v.exitBuildingId ? buildingById(v.exitBuildingId) : null;
      const qIndex = departureQueueIndex(v);
      if (!v.departureRoadEntered) {
        const queuePoint = b ? queuePointForBuilding(b, qIndex, v.currentIdx) : (v.departureDrivePoint || xy(v.currentIdx));
        return { x: queuePoint.x, y: queuePoint.y, phaseT: 0 };
      }
      const from = v.departureDrivePoint || xy(v.currentIdx);
      const to = v.departureRoadPoint || xy(v.currentIdx);
      const p = easeInOutCubic((v.departureTimer || 0) / Math.max(0.01, v.departureDuration || 0.48));
      return { x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p, phaseT: p };
    }
    if (v.phase === 'arriving') {
      const from = v.arrivalFromPoint || xy(v.currentIdx);
      const to = v.arrivalToPoint || from;
      const p = easeInOutCubic((v.arrivalTimer || 0) / Math.max(0.01, v.arrivalDuration || 0.35));
      return { x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p, phaseT: p };
    }
    if (v.nextIdx != null) {
      const pts = vehicleSegmentVisualPoints(v, v.nextIdx);
      const a = pts.currentOut;
      const b = pts.next;
      const p = clamp(v.t, 0, 1);
      // Patch 13: ไม่ใช้ Bezier/รถโค้งแล้ว วาดเป็นเส้นตรงจากจุดปัจจุบันไปจุดถัดไป
      return {
        x: a.x + (b.x - a.x) * p,
        y: a.y + (b.y - a.y) * p,
        phaseT: p,
        angle: Math.atan2(b.y - a.y, b.x - a.x)
      };
    }
    const idlePoint = roadCellVisualCenterWorldForDir(v.currentIdx, vehicleDirKeyForDraw(v));
    return { x: idlePoint.x, y: idlePoint.y, phaseT: 0 };
  }

  function prepareVehicleRenderPlan() {
    const visibleIds = new Set();
    const badges = [];
    const gateCounts = new Map();
    const buildingCounts = new Map();
    let fullRenderCount = 0;

    for (const v of vehicles) {
      if (!v) continue;
      v.renderQueueSlot = 0;
      const forceVisible = v.id === game.routeVehicleId || v.id === game.followVehicleId || v.id === game.selectedVehicleId || game.debug;
      if (v.phase === 'gate_waiting') {
        const key = startQueueKeyForVehicle(v);
        const slot = gateCounts.get(key) || 0;
        gateCounts.set(key, slot + 1);
        v.renderQueueSlot = slot;
        if (forceVisible || slot < QUEUE_RENDER_LIMIT_GATE) visibleIds.add(v.id);
      } else if (v.phase === 'departing' && !v.departureRoadEntered) {
        // Do not draw long building-exit queues. Cars stay inside the building until they can enter
        // the curb/near lane, then the visible road queue forms naturally on the road itself.
        if (forceVisible || game.debug || !HIDE_BUILDING_EXIT_QUEUE_RENDER) {
          const key = v.exitBuildingId || -1;
          const slot = buildingCounts.get(key) || 0;
          buildingCounts.set(key, slot + 1);
          v.renderQueueSlot = slot;
          if (forceVisible || slot < QUEUE_RENDER_LIMIT_BUILDING) visibleIds.add(v.id);
        }
      } else if (forceVisible || fullRenderCount < MAX_FULL_VEHICLE_RENDER) {
        visibleIds.add(v.id);
        fullRenderCount++;
      }
    }

    for (const [key, count] of gateCounts.entries()) {
      const extra = count - QUEUE_RENDER_LIMIT_GATE;
      if (extra >= QUEUE_BADGE_MIN_EXTRA) {
        const cell = Number(String(key).split('|')[0]);
        if (Number.isFinite(cell)) badges.push({ type:'gate', cell, count, extra });
      }
    }
    for (const [id, count] of buildingCounts.entries()) {
      const extra = count - QUEUE_RENDER_LIMIT_BUILDING;
      if (extra >= QUEUE_BADGE_MIN_EXTRA) {
        const b = buildingById(Number(id));
        if (b) badges.push({ type:'building', buildingId:b.id, count, extra });
      }
    }
    game.renderQueueBadges = badges;
    game.renderSkippedVehicles = Math.max(0, vehicles.length - visibleIds.size);
    return visibleIds;
  }

  function drawQueueBadges(badges, zt) {
    if (!badges || !badges.length || game.zoom < 0.28) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.max(11, Math.min(18, zt * .42))}px sans-serif`;
    for (const badge of badges) {
      let x = 0, y = 0;
      if (badge.type === 'building') {
        const b = buildingById(badge.buildingId);
        if (!b) continue;
        x = (b.x + b.w / 2) * zt + game.pan.x;
        y = (b.y + b.h + 0.25) * zt + game.pan.y;
      } else {
        const p = roadCellVisualCenterWorld(badge.cell);
        x = p.x * zt + game.pan.x + zt / 2;
        y = p.y * zt + game.pan.y - zt * .55;
      }
      if (x < -60 || y < -60 || x > window.innerWidth + 60 || y > window.innerHeight + 60) continue;
      const label = `+${formatCompact(badge.extra)} คิว`;
      const padX = 8;
      const width = ctx.measureText(label).width + padX * 2;
      const height = Math.max(18, zt * .48);
      ctx.fillStyle = 'rgba(15,23,42,.82)';
      ctx.strokeStyle = 'rgba(255,255,255,.76)';
      ctx.lineWidth = 1.2;
      roundRect(ctx, x - width / 2, y - height / 2, width, height, Math.min(10, height / 2));
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, x, y + .5);
    }
    ctx.restore();
  }

  function drawVehicles() {
    const zt = TILE * game.zoom;
    const visibleVehicleIds = prepareVehicleRenderPlan();
    // Patch 26 Thailand Lane / Building Access:
    // simpleDraw เดิมข้าม lane offset ทำให้รถหลายเลนถูกวาดทับกลางถนนเมื่อรถเยอะ
    // ตอนนี้คำนวณ lane/queue offset ก่อนเสมอ แล้วค่อยเลือกว่าจะวาดแบบละเอียดหรือแบบเบา
    const simpleDraw = vehicles.length > 900 && !game.debug && !game.routeVehicleId;
    for (const v of vehicles) {
      if (!visibleVehicleIds.has(v.id)) continue;
      const pos = vehicleDrawPosition(v);
      let sx = pos.x * zt + game.pan.x + zt/2;
      let sy = pos.y * zt + game.pan.y + zt/2;
      if (sx < -80 || sy < -80 || sx > window.innerWidth + 80 || sy > window.innerHeight + 80) continue;
      const alpha = v.phase === 'fadingOut' ? Math.max(0.12, 1 - (v.fadeTimer || 0) / Math.max(0.01, v.fadeDuration || 0.45)) : 1;
      const angle = Number.isFinite(pos.angle) ? pos.angle : vehicleAngle(v);
      const laneCell = v.currentIdx;
      const rt = road[laneCell] || road[v.nextIdx] || 1;
      const rw = roadVisualWidth(rt, zt);

      if (v.phase !== 'arriving' && v.phase !== 'departing' && v.phase !== 'fadingOut') {
        const laneOffset = vehicleLaneOffset(v, laneCell, rw);
        // Thailand drives on the LEFT side of the road.
        // Canvas Y grows downward, so the visual left-normal of direction angle is:
        //   left = (sin(angle), -cos(angle))
        // The previous build used (-sin, +cos), which is the RIGHT side on screen.
        // That made cars look like they entered/exited buildings from the opposite side.
        sx += Math.sin(angle) * laneOffset;
        sy += -Math.cos(angle) * laneOffset;

        // Car 1 Grid จริง: ไม่ยัดหลายคันตามยาวในเลนเดียว
        // ถ้ามีหลายคันใน cell เดียวกัน จะต้องเป็นคนละเลน จึงเยื้องด้านข้างเท่านั้น
        const longSlots = Math.max(1, longitudinalSlotsPerDirectionAt(laneCell));
        const gridSlot = Math.min(longSlots - 1, vehicleGridSlot(v, laneCell));
        const alongOffset = longSlots > 1 ? (-gridSlot * zt * 1.02 + zt * 0.12) : 0;
        sx += Math.cos(angle) * alongOffset;
        sy += Math.sin(angle) * alongOffset;
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      if (simpleDraw) drawCarSimple(v, sx, sy, zt, angle);
      else drawCar(v, sx, sy, zt, angle, rw, rt);
      ctx.restore();
      if (game.debug && v.path.length && v.phase === 'driving') drawVehiclePath(v, zt);
    }
    drawQueueBadges(game.renderQueueBadges, zt);
  }

  function drawCar(v, sx, sy, zt, angle = vehicleAngle(v), roadW = zt, roadTypeId = 1) {
    const isTruck = v.type === 'PassThroughTrip';
    const isMove = v.type === 'MoveInTrip' || v.type === 'MoveOutTrip';
    const lanes = Math.max(2, roadDataById(roadTypeId)?.lanes || 2);
    const laneWidth = Math.max(2.8, roadW / lanes);
    const len = Math.max(7.5, zt * (isTruck ? 1.18 : .96));
    const wid = Math.max(3.4, laneWidth * (isTruck ? .82 : .70));
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    // Small painted shadow instead of canvas blur: much cheaper at 500+ vehicles.
    ctx.fillStyle = 'rgba(0,0,0,.24)';
    roundRect(ctx, -len/2 + Math.max(.8, zt*.04), -wid/2 + Math.max(.7, zt*.035), len, wid, Math.max(2, wid*.36));
    ctx.fill();

    // Body.
    const base = v.color || '#38bdf8';
    const bodyGrad = ctx.createLinearGradient(-len/2, -wid/2, len/2, wid/2);
    bodyGrad.addColorStop(0, lightenColor(base, .22));
    bodyGrad.addColorStop(.55, base);
    bodyGrad.addColorStop(1, darkenColor(base, .18));
    ctx.fillStyle = bodyGrad;
    ctx.strokeStyle = 'rgba(0,0,0,.58)';
    ctx.lineWidth = Math.max(.8, zt * .025);
    roundRect(ctx, -len/2, -wid/2, len, wid, Math.max(2, wid*.38));
    ctx.fill(); ctx.stroke();

    // Roof/cabin and cargo split.
    ctx.fillStyle = isTruck ? 'rgba(230,245,255,.86)' : 'rgba(18,35,48,.62)';
    roundRect(ctx, -len*.04, -wid*.36, len*.30, wid*.72, Math.max(1.5, wid*.22)); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.24)';
    if (isTruck) {
      roundRect(ctx, -len*.46, -wid*.34, len*.34, wid*.68, 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.fillRect(-len*.10, -wid*.43, Math.max(1, zt*.025), wid*.86);
    } else {
      roundRect(ctx, -len*.40, -wid*.30, len*.24, wid*.60, 2); ctx.fill();
      if (isMove) {
        ctx.fillStyle = 'rgba(255,255,255,.32)';
        ctx.fillRect(-len*.50, -wid*.10, len*.18, wid*.20);
      }
    }

    // Headlights and taillights.
    ctx.fillStyle = '#fff6b2';
    ctx.fillRect(len/2 - 1.8, -wid*.30, 2.4, Math.max(1.2, wid*.20));
    ctx.fillRect(len/2 - 1.8, wid*.10, 2.4, Math.max(1.2, wid*.20));
    ctx.fillStyle = '#ff3e3e';
    ctx.fillRect(-len/2 - .2, -wid*.27, 2.1, Math.max(1.1, wid*.20));
    ctx.fillRect(-len/2 - .2, wid*.08, 2.1, Math.max(1.1, wid*.20));

    // Wheels when zoomed in enough.
    if (zt > 10) {
      ctx.fillStyle = 'rgba(5,5,5,.80)';
      ctx.fillRect(-len*.34, -wid*.59, len*.18, wid*.19);
      ctx.fillRect(len*.16, -wid*.59, len*.18, wid*.19);
      ctx.fillRect(-len*.34, wid*.40, len*.18, wid*.19);
      ctx.fillRect(len*.16, wid*.40, len*.18, wid*.19);
    }
    ctx.restore();
  }

  function vehicleAngle(v) {
    if (v.phase === 'departing') {
      if (v.departureRoadEntered && v.departureDrivePoint && v.departureRoadPoint) {
        return Math.atan2(v.departureRoadPoint.y - v.departureDrivePoint.y, v.departureRoadPoint.x - v.departureDrivePoint.x);
      }
      const b = v.exitBuildingId ? buildingById(v.exitBuildingId) : null;
      if (b) return drivewayAngleForBuilding(b, v.currentIdx, true);
    }
    if (v.phase === 'arriving' && v.arrivalFromPoint && v.arrivalToPoint) {
      return Math.atan2(v.arrivalToPoint.y - v.arrivalFromPoint.y, v.arrivalToPoint.x - v.arrivalFromPoint.x);
    }
    let from = v.currentIdx;
    let to = v.nextIdx;
    if (to == null && v.pathPos + 1 < v.path.length) to = v.path[v.pathPos + 1];
    if (to == null && v.pathPos > 0) { from = v.path[v.pathPos - 1]; to = v.currentIdx; }
    if (to == null) return 0;
    const a = xy(from), b = xy(to);
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  function drawCar(v, sx, sy, zt, angle = vehicleAngle(v), roadW = zt, roadTypeId = 1) {
    const isTruck = v.type === 'PassThroughTrip';
    const lanes = Math.max(2, roadDataById(roadTypeId)?.lanes || 2);
    const laneWidth = Math.max(2.8, roadW / lanes);
    // Patch 1 Fix: โมเดลรถโต/ย่อตาม zoom จริง ไม่มี max clamp คงที่
    // รถทั่วไปยาวเกือบ 1 กริด, รถผ่านเมือง/บรรทุกยาวประมาณ 1 กริดกว่า
    const len = Math.max(7.5, zt * 0.96);
    const wid = Math.max(3.4, laneWidth * (isTruck ? .82 : .74));
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = v.color;
    ctx.strokeStyle = 'rgba(0,0,0,.68)';
    ctx.lineWidth = 1;
    roundRect(ctx, -len/2, -wid/2, len, wid, Math.max(2, wid*.36));
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    // Windows / cabin.
    ctx.fillStyle = isTruck ? 'rgba(230,245,255,.82)' : 'rgba(18,35,48,.58)';
    roundRect(ctx, -len*.12, -wid*.36, len*.28, wid*.72, Math.max(1.5, wid*.22)); ctx.fill();
    if (isTruck) {
      ctx.fillStyle = 'rgba(255,255,255,.26)';
      roundRect(ctx, -len*.46, -wid*.36, len*.26, wid*.72, 2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      roundRect(ctx, -len*.42, -wid*.30, len*.24, wid*.60, 2); ctx.fill();
    }

    // Headlights and taillights.
    ctx.fillStyle = '#fff6b2';
    ctx.fillRect(len/2 - 1.6, -wid*.28, 2, Math.max(1.2, wid*.18));
    ctx.fillRect(len/2 - 1.6, wid*.12, 2, Math.max(1.2, wid*.18));
    ctx.fillStyle = '#ff3e3e';
    ctx.fillRect(-len/2 - .2, -wid*.25, 1.8, Math.max(1.1, wid*.18));
    ctx.fillRect(-len/2 - .2, wid*.10, 1.8, Math.max(1.1, wid*.18));

    // Wheels when zoomed in enough.
    if (zt > 10) {
      ctx.fillStyle = 'rgba(5,5,5,.78)';
      ctx.fillRect(-len*.32, -wid*.58, len*.18, wid*.2);
      ctx.fillRect(len*.15, -wid*.58, len*.18, wid*.2);
      ctx.fillRect(-len*.32, wid*.38, len*.18, wid*.2);
      ctx.fillRect(len*.15, wid*.38, len*.18, wid*.2);
    }
    ctx.restore();
  }

  function drawVehiclePath(v, zt) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath();
    for (let i = v.pathPos; i < Math.min(v.path.length, v.pathPos + 22); i++) {
      const p = roadCellScreenCenter(v.path[i], zt); const sx = p.sx, sy = p.sy;
      if (i === v.pathPos) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.restore();
  }


  function drawTrackedVehiclePath() {
    if (!game.routeVehicleId) return;
    const v = vehicleById(game.routeVehicleId);
    if (!v || !Array.isArray(v.path) || !v.path.length) {
      game.routeVehicleId = null;
      return;
    }
    const zt = TILE * game.zoom;
    const start = Math.max(0, v.pathPos || 0);
    const end = Math.min(v.path.length, start + 120);
    if (end - start < 2) return;
    ctx.save();
    ctx.lineWidth = Math.max(2, Math.min(5, zt * 0.18));
    ctx.strokeStyle = 'rgba(14,165,233,.88)';
    ctx.setLineDash([zt * .45, zt * .25]);
    ctx.beginPath();
    for (let i = start; i < end; i++) {
      const p = xy(v.path[i]);
      const sx = p.x * zt + game.pan.x + zt / 2;
      const sy = p.y * zt + game.pan.y + zt / 2;
      if (i === start) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    const first = xy(v.path[start]);
    const last = xy(v.path[end - 1]);
    ctx.fillStyle = 'rgba(14,165,233,.92)';
    ctx.beginPath(); ctx.arc(first.x * zt + game.pan.x + zt/2, first.y * zt + game.pan.y + zt/2, Math.max(4, zt*.18), 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(34,197,94,.92)';
    ctx.beginPath(); ctx.arc(last.x * zt + game.pan.x + zt/2, last.y * zt + game.pan.y + zt/2, Math.max(4, zt*.18), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawPreview() {
    if (!game.hover) return;
    const zt = TILE * game.zoom;
    const tool = game.selectedTool;
    if (!tool) return;
    if (tool.type === 'road' || tool.type === 'demolishRoad') {
      const start = game.roadStart || snapRoadBuildPoint(game.hover) || game.hover;
      const end = snapRoadBuildPoint(game.hover) || game.hover;
      const cells = getSnappedLineCells(start, end);
      const valid = tool.type === 'demolishRoad' ? true : canAddRoadCells(cells, tool.key).ok && canSpend(estimateRoadCost(cells, tool.key));
      ctx.fillStyle = valid ? 'rgba(251, 191, 36, .34)' : 'rgba(239, 68, 68, .34)';
      const drawCells = tool.type === 'road' ? previewRoadFootprintCells(cells, tool.key) : cells;
      for (const i of drawCells) {
        const p = xy(i);
        ctx.fillRect(p.x*zt+game.pan.x+1, p.y*zt+game.pan.y+1, zt-2, zt-2);
      }
      // Show the snapped centerline endpoint when the cursor is on a wide road footprint.
      if (end && game.hover && (end.x !== game.hover.x || end.y !== game.hover.y)) {
        ctx.strokeStyle = 'rgba(14,165,233,.95)';
        ctx.lineWidth = Math.max(2, zt * 0.10);
        ctx.strokeRect(end.x*zt+game.pan.x+zt*0.18, end.y*zt+game.pan.y+zt*0.18, zt*0.64, zt*0.64);
      }
    } else if (tool.type === 'building') {
      const t = DATA.buildings[tool.key];
      const x = game.hover.x, y = game.hover.y;
      const check = canPlaceBuilding(tool.key, x, y, true);
      ctx.fillStyle = check.ok ? 'rgba(255, 209, 102, .42)' : 'rgba(255, 80, 80, .42)';
      ctx.fillRect(x*zt+game.pan.x, y*zt+game.pan.y, t.w*zt, t.h*zt);
      ctx.strokeStyle = check.ok ? '#ffd166' : '#ff5656'; ctx.lineWidth = 2; ctx.strokeRect(x*zt+game.pan.x, y*zt+game.pan.y, t.w*zt, t.h*zt);
    } else if (tool.type === 'demolishBuilding') {
      const b = buildingAtGrid(game.hover.x, game.hover.y);
      if (b) {
        ctx.fillStyle = 'rgba(239, 68, 68, .34)';
        ctx.fillRect(b.x*zt+game.pan.x, b.y*zt+game.pan.y, b.w*zt, b.h*zt);
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
        ctx.strokeRect(b.x*zt+game.pan.x, b.y*zt+game.pan.y, b.w*zt, b.h*zt);
      }
    }
  }

  function drawHoverInfo() {
    if (!game.hover) return;

    if (!tool) return;

    if (!text) return;

    const x = game.lastMouse.x + 14, y = game.lastMouse.y + 18;
    ctx.fillStyle = 'rgba(255,255,255,.96)'; roundRect(ctx, x, y, tw, 34, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(15,23,42,.18)'; ctx.lineWidth = 1; ctx.stroke();

  function previewText(tool, x, y) {
    if (tool.type === 'road') {
      const rawEnd = {x,y};
      const start = game.roadStart || snapRoadBuildPoint(rawEnd) || rawEnd;
      const end = snapRoadBuildPoint(rawEnd) || rawEnd;
      const cells = getSnappedLineCells(start, end);
      const cost = estimateRoadCost(cells, tool.key);
      const valid = canAddRoadCells(cells, tool.key);
      const area = previewRoadFootprintCells(cells, tool.key).length;
      const snapNote = snappedPointLabel(rawEnd, end);
      return valid.ok ? `${DATA.roads[tool.key].name} แกน ${cells.length} ช่อง / พื้นที่ ${area} กริด | ${formatMoney(cost)} บาท${snapNote}` : valid.reason;
    }
    if (tool.type === 'building') {
      const t = DATA.buildings[tool.key];
      const check = canPlaceBuilding(tool.key, x, y, true);
      return check.ok ? `${t.name} ${t.w}x${t.h} | ${formatMoney(t.cost)} บาท` : check.reason;
    }
    if (tool.type === 'demolishRoad') return 'รื้อถนน: ลากเส้นบนถนนที่ต้องการรื้อ';
    if (tool.type === 'demolishBuilding') {
      const b = buildingAtGrid(x, y);
      return b ? `รื้อ ${buildingType(b).name} #${b.id}` : 'รื้ออาคาร: แตะ/คลิกบนอาคาร';
    }
    return '';
  }

  function estimateRoadCost(cells, roadKey) {
    cells = normalizeRoadCellsForIntersections(cells);
    const rd = DATA.roads[roadKey];
    let cost = 0;
    for (const i of cells) {
      const old = roadDataById(road[i]);
      if (!old) cost += rd.cost;
      else if (old.id < rd.id) cost += Math.max(0, rd.cost - old.cost);
    }
    return cost;
  }


  function askBuildConfirm(title, lines) {
    const msg = [`ยืนยัน${title}`, '', ...lines.filter(Boolean), '', 'กด OK เพื่อยืนยัน', 'กด Cancel เพื่อยกเลิก'].join('\n');
    return window.confirm(msg);
  }
  function confirmRoadBuild(cells, roadKey, cost) {
    const rd = DATA.roads[roadKey];
    const area = previewRoadFootprintCells(cells, roadKey).length;
    return askBuildConfirm('สร้าง/อัปเกรดถนน', [

      `ราคา: ${formatMoney(cost)} บาท`
    ]);
  }
  function confirmRoadDemolish(cells) {
    let roadCount = 0;
    let fee = 0;
    for (const i of cells) {
      const rd = roadDataById(road[i]);
      if (rd && !mainRoad[i]) { roadCount++; fee += rd.cost * 0.2; }
    }
    if (!roadCount) {

      'หมายเหตุ: ช่องที่มีรถอยู่หรือเป็นถนนหลักเชื่อม Gate จะรื้อไม่ได้'
    ]);
  }

  function buildingAtGrid(x, y) {
    if (!inBounds(x, y)) return null;

    return id ? buildingById(id) : null;
  }

  function confirmBuildingDemolish(b) {
    if (!b) return false;
    const t = buildingType(b);
    const peopleInside = citizens.filter(c => c.resident && !c.removed && (c.homeId === b.id || c.location === `building:${b.id}`)).length;
    const lines = [
      `อาคาร: ${t.name} #${b.id}`,

      t.kind === 'home'
        ? `บ้านพัก: คนอาศัย ${peopleInside} คนจะถูกนำออกจากเมือง`
        : `อาคารบริการ/งาน: คนในอาคารจะวาร์ปกลับบ้าน`,
      `รถจอดในอาคาร: ${(b.parkedCars || []).length} คัน`,

  function sendCitizenHomeInstant(c, reason = 'อาคารถูกรื้อ') {
    if (!c || c.removed || !c.resident) return;
    const home = buildingById(c.homeId);
    if (home) {
      c.location = `building:${home.id}`;
      c.state = `อยู่บ้าน (${reason})`;
      c.currentVehicleId = null;
      addParkedCarToBuilding(home, {
        id: nextVehicleId++,
        citizenId: c.id,
        type: 'ReturnHomeTrip',
        color: vehicleColor('ReturnHomeTrip')
      });
    } else {
      c.location = 'unknown';
      c.state = reason;
      c.currentVehicleId = null;
    }
  }

  function removeCitizenCompletely(c, reason = 'บ้านถูกรื้อ') {
    if (!c || c.removed) return;
    // Remove active vehicle first, if any.
    if (c.currentVehicleId) {
      const v = vehicleById(c.currentVehicleId);
      if (v) removeVehicleFromSimulation(v, reason, true, false);
    }
    const work = buildingById(c.workId);
    if (work) {
      work.employees = Math.max(0, (work.employees || 0) - 1);
      work.workerIds = (work.workerIds || []).filter(id => id !== c.id);
    }
    c.removed = true;
    c.resident = false;
    c.currentVehicleId = null;
    c.location = 'removed';
    c.state = reason;
  }

  function demolishBuilding(b, charge = true) {
    if (!b) return { ok:false, reason:'ไม่พบอาคาร' };
    const t = buildingType(b);
    if (!t) return { ok:false, reason:'ข้อมูลอาคารผิดพลาด' };

    // Clear active vehicles linked to this building. People in non-home buildings warp home.
    for (const v of [...vehicles]) {
      const c = v.citizenId ? citizenById(v.citizenId) : null;
      const linked = v.fromBuildingId === b.id || v.destBuildingId === b.id || v.exitBuildingId === b.id;
      if (!linked) continue;
      removeVehicleFromSimulation(v, 'อาคารถูกรื้อ', true, false);
      if (c && !c.removed && t.kind !== 'home') sendCitizenHomeInstant(c, 'อาคารถูกรื้อ');
      if (c && !c.removed && t.kind === 'home' && c.homeId === b.id) removeCitizenCompletely(c, 'บ้านถูกรื้อ');
    }

    if (t.kind === 'home') {
      // All residents of this home leave the city immediately.
      for (const c of citizens.filter(c => c.resident && !c.removed && c.homeId === b.id)) {
        removeCitizenCompletely(c, 'บ้านถูกรื้อ');
      }
    } else {
      // Workers lose this job; visitors or people inside warp back home.
      for (const c of citizens.filter(isCountedPopulation)) {
        if (c.workId === b.id) c.workId = null;
        if (c.location === `building:${b.id}`) sendCitizenHomeInstant(c, 'อาคารถูกรื้อ');
      }
    }

    // Move visible parked cars from non-home buildings back to owners' homes when possible.
    if (t.kind !== 'home') {
      for (const car of [...(b.parkedCars || [])]) {
        const c = car.citizenId ? citizenById(car.citizenId) : null;
        const home = c && !c.removed ? buildingById(c.homeId) : null;
        if (home) addParkedCarToBuilding(home, { ...car, type:'ReturnHomeTrip', color: car.color || vehicleColor('ReturnHomeTrip') });
      }
    }

    // Remove grid footprint.
    for (let yy = b.y; yy < b.y + b.h; yy++) for (let xx = b.x; xx < b.x + b.w; xx++) {
      if (inBounds(xx, yy) && buildGrid[idx(xx, yy)] === b.id) buildGrid[idx(xx, yy)] = 0;
    }

    buildings = buildings.filter(x => x.id !== b.id);
    pathCache.clear();
    roadVersion++;
    refreshAllBuildingAccesses();
    assignJobs();

    if (charge) {
      const fee = Math.round(t.cost * 0.1);
      game.money -= fee;
      return { ok:true, reason:`รื้อ ${t.name} #${b.id} แล้ว ค่ารื้อ ${formatMoney(fee)} บาท` };
    }
    return { ok:true, reason:`รื้อ ${t.name} #${b.id} แล้ว` };
  }

    ] });
