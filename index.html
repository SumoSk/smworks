      g.addColorStop(.58, '#7fb96f');
      g.addColorStop(1, '#6eaa61');
    } else if (city.terrain === 'mountain') {
      g.addColorStop(0, '#78a966');
      g.addColorStop(.25, '#a5a96e');
      g.addColorStop(.38, '#739b61');
      g.addColorStop(1, '#74b067');
    } else {
      g.addColorStop(0, '#a5ca7b');
      g.addColorStop(.52, '#94bd6b');
      g.addColorStop(1, '#82ac60');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const zt = TILE * game.zoom;
    const view = visibleGridBounds(w, h);

    // Low-cost terrain patches tied to world coordinates so they do not swim while panning.
    if (game.zoom > .32) {
      ctx.save();
      ctx.globalAlpha = .09;
      for (let y = Math.floor(view.minY / 8) * 8; y <= view.maxY; y += 8) {
        for (let x = Math.floor(view.minX / 8) * 8; x <= view.maxX; x += 8) {
          const seed = (x * 928371 + y * 68917 + game.cityKey.length * 997) | 0;
          const r = Math.abs(Math.sin(seed) * 10000) % 1;
          if (r > .42) continue;
          const sx = (x + 3.8 + (r - .5) * 2.2) * zt + game.pan.x;
          const sy = (y + 3.5 + (.5 - r) * 2.1) * zt + game.pan.y;
          const rx = zt * (1.6 + r * 2.1);
          const ry = zt * (.55 + r * 1.1);
          ctx.fillStyle = r > .22 ? '#ffffff' : '#315d37';
          ctx.beginPath();
          ctx.ellipse(sx, sy, rx, ry, r * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    if (city.terrain === 'river') {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(31, 134, 161, .80)';
      ctx.lineWidth = Math.max(74, h * .095);
      ctx.beginPath();
      ctx.moveTo(w * .44, -50);
      ctx.bezierCurveTo(w * .56, h * .20, w * .35, h * .34, w * .49, h * .56);
      ctx.bezierCurveTo(w * .63, h * .74, w * .44, h * .91, w * .57, h + 60);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(231, 250, 255, .48)';
      ctx.lineWidth = Math.max(12, h * .014);
      ctx.stroke();
      ctx.restore();
    }

    if (city.terrain === 'mountain') {
      ctx.save();
      ctx.globalAlpha = .22;
      ctx.fillStyle = '#3d5c38';
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(-80, h * (.04 + i * .17));
        ctx.lineTo(w * (.15 + i * .025), h * (-.03 + i * .17));
        ctx.lineTo(w * (.35 + i * .025), h * (.14 + i * .17));
        ctx.lineTo(-80, h * (.24 + i * .17));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    const vignette = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*.22, w/2, h/2, Math.max(w,h)*.74);
    vignette.addColorStop(0, 'rgba(255,255,255,0)');
    vignette.addColorStop(1, 'rgba(15,23,42,.18)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, w, h);
  }

  function buildingVisualPalette(t) {
    const map = {
      home:       { base:'#d9a25a', roof:'#b86b35', side:'#8f4f2b', trim:'#ffe0a3', glass:'#f6d892' },
      office:     { base:'#5e9ee8', roof:'#2f6fb5', side:'#234e7b', trim:'#cfe8ff', glass:'#b9e6ff' },
      factory:    { base:'#a7afb8', roof:'#6e7882', side:'#4b5561', trim:'#e5e7eb', glass:'#cbd5e1' },
      shop:       { base:'#56c6b2', roof:'#2d9b8b', side:'#1e6f67', trim:'#ddfff7', glass:'#bdf7ec' },
      restaurant: { base:'#ff9869', roof:'#d76142', side:'#9c3c29', trim:'#ffe0cc', glass:'#ffd3bd' },
      mall:       { base:'#a78bfa', roof:'#7c5adf', side:'#4d3b97', trim:'#efe8ff', glass:'#ddd1ff' },
      park:       { base:'#5cc96a', roof:'#3ca94f', side:'#2c7a39', trim:'#e5ffe8', glass:'#b7f3bf' },
      pub:        { base:'#ed64d6', roof:'#b63aa4', side:'#7f2a73', trim:'#ffe0fb', glass:'#ffd0f4' }
    };
    return map[t.kind] || { base:t.color || '#94a3b8', roof:darkenColor(t.color || '#94a3b8', .18), side:'#475569', trim:'#f8fafc', glass:'#dbeafe' };
  }

  function drawTinyTree(cx, cy, s) {
    ctx.save();
    ctx.fillStyle = 'rgba(52, 85, 45, .28)';
    ctx.beginPath(); ctx.ellipse(cx + s*.10, cy + s*.18, s*.62, s*.24, .28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#226a35';
    ctx.beginPath(); ctx.arc(cx, cy, s*.35, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#38a851';
    ctx.beginPath(); ctx.arc(cx - s*.16, cy - s*.08, s*.25, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s*.18, cy - s*.10, s*.23, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBuildingDetails(b, t, sx, sy, bw, bh, zt, pal, inset) {
    if (game.zoom < .36) return;
    ctx.save();
    const x = sx + inset * 1.7;
    const y = sy + inset * 1.7;
    const w = Math.max(1, bw - inset * 3.4);
    const h = Math.max(1, bh - inset * 3.4);
    if (t.kind === 'office' || t.kind === 'factory') {
      ctx.fillStyle = t.kind === 'office' ? 'rgba(211,239,255,.62)' : 'rgba(241,245,249,.60)';
      const cols = Math.max(2, Math.min(5, Math.floor(w / Math.max(9, zt*.55))));
      const rows = Math.max(1, Math.min(4, Math.floor(h / Math.max(8, zt*.50))));
      const cellW = w / (cols + .4);
      const cellH = h / (rows + .7);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const wx = x + cellW * (.45 + c);
        const wy = y + cellH * (.55 + r);
        roundRect(ctx, wx, wy, cellW*.46, Math.max(3, cellH*.32), Math.max(1.5, zt*.045)); ctx.fill();
      }
      if (t.kind === 'factory') {
        ctx.fillStyle = 'rgba(71,85,105,.65)';
        roundRect(ctx, sx + bw*.70, sy + bh*.15, Math.max(5, zt*.30), bh*.52, 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.ellipse(sx + bw*.76, sy + bh*.10, zt*.20, zt*.08, 0, 0, Math.PI*2); ctx.fill();
      }
    } else if (t.kind === 'home') {
      ctx.strokeStyle = 'rgba(255,255,255,.30)';
      ctx.lineWidth = Math.max(1, zt*.035);
      ctx.beginPath(); ctx.moveTo(sx + bw*.18, sy + bh*.50); ctx.lineTo(sx + bw*.82, sy + bh*.50); ctx.stroke();
      ctx.fillStyle = 'rgba(255,245,210,.55)';
      roundRect(ctx, sx + bw*.38, sy + bh*.54, bw*.18, bh*.23, Math.max(2, zt*.04)); ctx.fill();
    } else if (t.kind === 'park') {
      const treeCount = game.zoom < .58 ? 4 : 7;
      for (let i = 0; i < treeCount; i++) {
        const tx = sx + bw * (.20 + ((i * 37) % 61) / 100);
        const ty = sy + bh * (.22 + ((i * 53) % 57) / 100);
        drawTinyTree(tx, ty, Math.max(4, Math.min(bw, bh) * .09));
      }
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = Math.max(1, zt*.03);
      ctx.beginPath(); ctx.moveTo(sx+bw*.18, sy+bh*.78); ctx.quadraticCurveTo(sx+bw*.48, sy+bh*.40, sx+bw*.82, sy+bh*.72); ctx.stroke();
    } else if (t.kind === 'shop' || t.kind === 'restaurant' || t.kind === 'pub' || t.kind === 'mall') {
      const awningY = sy + inset * 1.6;
      const stripes = Math.max(3, Math.min(8, Math.floor(bw / Math.max(8, zt*.45))));
      for (let i = 0; i < stripes; i++) {
        ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.60)' : 'rgba(15,23,42,.10)';
        ctx.fillRect(sx + inset + i * (bw - inset*2) / stripes, awningY, (bw - inset*2) / stripes, Math.max(4, zt*.22));
      }
      if (t.kind === 'pub') {
        ctx.strokeStyle = 'rgba(255,255,255,.70)';
        ctx.lineWidth = Math.max(1, zt*.035);
        ctx.beginPath();
        ctx.moveTo(sx+bw*.28, sy+bh*.60); ctx.lineTo(sx+bw*.50, sy+bh*.42); ctx.lineTo(sx+bw*.72, sy+bh*.60);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBuildings(view) {
    const zt = TILE * game.zoom;
    const visible = buildings.filter(b => !(b.x + b.w < view.minX || b.y + b.h < view.minY || b.x > view.maxX || b.y > view.maxY));
    // Draw top-to-bottom so lower buildings visually sit in front.
    visible.sort((a,b) => (a.y + a.h) - (b.y + b.h));
    for (const b of visible) {
      const t = buildingType(b);
      const pal = buildingVisualPalette(t);
      const sx = b.x * zt + game.pan.x, sy = b.y * zt + game.pan.y;
      const bw = b.w * zt, bh = b.h * zt;
      const inset = Math.max(2, zt * .075);
      const radius = Math.max(4, zt * .18);
      const lift = Math.max(2, Math.min(10, zt * .26));
      ctx.save();

      if (!game.heatmap && game.zoom > .24) {
        ctx.fillStyle = 'rgba(15,23,42,.20)';
        roundRect(ctx, sx + inset*1.65, sy + inset*1.85 + lift*.45, bw - inset*2, bh - inset*2, radius);
        ctx.fill();
      }

      // Side/extrusion plate.
      ctx.fillStyle = darkenColor(pal.side, .02);
      roundRect(ctx, sx + inset, sy + inset + lift, bw - inset*2, bh - inset*2, radius);
      ctx.fill();

      const roofGrad = ctx.createLinearGradient(sx, sy + inset, sx, sy + bh - inset);
      roofGrad.addColorStop(0, lightenColor(pal.base, .16));
      roofGrad.addColorStop(.58, pal.base);
      roofGrad.addColorStop(1, darkenColor(pal.base, .14));
      ctx.fillStyle = roofGrad;
      roundRect(ctx, sx + inset, sy + inset, bw - inset*2, bh - inset*2, radius);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(15,23,42,.32)'; ctx.lineWidth = Math.max(1, zt*.045);
      ctx.stroke();

      // Roof cap.
      ctx.fillStyle = pal.roof;
      const capH = Math.max(5, Math.min(bh*.25, zt*.95));
      roundRect(ctx, sx + inset*1.55, sy + inset*1.45, bw - inset*3.1, capH, Math.max(3, radius*.58));
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      roundRect(ctx, sx + inset*1.9, sy + inset*1.75, bw - inset*3.8, Math.max(2, capH*.24), Math.max(2, radius*.32));
      ctx.fill();

      drawBuildingDetails(b, t, sx, sy, bw, bh, zt, pal, inset);
      drawBuildingIcon(t, sx + bw/2, sy + bh/2, Math.min(bw, bh), zt);
      drawParkedCarsInBuilding(b, zt);

      if (b.entrance != null && road[b.entrance]) {
        const access = accessForBuildingEntrance(b, b.entrance);
        const roadP = roadPointForBuildingEntrance(b, b.entrance);
        const ex = roadP.x * zt + game.pan.x;
        const ey = roadP.y * zt + game.pan.y;
        ctx.strokeStyle = access && access.entryOk ? 'rgba(255,255,255,.58)' : 'rgba(245,158,11,.74)';
        ctx.lineWidth = clamp(zt*.055, 1.2, 2.8); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx + bw/2, sy + bh/2); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.fillStyle = access && access.entryOk ? 'rgba(255,255,255,.92)' : 'rgba(252,211,77,.95)';
        ctx.strokeStyle = 'rgba(15,23,42,.45)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(ex, ey, Math.max(2, zt*.105), 0, Math.PI*2); ctx.fill(); ctx.stroke();
        if (game.debug && game.zoom > .58) drawAccessArrow(access, zt, access && access.entryOk ? 'rgba(34,197,94,.92)' : 'rgba(245,158,11,.92)');
      } else if (game.zoom > .58) {
        ctx.fillStyle = 'rgba(220,38,38,.88)';
        ctx.font = `900 ${Math.max(12, zt*.42)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('!', sx + bw/2, sy + bh/2);
      }

      if (game.zoom > .60) drawBuildingMapLabel(b, t, sx, sy, bw, bh, zt);
      if (game.debug) {
        ctx.fillStyle = '#111827';
        ctx.font = '10px sans-serif';
        ctx.fillText(`#${b.id} R:${actualResidentsInBuilding(b)}/${t.residents||0} J:${b.employees}/${t.jobs} S:${b.visitors}/${t.service}`, sx+4, sy+bh-5);
      }
      ctx.restore();
    }
  }

  function drawBuildingMapLabel(b, t, sx, sy, bw, bh, zt) {
    const title = t.name.replace('เล็ก','').replace('ใหญ่','');
    const lines = [title];
    if (t.kind === 'home') lines.push(`${actualResidentsInBuilding(b)}/${t.residents || 0}`);
    else if (t.jobs > 0) lines.push(`งาน ${b.employees}/${t.jobs}`);
    else if (t.service > 0) lines.push(`บริการ ${b.visitors}/${t.service}`);
    const fs = Math.max(9, Math.min(13, zt * .32));
    ctx.save();
    ctx.font = `800 ${fs}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const totalH = lines.length * (fs + 2);
    const y = sy + bh - totalH - Math.max(4, zt*.12);
    const maxW = Math.max(28, Math.min(bw - 6, ctx.measureText(lines[0]).width + 16));
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    ctx.strokeStyle = 'rgba(15,23,42,.12)';
    roundRect(ctx, sx + bw/2 - maxW/2, y - fs*.45, maxW, totalH + 5, Math.max(5, fs*.55));
    ctx.fill(); ctx.stroke();
    for (let i = 0; i < lines.length; i++) {
      ctx.fillStyle = i === 0 ? '#0f172a' : '#334155';
      ctx.fillText(lines[i], sx + bw/2, y + i * (fs + 2) + fs*.12);
    }
    ctx.restore();
  }

  function drawBuildingIcon(t, cx, cy, size, zt) {
    if (game.zoom < .38) return;
    ctx.save();
    const s = clamp(size * .20, 5, 21);
    ctx.lineWidth = clamp(zt*.035, 1, 2.2);
    ctx.strokeStyle = 'rgba(15,23,42,.42)';
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    if (t.kind === 'home') {
      ctx.fillStyle = 'rgba(255,245,220,.84)';
      ctx.beginPath(); ctx.moveTo(cx-s, cy-s*.08); ctx.lineTo(cx, cy-s*.92); ctx.lineTo(cx+s, cy-s*.08); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.76)'; roundRect(ctx, cx-s*.68, cy-s*.06, s*1.36, s*.86, 2.5); ctx.fill(); ctx.stroke();
    } else if (t.kind === 'park') {
      drawTinyTree(cx - s*.28, cy + s*.08, s*.88); drawTinyTree(cx + s*.30, cy - s*.02, s*.72);
    } else if (t.kind === 'office') {
      ctx.fillStyle = 'rgba(238,247,255,.82)'; roundRect(ctx, cx-s*.72, cy-s*.92, s*1.44, s*1.84, 2.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(37,99,235,.42)'; for (let ix=-1; ix<=1; ix++) for (let iy=-2; iy<=1; iy++) ctx.fillRect(cx+ix*s*.32-1.2, cy+iy*s*.34-1.1, 2.4, 2.2);
    } else if (t.kind === 'factory') {
      ctx.fillStyle = 'rgba(241,245,249,.82)'; roundRect(ctx, cx-s*.90, cy-s*.38, s*1.80, s*.86, 2.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(71,85,105,.72)'; ctx.fillRect(cx+s*.42, cy-s*.78, s*.24, s*.75);
    } else if (t.kind === 'restaurant') {
      ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.beginPath(); ctx.arc(cx, cy, s*.62, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*.92, cy-s*.65); ctx.lineTo(cx-s*.92, cy+s*.66); ctx.moveTo(cx+s*.82, cy-s*.65); ctx.lineTo(cx+s*.82, cy+s*.66); ctx.stroke();
    } else if (t.kind === 'pub') {
      ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.beginPath(); ctx.moveTo(cx-s*.78, cy-s*.76); ctx.lineTo(cx+s*.78, cy-s*.76); ctx.lineTo(cx+s*.25, cy+s*.70); ctx.lineTo(cx-s*.25, cy+s*.70); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.78)'; roundRect(ctx, cx-s*.85, cy-s*.55, s*1.7, s*1.1, 3); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawTrafficSignalForBox(cellIdx, zt, info = null) {
    info = info || junctionInfo(cellIdx);
    if (!info.controlled) return;
    const box = intersectionBoxInfo(cellIdx);
    if (!box) return;
    const r = intersectionBoxScreenRect(box, zt);
    const st = signalState(cellIdx);
    const headSize = clamp(zt * .18, 4.0, 9.5);
    const margin = clamp(zt * .31, 8, 20);
    function lampColor(name, activeName) {
      if (name === activeName) return name === 'red' ? '#ff3b45' : name === 'yellow' ? '#ffd44f' : '#31e66b';
      return name === 'red' ? 'rgba(111,22,29,.50)' : name === 'yellow' ? 'rgba(116,91,25,.42)' : 'rgba(19,91,51,.44)';
    }
    function drawHead(x, y, axis, rot) {
      const activeName = signalColorForAxis(axis, st);
      const boxW = headSize * 1.02;
      const boxH = headSize * 2.86;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(rot);
      ctx.strokeStyle = 'rgba(12,18,26,.84)'; ctx.lineWidth = Math.max(1.1, headSize*.20); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, boxH*.44); ctx.lineTo(0, boxH*.90); ctx.stroke();
      ctx.fillStyle = 'rgba(6,10,16,.94)'; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
      roundRect(ctx, -boxW/2, -boxH/2, boxW, boxH, Math.max(2, headSize*.22)); ctx.fill(); ctx.stroke();
      for (const l of [{name:'red', y:-headSize*.82},{name:'yellow',y:0},{name:'green',y:headSize*.82}]) {
        const col = lampColor(l.name, activeName);
        if (l.name === activeName && !game.skipMode) {
          ctx.fillStyle = col.replace(')', ', .18)').replace('rgb', 'rgba');
          ctx.beginPath(); ctx.arc(0, l.y, headSize*.55, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(0, l.y, headSize*.34, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    const c = info.cardinal || {};
    ctx.save();
    if (c.W) drawHead(r.x - margin, r.y + r.h/2, 0, 0);
    if (c.E) drawHead(r.x + r.w + margin, r.y + r.h/2, 0, Math.PI);
    if (c.N) drawHead(r.x + r.w/2, r.y - margin, 1, Math.PI/2);
    if (c.S) drawHead(r.x + r.w/2, r.y + r.h + margin, 1, -Math.PI/2);
    ctx.restore();
  }

  function drawGates() {
    const zt = TILE * game.zoom;
    for (const g of gates) {
      const sx = g.x * zt + game.pan.x + zt/2;
      const sy = g.y * zt + game.pan.y + zt/2;
      if (sx < -80 || sy < -80 || sx > window.innerWidth + 80 || sy > window.innerHeight + 80) continue;
      const r = Math.max(10, zt*.70);
      ctx.save();
      ctx.fillStyle = 'rgba(15,23,42,.20)'; ctx.beginPath(); ctx.ellipse(sx+r*.12, sy+r*.18, r*.82, r*.34, 0, 0, Math.PI*2); ctx.fill();
      const grd = ctx.createRadialGradient(sx-r*.32, sy-r*.38, r*.1, sx, sy, r);
      grd.addColorStop(0, '#fff5bc'); grd.addColorStop(1, g.entrance != null ? '#f59e0b' : '#ef4444');
      ctx.fillStyle = grd; ctx.strokeStyle = 'rgba(68,38,8,.72)'; ctx.lineWidth = 2;
      roundRect(ctx, sx-r*.82, sy-r*.58, r*1.64, r*1.16, r*.30); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.34)'; roundRect(ctx, sx-r*.58, sy-r*.38, r*1.16, r*.23, r*.12); ctx.fill();
      ctx.fillStyle = '#1b1510'; ctx.font = `900 ${Math.max(11, zt*.48)}px ui-sans-serif, system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GATE', sx, sy+1);
      if (g.entrance != null && road[g.entrance] && game.zoom > .34) {
        const ep = roadCellScreenCenter(g.entrance, zt);
        ctx.strokeStyle = 'rgba(245,158,11,.80)'; ctx.lineWidth = Math.max(2, zt*.10); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ep.sx, ep.sy); ctx.stroke();
      }
      if (game.zoom > .62) {
        const label = g.name;
        ctx.font = '800 11px ui-sans-serif, system-ui';
        const tw = ctx.measureText(label).width + 14;
        ctx.fillStyle = 'rgba(15,23,42,.78)'; roundRect(ctx, sx + r + 5, sy - 16, tw, 24, 9); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(label, sx + r + 12, sy - 1);
      }
      ctx.restore();
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  }

  function drawCar(v, sx, sy, zt, angle = vehicleAngle(v), roadW = zt, roadTypeId = 1) {
    const isTruck = v.type === 'PassThroughTrip';
    const isMove = v.type === 'MoveInTrip' || v.type === 'MoveOutTrip';
    const isWork = v.type === 'WorkTrip';
    const lanes = Math.max(2, roadDataById(roadTypeId)?.lanes || 2);
    const laneWidth = Math.max(2.8, roadW / lanes);
    const len = Math.max(7.5, zt * (isTruck ? 1.22 : isMove ? 1.02 : .94));
    const wid = Math.max(3.4, laneWidth * (isTruck ? .82 : .70));
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(angle);
    ctx.fillStyle = 'rgba(0,0,0,.24)'; roundRect(ctx, -len/2 + Math.max(.8, zt*.04), -wid/2 + Math.max(.7, zt*.035), len, wid, Math.max(2, wid*.36)); ctx.fill();
    const base = v.color || (isWork ? '#38bdf8' : '#22c55e');
    const bodyGrad = ctx.createLinearGradient(-len/2, -wid/2, len/2, wid/2);
    bodyGrad.addColorStop(0, lightenColor(base, .24)); bodyGrad.addColorStop(.56, base); bodyGrad.addColorStop(1, darkenColor(base, .20));
    ctx.fillStyle = bodyGrad; ctx.strokeStyle = 'rgba(0,0,0,.58)'; ctx.lineWidth = Math.max(.8, zt*.024);
    roundRect(ctx, -len/2, -wid/2, len, wid, Math.max(2, wid*.40)); ctx.fill(); ctx.stroke();
    if (isTruck) {
      ctx.fillStyle = 'rgba(230,245,255,.86)'; roundRect(ctx, len*.12, -wid*.37, len*.28, wid*.74, Math.max(1.5, wid*.20)); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.24)'; roundRect(ctx, -len*.44, -wid*.34, len*.48, wid*.68, 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(len*.06, -wid*.44, Math.max(1, zt*.025), wid*.88);
    } else {
      ctx.fillStyle = 'rgba(18,35,48,.60)'; roundRect(ctx, -len*.04, -wid*.36, len*.30, wid*.72, Math.max(1.5, wid*.22)); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.24)'; roundRect(ctx, -len*.40, -wid*.30, len*.24, wid*.60, 2); ctx.fill();
      if (isMove) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-len*.50, -wid*.10, len*.18, wid*.20); }
    }
    ctx.fillStyle = '#fff6b2'; ctx.fillRect(len/2 - 1.8, -wid*.30, 2.5, Math.max(1.2, wid*.20)); ctx.fillRect(len/2 - 1.8, wid*.10, 2.5, Math.max(1.2, wid*.20));
    ctx.fillStyle = '#ff3e3e'; ctx.fillRect(-len/2 - .2, -wid*.27, 2.1, Math.max(1.1, wid*.20)); ctx.fillRect(-len/2 - .2, wid*.08, 2.1, Math.max(1.1, wid*.20));
    if (zt > 10) {
      ctx.fillStyle = 'rgba(5,5,5,.82)';
      for (const x of [-len*.33, len*.17]) { ctx.fillRect(x, -wid*.60, len*.17, wid*.20); ctx.fillRect(x, wid*.40, len*.17, wid*.20); }
    }
    ctx.restore();
  }



  // ================================================================
  // Patch 47: Restore Classic Road Renderer
  // Reverts road / lane / junction / traffic-light graphics to Patch 44 style.
  // Keeps Patch 46 terrain, buildings, vehicles, UI polish, and all simulation logic.
  // ================================================================

function drawLaneMarkings(seg, p1, p2, width, zt) {
    const lanes = roadDataById(seg.rt).lanes;
    if (lanes <= 1) return;
    const dx = p2.sx - p1.sx, dy = p2.sy - p1.sy;
    const len = Math.hypot(dx, dy) || 1;
    const isStraight = Math.abs(dx) < 0.01 || Math.abs(dy) < 0.01;
    // Patch 5: ไม่วาดเส้นเลนบนทางโค้ง/เฉียง/ช่องแยก เพราะจะดูเป็นเส้นมั่วทับกัน
    if (!isStraight || isJunctionCell(seg.i) || isJunctionCell(seg.j)) return;

    const nx = -dy / len, ny = dx / len;
    const shorten = Math.min(len * 0.18, zt * 0.42);
    const ax = p1.sx + (dx / len) * shorten;
    const ay = p1.sy + (dy / len) * shorten;
    const bx = p2.sx - (dx / len) * shorten;
    const by = p2.sy - (dy / len) * shorten;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Patch 42: do not draw extra fake edge-guide lane lines.
    // They made 8-lane roads look visually unbalanced, like 6 lanes on one side
    // and 2 on the other. Only true lane-boundary lines are drawn below.

    // เส้นแบ่งทิศทางกลางถนน สีเหลือง วาดเส้นเดียวพอ ไม่ให้ตัดกันมั่วตรงแยก
    ctx.strokeStyle = 'rgba(255, 221, 87, .82)';
    ctx.lineWidth = clamp(zt * .030, .9, 1.8);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();

    // เส้นสีขาว: วาดเฉพาะเส้นแบ่งเลนจริงแบบสมมาตร
    // 4 เลน = ขาว 1 เส้นต่อฝั่ง + เหลืองกลาง = 2/2
    // 8 เลน = ขาว 3 เส้นต่อฝั่ง + เหลืองกลาง = 4/4
    if (lanes >= 4 && game.zoom > .56) {
      ctx.strokeStyle = 'rgba(244, 248, 252, .24)';
      ctx.lineWidth = clamp(zt * .014, .55, 1.05);
      const offsets = [];
      for (let k = 1; k < lanes; k++) {
        const o = (k / lanes) - 0.5;
        if (Math.abs(o) < 0.0001) continue; // center line is yellow, not white
        offsets.push(o);
      }
      for (const o of offsets) {
        ctx.beginPath();
        ctx.moveTo(ax + nx * width * o, ay + ny * width * o);
        ctx.lineTo(bx + nx * width * o, by + ny * width * o);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

function drawRoads(view) {
    const zt = TILE * game.zoom;
    const { segs } = visibleRoadSegments(view);

    // Patch 4 Road Footprint System:
    // วาดถนนจาก roadFootprint[] เป็นช่องกริดจริง ไม่ใช่ stroke ใหญ่ที่ล้นไปทับอาคาร
    ctx.save();
    for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
      const i = idx(x, y);
      const rt = roadFootprint[i];
      if (!rt) continue;
      const owner = roadOwnerAtGridCell(i);
      const sx = x * zt + game.pan.x;
      const sy = y * zt + game.pan.y;
      const heat = (game.heatmap || game.skipMode) && owner != null;
      ctx.fillStyle = heat ? trafficColor(getRoadRatio(owner)) : roadBaseColor(rt, owner);
      ctx.fillRect(sx, sy, zt + .5, zt + .5);

      // ขอบไหล่ทางเฉพาะด้านนอก footprint เพื่อให้ถนนดูเป็นพื้นที่จริง ไม่ใช่เส้นประ
      ctx.strokeStyle = roadShoulderColor(rt, owner);
      ctx.lineWidth = Math.max(1, zt * .045);
      ctx.beginPath();
      if (y <= 0 || !roadFootprint[idx(x, y - 1)]) { ctx.moveTo(sx, sy); ctx.lineTo(sx + zt, sy); }
      if (y >= MAP_H - 1 || !roadFootprint[idx(x, y + 1)]) { ctx.moveTo(sx, sy + zt); ctx.lineTo(sx + zt, sy + zt); }
      if (x <= 0 || !roadFootprint[idx(x - 1, y)]) { ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + zt); }
      if (x >= MAP_W - 1 || !roadFootprint[idx(x + 1, y)]) { ctx.moveTo(sx + zt, sy); ctx.lineTo(sx + zt, sy + zt); }
      ctx.stroke();
    }
    ctx.restore();

    // เส้นเลนวาดตามแกนถนน แต่แกนภาพถูกเลื่อนไปกลาง footprint แล้ว จึงไม่ล้นกริด
    if (!game.heatmap && !game.skipMode && game.zoom > .46) {
      ctx.save();
      for (const s of segs) {
        const p1 = roadCellScreenCenter(s.i, zt);
        const p2 = roadCellScreenCenter(s.j, zt);
        const width = roadVisualWidth(s.rt, zt);
        drawLaneMarkings(s, p1, p2, width, zt);
      }
      ctx.restore();
    }

    // Patch 28: Junction graphics use the same classifier as vehicle logic.
    // 3-way / merge = junction pad only. True 4-way orthogonal crossing = traffic light.
    for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
      const i = idx(x,y);
      if (!road[i]) continue;
      const info = junctionInfo(i);
      if (!info.isJunction) continue;
      const rt = road[i];
      const p = roadCellScreenCenter(i, zt);
      const width = roadVisualWidth(rt, zt);
      if (!game.heatmap && !game.skipMode && game.zoom > .50) {
        if (info.planned) drawIntersectionBoxMarkings(i, zt, info);
        else drawJunctionMarkings(p.sx, p.sy, roadVisualFootprintWidth(rt, zt), i, info);
      }
      if (!game.heatmap && !game.skipMode && game.zoom > .58 && info.controlled) drawTrafficSignalForBox(i, zt, info);
      if (game.debug) {
        const sig = signalState(i);
        const box = info.planned ? intersectionBoxInfo(i) : null;
        const dbg = box ? intersectionBoxScreenCenter(box, zt) : p;
        const dbgSize = clamp(width * .32, 6, 20);
        ctx.fillStyle = !info.controlled ? 'rgba(255,255,255,.38)' : sig.allRed ? '#ff5252' : (sig.phase ? '#52a8ff' : '#52ff82');
        roundRect(ctx, dbg.sx - dbgSize / 2, dbg.sy - dbgSize / 2, dbgSize, dbgSize, 3); ctx.fill();
      }
    }

    if (game.debug) {
      for (let y = view.minY; y <= view.maxY; y++) for (let x = view.minX; x <= view.maxX; x++) {
        const i = idx(x,y);
        if (roadFootprint[i] && !road[i]) {
          ctx.fillStyle = 'rgba(56,189,248,.12)';
          ctx.fillRect(x*zt+game.pan.x, y*zt+game.pan.y, zt, zt);
        }
        if (!road[i]) continue;
        const p = roadCellScreenCenter(i, zt);
        if (cellVehicleCount(i) > 0) {
          ctx.fillStyle = 'rgba(255,255,255,.38)';
          ctx.beginPath(); ctx.arc(p.sx, p.sy, clamp(zt*.16, 2, 6), 0, Math.PI*2); ctx.fill();
        }
        if (waitLoad[i] > 0.1) {
          ctx.fillStyle = 'rgba(255,0,0,.26)';
          ctx.fillRect(x*zt+game.pan.x, y*zt+game.pan.y, zt, zt);
        }
      }
    }
  }

function drawJunctionMarkings(x, y, w, cellIdx, info = null) {
    info = info || junctionInfo(cellIdx);
    if (!info.isJunction) return;
    const r = clamp(w * (info.controlled ? .27 : .20), 3, 16);
    ctx.save();

    // Intersection pad: one clean shape at the graph node. This replaces random cross strokes
    // on every 3-way connection and makes the actual junction readable.
    ctx.fillStyle = info.controlled ? 'rgba(18, 25, 33, .20)' : 'rgba(245, 246, 235, .16)';
    ctx.strokeStyle = info.controlled ? 'rgba(255,255,255,.42)' : 'rgba(255,255,255,.24)';
    ctx.lineWidth = clamp(w * .018, .8, 1.8);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (info.controlled) {
      const stopDist = w * .33;
      const stopHalf = w * .18;
      ctx.strokeStyle = 'rgba(255,255,255,.78)';
      ctx.lineWidth = clamp(w * .020, 1.0, 2.4);
      ctx.lineCap = 'round';
      // Stop lines for all four approaches, but only one short line per arm to avoid graphic clutter.
      for (const a of info.arms) {
        const axis = armAxisFromDir(a.dx, a.dy);
        if (axis == null) continue;
        const px = x + a.dx * stopDist;
        const py = y + a.dy * stopDist;
        const nx = -a.dy;
        const ny = a.dx;
        ctx.beginPath();
        ctx.moveTo(px - nx * stopHalf, py - ny * stopHalf);
        ctx.lineTo(px + nx * stopHalf, py + ny * stopHalf);
        ctx.stroke();
      }
    } else if (info.degree >= 3 && game.debug) {
      ctx.fillStyle = info.diagonal ? 'rgba(251,191,36,.85)' : 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.arc(x, y, Math.max(2, r * .25), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

function drawIntersectionBoxMarkings(cellIdx, zt, info = null) {
    info = info || junctionInfo(cellIdx);
    const box = intersectionBoxInfo(cellIdx);
    if (!box) return;
    const r = intersectionBoxScreenRect(box, zt);
    ctx.save();

    ctx.fillStyle = info.controlled ? 'rgba(18, 25, 33, .18)' : 'rgba(245, 246, 235, .14)';
    ctx.strokeStyle = info.controlled ? 'rgba(255,255,255,.42)' : 'rgba(255,255,255,.22)';
    ctx.lineWidth = clamp(zt * .035, 1.2, 3.0);
    roundRect(ctx, r.x, r.y, r.w, r.h, clamp(zt * .18, 3, 12));
    ctx.fill();
    ctx.stroke();

    // Stop/yield lines are drawn only on real arms. A T-junction receives 3 sides,
    // not a fake 4-way set of lights/lines. Curves never reach this function.
    const stopOffset = clamp(zt * .12, 2, 6);
    const pad = clamp(zt * .20, 3, 12);
    ctx.strokeStyle = info.controlled ? 'rgba(255,255,255,.82)' : 'rgba(255,255,255,.46)';
    ctx.lineWidth = clamp(zt * (info.controlled ? .055 : .040), 1.3, 4.8);
    ctx.lineCap = 'round';

    const c = info.cardinal || {};
    const lines = [];
    if (c.W) lines.push({ x1:r.x - stopOffset, y1:r.y + pad, x2:r.x - stopOffset, y2:r.y + r.h - pad });
    if (c.E) lines.push({ x1:r.x + r.w + stopOffset, y1:r.y + pad, x2:r.x + r.w + stopOffset, y2:r.y + r.h - pad });
    if (c.N) lines.push({ x1:r.x + pad, y1:r.y - stopOffset, x2:r.x + r.w - pad, y2:r.y - stopOffset });
    if (c.S) lines.push({ x1:r.x + pad, y1:r.y + r.h + stopOffset, x2:r.x + r.w - pad, y2:r.y + r.h + stopOffset });
    for (const ln of lines) {
      ctx.beginPath();
      ctx.moveTo(ln.x1, ln.y1);
      ctx.lineTo(ln.x2, ln.y2);
      ctx.stroke();
    }

    if (game.debug) {
      ctx.fillStyle = 'rgba(255,255,255,.86)';
      ctx.font = `${clamp(zt * .22, 8, 14)}px ui-sans-serif, system-ui`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${info.kind} ${box.widthCells}x${box.heightCells}`, r.x + r.w / 2, r.y + r.h / 2);
    }
    ctx.restore();
  }

function drawTrafficSignalForBox(cellIdx, zt, info = null) {
    info = info || junctionInfo(cellIdx);
    if (!info.controlled) return;
    const box = intersectionBoxInfo(cellIdx);
    if (!box) return;
    const r = intersectionBoxScreenRect(box, zt);
    const st = signalState(cellIdx);
    const headSize = clamp(zt * .19, 4.0, 10.0);
    const margin = clamp(zt * .34, 8, 22);
    const poleColor = 'rgba(16, 21, 28, .90)';

    function lampColor(name, activeName) {
      if (name === activeName) {
        if (name === 'red') return '#ff3b45';
        if (name === 'yellow') return '#ffd44f';
        return '#31e66b';
      }
      if (name === 'red') return 'rgba(111, 22, 29, .52)';
      if (name === 'yellow') return 'rgba(116, 91, 25, .44)';
      return 'rgba(19, 91, 51, .46)';
    }

    function drawHead(x, y, axis, rot) {
      const activeName = signalColorForAxis(axis, st);
      const boxW = headSize * 1.05;
      const boxH = headSize * 3.0;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.strokeStyle = poleColor;
      ctx.lineWidth = Math.max(1.1, headSize * .22);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, boxH * .50);
      ctx.lineTo(0, boxH * .95);
      ctx.stroke();
      ctx.fillStyle = 'rgba(7, 11, 16, .96)';
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = Math.max(1, headSize * .08);
      roundRect(ctx, -boxW / 2, -boxH / 2, boxW, boxH, Math.max(2, headSize * .20));
      ctx.fill();
      ctx.stroke();
      const lamps = [
        { name:'red', y:-headSize*.88 },
        { name:'yellow', y:0 },
        { name:'green', y:headSize*.88 }
      ];
      for (const l of lamps) {
        ctx.fillStyle = lampColor(l.name, activeName);
        ctx.beginPath();
        ctx.arc(0, l.y, headSize * .34, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const c = info.cardinal || {};
    ctx.save();
    if (c.W) drawHead(r.x - margin, r.y + r.h / 2, 0, 0);
    if (c.E) drawHead(r.x + r.w + margin, r.y + r.h / 2, 0, Math.PI);
    if (c.N) drawHead(r.x + r.w / 2, r.y - margin, 1, Math.PI / 2);
    if (c.S) drawHead(r.x + r.w / 2, r.y + r.h + margin, 1, -Math.PI / 2);
    ctx.restore();
  }

  let last = performance.now();
  let lastDrawAt = 0;
  let uiTick = 0;
  let problemUiTick = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    updateFollowCamera();
    // Patch 48: คืน Canvas draw เป็น 60FPS เพื่อให้การแพน/ซูมและรถเคลื่อนที่ไม่กระตุก
    // งานหนักอื่นยังถูก throttle อยู่ จึงไม่แตะ logic ถนน/แยก/ไฟแดง
    const drawInterval = game.skipMode ? 90 : DRAW_INTERVAL_MS;
    if (now - lastDrawAt >= drawInterval) {
      draw();
      lastDrawAt = now;
    }
    uiTick += dt;
    problemUiTick += dt;
    if (problemUiTick > 3.5) {
      problemUiTick = 0;
      getCachedProblemRows(true);
    }
    if (uiTick > 0.75) {
      uiTick = 0;
      const s = renderStats() || game.lastStats || computeStats();
      renderAlerts();
      updateToolButtons();
      statusText.textContent = `${timeText()} • Trip ${s.activeTrips} • ถนนจริง ${s.roadCars || 0} • คิว ${s.queuedTrips || 0} • Flow ${Math.round(s.trafficFlow)}%${game.skipMode ? ' • ข้ามวันแบบสรุป' : ''}`;
    }
    requestAnimationFrame(loop);
  }

  buildToolButtons();
  resetCity('phuket');
  showToolInfo();
  requestAnimationFrame(loop);
})();
</script>
