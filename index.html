<!doctype html>
<!-- Traffic Fixer Thailand Version 2 - Final Checked Build -->
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traffic Fixer Thailand - Version 2 Final Checked</title>
  <style>
:root {
  --bg: #0b1820;
  --panel: rgba(248, 250, 252, 0.92);
  --panel-strong: rgba(255, 255, 255, 0.96);
  --line: rgba(15, 23, 42, 0.12);
  --text: #14212b;
  --muted: #64748b;
  --accent: #f59e0b;
  --accent2: #0284c7;
  --good: #16a34a;
  --bad: #dc2626;
  --warn: #ea580c;
  --dark-panel: rgba(10, 19, 26, 0.76);
}
* { box-sizing: border-box; text-shadow: none !important; }
.brand .logo, .tool .tool-icon, .panel-title:before, .dot { box-shadow: none !important; filter: none !important; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at 45% 10%, rgba(125, 211, 252, .20), transparent 28%), var(--bg);
  color: var(--text);
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: default;
  background: #b9d8aa;
}
canvas.dragging { cursor: grabbing; }
#topbar, #bottombar, .panel, .map-legend {
  position: absolute;
  z-index: 5;
  backdrop-filter: blur(18px) saturate(1.08);
}
#topbar {
  left: 14px;
  right: 14px;
  top: 12px;
  min-height: 72px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,.62);
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(255,255,255,.94), rgba(236,244,250,.86));
  box-shadow: 0 16px 48px rgba(15, 23, 42, .20), inset 0 1px 0 rgba(255,255,255,.88);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 245px; }
.brand .logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  font-size: 25px;
  border-radius: 16px;
  background: linear-gradient(135deg, #fbbf24, #fb923c);
}
.brand strong { font-size: 15px; letter-spacing: .15px; color: #0f172a; }
.brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.stats {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(96px, 1fr));
  gap: 7px;
  font-size: 12px;
}
.stat {
  position: relative;
  overflow: hidden;
  min-height: 49px;
  padding: 7px 9px;
  border-radius: 15px;
  background: rgba(255,255,255,.74);
  border: 1px solid rgba(15, 23, 42, .08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.90);
}
.stat .label { display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
.stat b { display: block; color: #0f172a; font-size: 15px; line-height: 1.1; margin-top: 4px; letter-spacing: .1px; }
.stat.good b { color: var(--good); }
.stat.warn b { color: var(--warn); }
.stat.bad b { color: var(--bad); }
.stat.clock { background: linear-gradient(135deg, #0f172a, #1e293b); }
.stat.clock .label, .stat.clock b { color: #fff; }
.stat.clickable { cursor: pointer; }
.stat.clickable:hover { border-color: rgba(2,132,199,.40); background: #ffffff; }
.stat.clickable:after { content: "ดูรายละเอียด"; position: absolute; right: 8px; bottom: 5px; font-size: 9px; color: #64748b; opacity: .75; }
.breakdown-list { display: grid; gap: 7px; margin-top: 9px; }
.breakdown-row { padding: 8px; border-radius: 12px; background: rgba(241,245,249,.86); border: 1px solid rgba(15,23,42,.06); }
.breakdown-row b { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; }
.bar-track { height: 8px; border-radius: 99px; overflow: hidden; background: rgba(15,23,42,.10); }
.bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #38bdf8, #22c55e); }
.vacancy-list { margin-top: 8px; display:grid; gap:6px; }
.vacancy-item { padding: 7px 8px; border-radius: 11px; background: rgba(255,255,255,.72); border:1px solid rgba(15,23,42,.07); }

.top-actions { display: flex; align-items: center; gap: 8px; }
.city-picker {
  display: grid;
  gap: 3px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
button, select {
  color: #0f172a;
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(15,23,42,.14);
  border-radius: 13px;
  padding: 8px 11px;
  font-size: 13px;
  outline: none;
  box-shadow: 0 1px 0 rgba(255,255,255,.76), 0 8px 18px rgba(15,23,42,.06);
}
button { cursor: pointer; transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease; }
button:hover, select:hover { border-color: rgba(2,132,199,.38); background: #fff; box-shadow: 0 10px 24px rgba(2,132,199,.12); }
button:active { transform: translateY(1px); }
button.active {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #221407;
  border-color: rgba(245,158,11,.74);
  font-weight: 900;
}
.danger-lite { color: #991b1b; }
.panel {
  top: 96px;
  bottom: 66px;
  width: 318px;
  border: 1px solid rgba(255,255,255,.64);
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(242,248,252,.88));
  padding: 12px;
  overflow: auto;
  box-shadow: 0 18px 56px rgba(15,23,42,.22), inset 0 1px 0 rgba(255,255,255,.9);
  scrollbar-color: rgba(15,23,42,.22) transparent;
}
.panel.left { left: 14px; }
.panel.right { right: 14px; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.panel-title { font-weight: 950; letter-spacing: .18px; color: #0f172a; font-size: 16px; }
.panel-title:before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 99px;
  background: var(--accent);
}
.panel-subtitle { color: #92400e; font-weight: 900; margin: 14px 0 8px; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.42; margin-top: 2px; }
.tool-tabs {
  position: sticky;
  top: -12px;
  z-index: 3;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 9px 0 9px;
  margin-bottom: 4px;
  background: linear-gradient(180deg, rgba(248,250,252,.97), rgba(248,250,252,.82));
}
.tool-tab {
  flex: 0 0 auto;
  padding: 7px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  color: #475569;
  background: rgba(255,255,255,.76);
}
.tool-tab.active { background: #0f172a; color: #fff; border-color: #0f172a; }
.tool-group { margin: 9px 0 14px; }
.tool-group.is-hidden { display: none; }
.tool-group h3 { margin: 0 0 7px; font-size: 13px; color: #334155; display: flex; align-items: center; gap: 6px; }
.tool-grid { display: grid; grid-template-columns: 1fr; gap: 7px; }
.tool {
  text-align: left;
  min-height: 64px;
  padding: 9px 10px;
  border-radius: 16px;
  background: rgba(255,255,255,.76);
  border: 1px solid rgba(15,23,42,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 18px rgba(15,23,42,.045);
}
.tool strong { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #0f172a; }
.tool .tool-icon { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 9px; background: #e0f2fe; font-size: 14px; }
.tool small { color: var(--muted); display: block; margin-top: 5px; padding-left: 32px; font-size: 11px; line-height: 1.32; }
.tool.active {
  background: linear-gradient(135deg, rgba(255,237,184,.94), rgba(255,247,237,.96));
  border-color: rgba(245,158,11,.72);
  box-shadow: 0 0 0 2px rgba(245,158,11,.13), 0 12px 26px rgba(245,158,11,.14);
}
.tool.disabled { opacity: .48; filter: grayscale(.18); }
.card {
  background: rgba(255,255,255,.78);
  border: 1px solid rgba(15,23,42,.09);
  border-radius: 17px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 18px rgba(15,23,42,.045);
}
.card b, .inspector-title { color: #0f172a; font-weight: 950; }
.card .muted, .muted { color: var(--muted); }
.inspector-card .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
.metric {
  padding: 8px;
  border-radius: 12px;
  background: rgba(241,245,249,.86);
  border: 1px solid rgba(15,23,42,.06);
}
.metric span { display: block; color: var(--muted); font-size: 11px; }
.metric b { display: block; margin-top: 2px; font-size: 13px; }
.alert {
  background: linear-gradient(180deg, rgba(254,226,226,.92), rgba(255,247,237,.78));
  border: 1px solid rgba(220,38,38,.22);
  border-radius: 16px;
  padding: 10px;
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.45;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
}
.alert.good { background: linear-gradient(180deg, rgba(220,252,231,.92), rgba(240,253,244,.78)); border-color: rgba(22,163,74,.25); }
.alert b { display: block; margin-bottom: 3px; color: #0f172a; }
.map-legend {
  left: 50%;
  bottom: 74px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border-radius: 999px;
  background: rgba(15,23,42,.64);
  border: 1px solid rgba(255,255,255,.18);
  color: rgba(255,255,255,.82);
  font-size: 12px;
  box-shadow: 0 12px 32px rgba(15,23,42,.22);
}
.dot { width: 10px; height: 10px; display: inline-block; border-radius: 99px; margin-right: 5px; vertical-align: -1px; }
.dot.road { background: #5b6670; }
.dot.gate { background: #fbbf24; }
.dot.vehicle { background: #38bdf8; }
.dot.heat { background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444); width: 26px; border-radius: 999px; }
#bottombar {
  left: 14px;
  right: 14px;
  bottom: 12px;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid rgba(255,255,255,.64);
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(255,255,255,.94), rgba(236,244,250,.88));
  box-shadow: 0 16px 48px rgba(15,23,42,.18), inset 0 1px 0 rgba(255,255,255,.88);
}
.speed-group { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: rgba(15,23,42,.05); }
.wide-btn { min-width: 142px; }
#statusText {
  margin-left: auto;
  color: #334155;
  font-size: 12px;
  white-space: nowrap;
  max-width: 33vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 1320px) {
  .stats { grid-template-columns: repeat(4, minmax(90px, 1fr)); }
  .panel { width: 296px; }
  .brand { min-width: 205px; }
}
@media (max-width: 1000px) {
  .panel.right { display: none; }
  .stats { grid-template-columns: repeat(3, minmax(80px, 1fr)); }
  .map-legend { display: none; }
}
@media (max-width: 820px) {
  .panel.left { display: none; }
  .brand { min-width: 155px; }
  .brand small { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(80px, 1fr)); }
  #statusText { display: none; }
}

/* User readability pass: flat text/icons, no visual shadows. */
* { text-shadow: none !important; }
#topbar, #bottombar, .panel, .map-legend, .stat, .tool, .card, .metric, .alert,
button, select, .breakdown-row, .vacancy-item, .brand .logo, .tool .tool-icon, .dot {
  box-shadow: none !important;
  filter: none !important;
}
#topbar, #bottombar, .panel {
  backdrop-filter: none !important;
}
.stat .label, .tool strong, .tool small, .metric span, .metric b, .inspector-title, .muted,
.panel-title, .panel-subtitle, button, select {
  text-shadow: none !important;
}
/* iPad compact HUD pass: keep the top bar small on touch/tablet screens. */
@media (pointer: coarse), (max-width: 1180px) {
  #topbar {
    left: 8px;
    right: 8px;
    top: max(6px, env(safe-area-inset-top));
    min-height: 50px;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 14px;
    align-items: center;
  }
  .brand {
    min-width: 122px;
    gap: 6px;
  }
  .brand .logo {
    width: 30px;
    height: 30px;
    min-width: 30px;
    font-size: 17px;
    border-radius: 9px;
  }
  .brand strong {
    font-size: 11px;
    line-height: 1.05;
  }
  .brand small {
    display: none !important;
  }
  .stats {
    grid-template-columns: repeat(6, minmax(54px, 1fr)) !important;
    gap: 4px;
    font-size: 9px;
    min-width: 0;
  }
  .stat {
    min-height: 34px;
    padding: 4px 5px;
    border-radius: 10px;
  }
  .stat .label {
    font-size: 8.5px;
    gap: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat b {
    font-size: 11px;
    line-height: 1.05;
    margin-top: 2px;
    white-space: nowrap;
  }
  .stat.clickable:after {
    display: none;
  }
  .top-actions {
    gap: 4px;
    flex: 0 0 auto;
  }
  button, select {
    padding: 5px 7px;
    border-radius: 10px;
    font-size: 11px;
  }
  .panel {
    top: calc(max(6px, env(safe-area-inset-top)) + 58px);
    bottom: 54px;
  }
  #bottombar {
    left: 8px;
    right: 8px;
    bottom: max(6px, env(safe-area-inset-bottom));
    min-height: 40px;
    gap: 5px;
    padding: 5px 7px;
    border-radius: 14px;
    overflow-x: auto;
  }
  #bottombar button {
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .map-legend {
    bottom: calc(max(6px, env(safe-area-inset-bottom)) + 48px);
  }
}

@media (pointer: coarse) and (max-width: 820px) {
  .brand {
    display: none;
  }
  .stats {
    grid-template-columns: repeat(6, minmax(46px, 1fr)) !important;
  }
  .top-actions select {
    max-width: 78px;
  }
  #resetBtn {
    max-width: 76px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
}

@media (pointer: coarse) and (max-width: 680px) {
  .stats {
    grid-template-columns: repeat(3, minmax(58px, 1fr)) !important;
  }
  #topbar {
    align-items: flex-start;
  }
}

/* iPad two-finger navigation + collapsible HUD pass */
canvas { touch-action: none; }
.collapse-btn {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  min-width: 30px;
  padding: 0 !important;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-weight: 950;
  line-height: 1;
  background: #ffffff !important;
  color: #0f172a !important;
  border: 1px solid rgba(15,23,42,.18) !important;
  box-shadow: none !important;
}
.panel { padding-top: 44px; }
.panel > .collapse-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 30;
}
#topbar.collapsed, #bottombar.collapsed, .panel.collapsed {
  width: 42px !important;
  height: 42px !important;
  min-width: 42px !important;
  min-height: 42px !important;
  max-width: 42px !important;
  max-height: 42px !important;
  right: auto !important;
  bottom: auto !important;
  padding: 6px !important;
  overflow: visible !important;
  border-radius: 14px !important;
  display: block !important;
  background: rgba(255,255,255,.96) !important;
}
#topbar.collapsed { left: 8px !important; top: max(6px, env(safe-area-inset-top)) !important; }
#bottombar.collapsed { left: 8px !important; bottom: max(6px, env(safe-area-inset-bottom)) !important; top: auto !important; }
.panel.left.collapsed { left: 8px !important; top: calc(max(6px, env(safe-area-inset-top)) + 52px) !important; }
.panel.right.collapsed { right: 8px !important; left: auto !important; top: calc(max(6px, env(safe-area-inset-top)) + 102px) !important; }
#topbar.collapsed > :not(.collapse-btn),
#bottombar.collapsed > :not(.collapse-btn),
.panel.collapsed > :not(.collapse-btn) {
  display: none !important;
}
#topbar.collapsed > .collapse-btn,
#bottombar.collapsed > .collapse-btn,
.panel.collapsed > .collapse-btn {
  position: static !important;
  width: 30px !important;
  height: 30px !important;
  min-width: 30px !important;
}
.demand-row.bad-demand { background: rgba(255,247,237,.92); border-color: rgba(234,88,12,.22); }
.demand-row.good-demand { background: rgba(240,253,244,.88); border-color: rgba(22,163,74,.18); }

@media (max-width: 1000px) {
  .panel.right { display: block; }
}
@media (pointer: coarse), (max-width: 1180px) {
  .stats { grid-template-columns: repeat(7, minmax(48px, 1fr)) !important; }
  .panel { width: min(300px, calc(100vw - 18px)); }
  .panel.right { right: 8px; }
  .panel.left { left: 8px; }
  #topbar:not(.collapsed) { padding-left: 7px; }
  #bottombar:not(.collapsed) { padding-left: 7px; }
}
@media (pointer: coarse) and (max-width: 680px) {
  .stats { grid-template-columns: repeat(4, minmax(54px, 1fr)) !important; }
}

/* Final flat readability: remove every UI shadow/filter/text shadow. */
* {
  text-shadow: none !important;
  box-shadow: none !important;
  filter: none !important;
}
#topbar, #bottombar, .panel, .stat, .tool, .card, .metric, .alert, .map-legend, .collapse-btn, button, select {
  box-shadow: none !important;
  text-shadow: none !important;
  filter: none !important;
}
.tool-icon, .logo, .dot, .brand, .panel-title, .panel-subtitle, .inspector-title {
  box-shadow: none !important;
  text-shadow: none !important;
  filter: none !important;
}


/* iPad portrait fix: allow the collapsed tool panels to open.
   Earlier mobile CSS hid .panel.left at <=820px; when tapping + to expand,
   the panel lost .collapsed and became display:none, so users could not select tools. */
@media (pointer: coarse), (max-width: 820px) {
  .panel.left:not(.collapsed),
  .panel.right:not(.collapsed) {
    display: block !important;
  }
}



/* iPad Safari navigation lock: no floating joystick. */
html, body {
  position: fixed;
  overflow: hidden !important;
  overscroll-behavior: none;
  width: 100%;
  height: 100%;
}
body, #app, canvas {
  touch-action: none !important;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

  <script>


(() => {
  'use strict';

  const BUILD_VERSION = 'version-2-final-checked-2026-06-14';

  // Patch 23 Summary:
  // - Rebuild โครง Trip/Lane/Queue/Graphics ให้แยก Demand ออกจาก Road Capacity อย่างชัดเจน
  // - Life Trip มี path = สร้าง Trip ทันที ไม่ fail เพราะถนนต้นทางเต็ม
  // - ถนน/เลนคุมเฉพาะตอนรถจะเข้า cell จริง รถจึงรอคิวและไม่ทับกัน
  // - Queue Control: ต่อคิวอาคาร/Gate แบบมี front-of-queue ลดการเช็กซ้ำทุกคัน
  // - Lane Capacity ใหม่ใช้ CARS_PER_GRID ตามจำนวนเลน พร้อม offset ตามยาวกันรถซ้อน
  // - Graphics Pass: จำกัดการวาดรถคิวจำนวนมาก และแสดง badge +จำนวนแทนเพื่อลดแลค
  // - Skip/Stats/Inspector ปรับให้อ่านค่า Trip/Queue/Road Cars ตรงกับ simulation ใหม่

  // ================================================================
  // Traffic Fixer Thailand - Playable Prototype
  // ทุกเมนูสร้างและระบบหลักอ่านจาก DATA กลางนี้ ไม่ hardcode รายการ UI แยก
  // ================================================================

  const MAP_W = 300;
  const MAP_H = 300;
  const MAP_SIZE = MAP_W * MAP_H;
  const TILE = 18;
  // Patch 19: ยังไม่มีเป้าประชากร และยังปล่อยรถย้ายเข้ารวดเดียวตามบ้านว่าง
  // แต่รถประชาชน/ไปทำงาน/กลับบ้านจะเป็น priority trip ไม่ถูกทิ้งเพราะ active cap
  const MAX_ACTIVE_VEHICLES = 8000;
  // Patch 21: Trip/Lane/Queue/Graphics Rebuild
  // หลักใหม่: ถ้าถึงเวลาเดินทางและมี path จริง ให้สร้าง Trip ของประชาชนทันที
  // ไม่ให้ createTrip fail เพราะถนนต้นทางเต็มอีกแล้ว แต่ให้รถไปต่อคิวที่อาคาร/Gate/จุดเริ่มแทน
  // Patch 23: ตัด retry loop/pending feasibility; ถ้ายังอยู่บนรถให้จำ demand ไว้ 1 ครั้ง แล้วค่อยยิงหลัง Trip จบ
  // Patch 23: Life Trip ใช้ simple route ไป entrance โดยตรง ไม่ไล่คำนวณ access feasibility ทุกทาง
  // ส่วน PassThroughTrip ยังเป็นรถรอง สามารถถูกตัดทิ้งเพื่อกันแลคได้
  const LIFE_TRIP_TYPES = new Set(['WorkTrip', 'ReturnHomeTrip', 'LeisureTrip', 'MoveInTrip', 'MoveOutTrip']);
  function isLifeTripType(type) { return LIFE_TRIP_TYPES.has(type); }
  // Patch 21: vehicle/render safety caps. Simulation still keeps demand, but drawing queues is aggregated.
  const MAX_FULL_VEHICLE_RENDER = 3200;
  const QUEUE_RENDER_LIMIT_GATE = 220;
  const QUEUE_RENDER_LIMIT_BUILDING = 120;
  const QUEUE_BADGE_MIN_EXTRA = 1;
  const START_QUEUE_RETRY_GAME_MIN = 0.35;
  const BUILDING_QUEUE_RETRY_GAME_MIN = 0.20;
  const LIFE_TRIP_RETRY_MIN = 8;
  const LIFE_TRIP_RETRY_MAX_MIN = 360;
  // Car spacing pass: รถ 1 คันยาว 1 Grid ต่อ 1 เลน
  // ถนน 2 เลน = 2 คัน/กริดรวม, 4 เลน = 4 คัน/กริดรวม, 8 เลน = 8 คัน/กริดรวม
  // ไม่มีการยัด 3 คันใน 1 เลนอีกแล้ว รถจะต่อท้ายกันตามช่องถนนจริง
  const CARS_PER_GRID = 1;
  // Thailand road rule pass: cars drive on the left side of the road (right-hand-drive cars).
  // Building entry/exit must not cross opposing lanes; cars must route via legal U-turn/loop to approach the curb side.
  const THAI_LEFT_SIDE_DRIVING = true;
  const BUILDING_LANE_LOCK_CELLS = 8;
  const HIDE_BUILDING_EXIT_QUEUE_RENDER = true;
  // Performance Sleep Pass:
  // รถที่กำลังวิ่ง/กำลังเข้า-ออกอาคารยังต้องอัปเดตทุกเฟรมเพื่อให้ภาพลื่น
  // แต่รถที่รอท้ายคิว/รถค้าง/รถที่ยังไม่ได้ขยับ ไม่ต้องคำนวณ physics ทุกเฟรม
  // ช่วยลดแลคเมื่อมีรถจำนวนมาก โดยไม่ทำให้รถหายหรือวาร์ป
  const VEHICLE_QUEUE_SLEEP_REAL_SEC = 0.20;
  const VEHICLE_STUCK_SLEEP_REAL_SEC = 0.55;
  const VEHICLE_LATE_CHECK_GAME_MIN = 2.0;
  // Patch 36 Happiness Balance:
  // New residents should not be punished for a work shift whose departure window
  // already passed before they finished moving in. Late penalties are also softened
  // so a small city does not collapse in happiness from one delayed trip.
  const FIRST_DAY_WORK_DEADLINE_GRACE_MIN = 15;
  const LATE_INITIAL_SAT_PENALTY = 3;
  const LATE_REPEAT_SAT_PENALTY = 1;
  const LATE_WORK_ARRIVAL_SAT_PENALTY = 4;
  const LATE_LEISURE_ARRIVAL_SAT_PENALTY = 3;
  // Patch 35: เพิ่มความเร็วรถจาก 0.60 เป็น 0.90 = เร็วขึ้น 1.5 เท่าจาก Patch 34
  // ยังต่ำกว่า full scale 1.00 เล็กน้อยเพื่อไม่ให้รถพุ่งผ่านไฟแดง/แยกแรงเกินไป
  const VEHICLE_SPEED_SCALE = 0.90;
  // Patch 6: รถไม่ควรพุ่งทันทีหลังออกจากอาคาร/ไฟแดง และควรเบรกก่อนเข้าโค้ง
  // เป็นการคุมฟิสิกส์เฉพาะคัน ไม่ใช่การหาเส้นทางใหม่ จึงยังรองรับรถเยอะได้
  // Patch 10: รถออกจากอาคารต้องรู้สึกสนุกขึ้น ไม่ค่อย ๆ คลานออกมานานเกินไป
  // ค่านี้ยังเหลือจังหวะออกตัวนุ่ม ๆ แต่ลดเวลารอหน้าทางออกอาคารลงชัดเจน
  const VEHICLE_START_SPEED_FACTOR = 0.62;
  const VEHICLE_GATE_START_SPEED_FACTOR = 0.70;
  const VEHICLE_RESTART_SPEED_FACTOR = 0.55;
  const VEHICLE_ACCEL_RATE = 3.80;
  const VEHICLE_TURN_BRAKE_FACTOR = 0.72;
  // Patch 17: route lock แบบมีเงื่อนไข

  function makeProfiles() {
    const profiles = [];
    // ปรับใหม่ตามฟีดแบ็ก: ใช้ 4 กลุ่มหลักเท่ากัน 25% และสุ่มแจกตอน Citizen เกิด
    // เพื่อให้เมืองมีรถหลายช่วงเวลา ไม่เงียบจนรอแค่เข้างาน/ออกงาน
    const traitPool = [
      ...Array(25).fill('ขยัน'),
      ...Array(25).fill('ชิล ๆ'),
      ...Array(25).fill('สายชิล'),
      ...Array(25).fill('บ้านรวย')
    ];
    for (let i = 0; i < 100; i++) {
      const trait = traitPool[i];
      const baseLeave = 6 * 60 + 10 + (i * 13) % 220;
      const workEnd = 17 * 60 + 10 + (i * 19) % 120;
      const leisureKind = trait === 'ขยัน'
        ? ['restaurant', null, 'park', null][i % 4]
        : trait === 'ชิล ๆ'
          ? ['restaurant', 'mall', 'shop', 'park'][i % 4]
          : trait === 'สายชิล'
            ? ['restaurant', 'mall', 'pub', 'park'][i % 4]
            : ['mall', 'restaurant', 'pub', 'shop'][i % 4];
      profiles.push({
        id: i + 1,
        trait,
        tax: 500,
        workDays: trait === 'บ้านรวย' ? [] : trait === 'สายชิล' ? [0,1,2,3] : [0,1,2,3,4],
        leaveWorkAt: baseLeave,
        workStartDeadline: 10 * 60 + 30,
        workEndAt: workEnd,
        afterWork: leisureKind,
        afterWorkStart: workEnd + 10 + (i * 11) % 55,
        afterWorkEnd: leisureKind === 'pub' ? 23 * 60 + 30 : 21 * 60 + (i % 4) * 20,
        weekendKind: trait === 'ขยัน' ? ['park', null, 'restaurant', null][i % 4] : ['mall','park','restaurant','pub'][i % 4],
        weekendStart: 9 * 60 + (i * 9) % 180,
        weekendEnd: 16 * 60 + (i * 5) % 210,
        richStart: 14 * 60 + (i % 6) * 25,
        richEnd: 27 * 60
      });
    }
    return profiles;
  }

  function affectedCellsForRoadNetworkChange(centerIdx, radius = 3) {
    const out = new Set();
    const add = (i) => { if (i != null && i >= 0 && i < MAP_SIZE) out.add(i); };
    if (centerIdx == null || centerIdx < 0 || centerIdx >= MAP_SIZE) return out;
    const p = xy(centerIdx);
    for (let yy = p.y - radius; yy <= p.y + radius; yy++) {
      for (let xx = p.x - radius; xx <= p.x + radius; xx++) {
        if (inBounds(xx, yy)) add(idx(xx, yy));
      }
    }
    add(centerIdx);
    for (const n of linkedNeighbors(centerIdx)) {
      add(n);
      const q = xy(n);
      for (let yy = q.y - 1; yy <= q.y + 1; yy++) for (let xx = q.x - 1; xx <= q.x + 1; xx++) if (inBounds(xx, yy)) add(idx(xx, yy));
    }
    const owner = roadOwnerAtGridCell(centerIdx);
    if (owner != null) add(owner);
    return out;
  }

  function recordRoadNetworkChange(centerIdx, reason = 'road-change', radius = 3) {
    const cells = affectedCellsForRoadNetworkChange(centerIdx, radius);
    if (!cells.size) return false;
    roadChangeSerial++;
    roadChangeLog.push({ serial: roadChangeSerial, cells, reason, t: game.worldMin });
    if (roadChangeLog.length > MAX_ROAD_CHANGE_LOG) roadChangeLog.splice(0, roadChangeLog.length - MAX_ROAD_CHANGE_LOG);
    return true;
  }

  function recordRoadNetworkBatchChange(cells, reason = 'road-batch-change', radius = 3) {
    if (!cells || !cells.length) return false;
    const affected = new Set();
    for (const i of cells) {
      for (const a of affectedCellsForRoadNetworkChange(i, radius)) affected.add(a);
    }
    if (!affected.size) return false;
    roadChangeSerial++;
    roadChangeLog.push({ serial: roadChangeSerial, cells: affected, reason, t: game.worldMin });
    if (roadChangeLog.length > MAX_ROAD_CHANGE_LOG) roadChangeLog.splice(0, roadChangeLog.length - MAX_ROAD_CHANGE_LOG);
    return true;
  }

  function vehicleRouteTouchedByRoadChange(v) {
    if (!v || !Array.isArray(v.path) || !v.path.length) return false;
    if (!v.routeCellSet) v.routeCellSet = buildRouteCellSet(v.path);
    const seen = Number.isFinite(v.routeChangeSeenSerial) ? v.routeChangeSeenSerial : (Number.isFinite(v.routeChangeSerialAtStart) ? v.routeChangeSerialAtStart : roadChangeSerial);
    if (seen >= roadChangeSerial) return false;
    let touched = false;
    for (const ch of roadChangeLog) {
      if (!ch || ch.serial <= seen) continue;
      for (const cell of ch.cells) {
        if (v.routeCellSet.has(cell)) { touched = true; break; }
      }
      if (touched) break;
    }
    v.routeChangeSeenSerial = roadChangeSerial;
    return touched;
  }

  function vehicleCurrentPathBroken(v) {
    if (!v || !Array.isArray(v.path)) return true;
    const start = Math.max(0, v.pathPos || 0);
    for (let p = start; p < v.path.length; p++) {
      const i = v.path[p];
      if (i == null || !road[i]) return true;
    }
    return false;
  }

  function maybeRecalculateVehicleRouteForPathChange(v, reason = 'ถนนเปลี่ยนในเส้นทางเดิม', force = false) {
    if (!v || v.phase === 'departing' || v.phase === 'arriving' || v.phase === 'fadingOut') return false;
    if (!force && !vehicleRouteTouchedByRoadChange(v)) return false;
    if (!road[v.currentIdx]) return false;
    const newPath = pathForVehicleCurrentDestination(v);
    if (!newPath.length) {
      v.lastRouteNote = `path touched but no new route: ${reason}`;
      return false;
    }
    if (newPath[0] !== v.currentIdx) return false;
    if (samePathFromCurrent(v, newPath)) {
      syncVehicleRouteMeta(v, `path touched but route remains same: ${reason}`);
      return false;
    }
    return applyVehiclePath(v, newPath, `reroute only because current path was touched: ${reason}`, true);
  }
