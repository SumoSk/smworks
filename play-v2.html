<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic Fixer Thailand — Turn Motion v2</title>
<style>html,body{margin:0;width:100%;height:100%;background:#08151d;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:680px;background:#10232d;border:1px solid #29414d;border-radius:16px;padding:20px 22px;box-shadow:0 18px 50px #0008}.small{opacity:.72;font-size:13px;line-height:1.55}.err{color:#fecaca;white-space:pre-wrap;text-align:left}</style></head>
<body><div id="boot"><div class="card"><strong>Traffic Fixer Thailand</strong><div class="small" id="bootMsg">กำลังโหลด Turn Motion v2…</div></div></div>
<script>
const HELPER="  // Turn Motion v2: smooth visual turns while keeping routing/lane/signal logic unchanged.\n  // Fixes continuity on consecutive bends and keeps hot-loop speed checks allocation-light.\n  const TURN_MOTION_DIR_CACHE = new Map();\n\n  function turnMotionSmooth01(t) {\n    t = clamp(t, 0, 1);\n    return t * t * (3 - 2 * t);\n  }\n\n  function turnMotionDirVector(dirKey) {\n    const key = dirKey || '0,0';\n    let cached = TURN_MOTION_DIR_CACHE.get(key);\n    if (cached) return cached;\n    const d = parseDirKey(key);\n    const len = Math.hypot(d.dx, d.dy) || 1;\n    cached = { x: d.dx / len, y: d.dy / len };\n    TURN_MOTION_DIR_CACHE.set(key, cached);\n    return cached;\n  }\n\n  function turnMotionAngleRad(inDir, outDir) {\n    const a = turnMotionDirVector(inDir);\n    const b = turnMotionDirVector(outDir);\n    return Math.acos(clamp(a.x * b.x + a.y * b.y, -1, 1));\n  }\n\n  function turnMotionIsCurve(inDir, outDir) {\n    if (!inDir || !outDir || inDir === outDir) return false;\n    const angle = turnMotionAngleRad(inDir, outDir);\n    // Grid roads produce 45/90/135/180 degree changes. Smooth only normal 45/90 turns here.\n    // 135/180 need a dedicated wide-turn/U-turn path so they do not cut across medians.\n    return angle > 0.08 && angle <= Math.PI * 0.53;\n  }\n\n  function turnMotionRouteDir(v, segmentPos) {\n    if (!v || segmentPos < 0) return 'idle';\n    if (v.routeDirKeys && v.routeDirKeys[segmentPos]) return v.routeDirKeys[segmentPos];\n    if (!Array.isArray(v.path) || segmentPos + 1 >= v.path.length) return 'idle';\n    return moveDirKey(v.path[segmentPos], v.path[segmentPos + 1]);\n  }\n\n  function turnMotionApproachDistance(cellIdx) {\n    const rd = roadDataById(road[cellIdx] || 1) || DATA.roads.small;\n    if (rd.lanes >= 8) return 0.52;\n    if (rd.lanes >= 4) return 0.40;\n    return 0.30;\n  }\n\n  function turnMotionTurnAtPathPos(v, cellPathPos) {\n    if (!v || !Array.isArray(v.path) || cellPathPos <= 0 || cellPathPos >= v.path.length - 1) return null;\n    const inDir = turnMotionRouteDir(v, cellPathPos - 1);\n    const outDir = turnMotionRouteDir(v, cellPathPos);\n    if (!turnMotionIsCurve(inDir, outDir)) return null;\n    return { inDir, outDir, turnAngle: turnMotionAngleRad(inDir, outDir), cellIdx: v.path[cellPathPos], cellPathPos };\n  }\n\n  function turnMotionNormalizedVisualVector(ax, ay, bx, by, fallbackDirKey) {\n    const dx = bx - ax;\n    const dy = by - ay;\n    const len = Math.hypot(dx, dy);\n    if (len > 0.0001) return { x: dx / len, y: dy / len, len };\n    const f = turnMotionDirVector(fallbackDirKey);\n    return { x: f.x, y: f.y, len: 1 };\n  }\n\n  function turnMotionStartForTurn(v, turn) {\n    if (!v || !turn || turn.cellPathPos <= 0) return null;\n    const prevIdx = v.path[turn.cellPathPos - 1];\n    const currentIn = roadCellVisualCenterWorldForDir(turn.cellIdx, turn.inDir);\n    const prevVisual = roadCellVisualCenterWorldForDir(prevIdx, turn.inDir);\n    const entryV = turnMotionNormalizedVisualVector(prevVisual.x, prevVisual.y, currentIn.x, currentIn.y, turn.inDir);\n    const approach = Math.min(turnMotionApproachDistance(turn.cellIdx), Math.max(0.08, entryV.len * 0.42));\n    return {\n      start: { x: currentIn.x - entryV.x * approach, y: currentIn.y - entryV.y * approach },\n      currentIn,\n      prevVisual,\n      entryV,\n      approach\n    };\n  }\n\n  function turnMotionGeometry(v, nextOverride = null) {\n    if (!v) return null;\n    const next = nextOverride != null ? nextOverride : v.nextIdx;\n    if (next == null) return null;\n    const pts = vehicleSegmentVisualPoints(v, next);\n    if (!pts.isTurn || !turnMotionIsCurve(pts.inDir, pts.outDir)) return null;\n\n    const pos = v.pathPos || 0;\n    const thisTurn = turnMotionTurnAtPathPos(v, pos);\n    const startInfo = thisTurn ? turnMotionStartForTurn(v, thisTurn) : null;\n    if (!startInfo) return null;\n    const start = startInfo.start;\n    const entryV = startInfo.entryV;\n\n    // Match the tangent to the actual rendered outgoing road axis, not only to grid dx/dy.\n    // Wide-road footprints shift visual centers, so this avoids a small reverse sway on some directions.\n    const exitV = turnMotionNormalizedVisualVector(pts.currentOut.x, pts.currentOut.y, pts.next.x, pts.next.y, pts.outDir);\n\n    // If the next cell immediately turns again, end this curve at the exact start of\n    // the following curve. This removes the visible snap on S-bends.\n    let end = pts.next;\n    const nextTurn = turnMotionTurnAtPathPos(v, pos + 1);\n    if (nextTurn) {\n      const nextStartInfo = turnMotionStartForTurn(v, nextTurn);\n      if (nextStartInfo) end = nextStartInfo.start;\n    }\n\n    const dx = end.x - start.x;\n    const dy = end.y - start.y;\n    const chord = Math.max(0.2, Math.hypot(dx, dy));\n    const turnAngle = turnMotionAngleRad(pts.inDir, pts.outDir);\n\n    // The road renderer shifts visual centers according to footprint/orientation. For some\n    // legal turns, forcing a mathematical tangent through those shifted centers creates a\n    // tiny loop. Use a bounded bowed Bezier for position and interpolate heading separately.\n    const inLogical = turnMotionDirVector(pts.inDir);\n    const outLogical = turnMotionDirVector(pts.outDir);\n    const cross = inLogical.x * outLogical.y - inLogical.y * outLogical.x;\n    const nx = -dy / chord;\n    const ny = dx / chord;\n    const rd = roadDataById(road[v.currentIdx] || 1) || DATA.roads.small;\n    const roadBulge = rd.lanes >= 8 ? 0.24 : rd.lanes >= 4 ? 0.18 : 0.13;\n    const angleFactor = clamp(turnAngle / (Math.PI / 2), 0.55, 1.0);\n    const bulge = -Math.sign(cross || 1) * Math.min(chord * 0.22, roadBulge * angleFactor);\n    const bx = nx * bulge;\n    const by = ny * bulge;\n\n    return {\n      ...pts,\n      start,\n      end,\n      c1: { x: start.x + dx / 3 + bx, y: start.y + dy / 3 + by },\n      c2: { x: start.x + dx * 2 / 3 + bx, y: start.y + dy * 2 / 3 + by },\n      entryV,\n      exitV,\n      entryAngle: Math.atan2(entryV.y, entryV.x),\n      exitAngle: Math.atan2(exitV.y, exitV.x),\n      turnAngle,\n      nextTurn\n    };\n  }\n\n  function turnMotionBezierPoint(g, t) {\n    const u = 1 - t;\n    const uu = u * u;\n    const tt = t * t;\n    return {\n      x: uu * u * g.start.x + 3 * uu * t * g.c1.x + 3 * u * tt * g.c2.x + tt * t * g.end.x,\n      y: uu * u * g.start.y + 3 * uu * t * g.c1.y + 3 * u * tt * g.c2.y + tt * t * g.end.y\n    };\n  }\n\n  function turnMotionBezierTangent(g, t) {\n    const u = 1 - t;\n    return {\n      x: 3 * u * u * (g.c1.x - g.start.x) + 6 * u * t * (g.c2.x - g.c1.x) + 3 * t * t * (g.end.x - g.c2.x),\n      y: 3 * u * u * (g.c1.y - g.start.y) + 6 * u * t * (g.c2.y - g.c1.y) + 3 * t * t * (g.end.y - g.c2.y)\n    };\n  }\n\n  function turnMotionLerpAngle(a, b, t) {\n    let d = b - a;\n    while (d > Math.PI) d -= Math.PI * 2;\n    while (d < -Math.PI) d += Math.PI * 2;\n    return a + d * clamp(t, 0, 1);\n  }\n\n  function turnMotionUpcoming(v) {\n    if (!v || v.nextIdx == null || !Array.isArray(v.path)) return null;\n    const turn = turnMotionTurnAtPathPos(v, (v.pathPos || 0) + 1);\n    if (!turn) return null;\n    const info = turnMotionStartForTurn(v, turn);\n    if (!info) return null;\n    return { ...turn, start: info.start, entryV: info.entryV };\n  }\n";
const OLD_SPEED="  function vehicleTurnSlowFactor(v) {\n    // Patch 13: เอาระบบรถโค้ง/ชะลอเข้าโค้งออก รถจึงไม่โดนสปีดเพียงเพราะเปลี่ยนทิศ\n    return 1;\n  }\n".replace('ไม่โดนสปีด','ไม่โดนลดสปีด');
const SPEED="  function turnMotionSpeedTarget(v, angle) {\n    const isTruck = v && v.type === 'PassThroughTrip';\n    const deg = angle * 180 / Math.PI;\n    if (deg >= 80) return isTruck ? 0.64 : 0.74;\n    if (deg >= 40) return isTruck ? 0.76 : 0.86;\n    return isTruck ? 0.84 : 0.92;\n  }\n\n  function vehicleTurnSlowFactor(v) {\n    if (!v || v.nextIdx == null || !Array.isArray(v.path)) return 1;\n    const pos = v.pathPos || 0;\n    const p = clamp(v.t || 0, 0, 1);\n\n    // Hot update path: use the already-computed route direction keys when available.\n    // Do not build Bezier geometry here; geometry is render-only and much more expensive.\n    let activeAngle = 0;\n    let active = false;\n    if (pos > 0) {\n      const inDir = turnMotionRouteDir(v, pos - 1);\n      const outDir = turnMotionRouteDir(v, pos);\n      if (turnMotionIsCurve(inDir, outDir)) {\n        active = true;\n        activeAngle = turnMotionAngleRad(inDir, outDir);\n      }\n    }\n\n    if (active) {\n      const target = turnMotionSpeedTarget(v, activeAngle);\n      const nextTurn = turnMotionTurnAtPathPos(v, pos + 1);\n      const exitTarget = nextTurn ? turnMotionSpeedTarget(v, nextTurn.turnAngle) : 1;\n      const recover = turnMotionSmooth01((p - 0.46) / 0.54);\n      return target + (exitTarget - target) * recover;\n    }\n\n    const upcoming = turnMotionTurnAtPathPos(v, pos + 1);\n    if (!upcoming) return 1;\n    const target = turnMotionSpeedTarget(v, upcoming.turnAngle);\n    const brake = turnMotionSmooth01((p - 0.62) / 0.38);\n    return 1 - (1 - target) * brake;\n  }\n";
const OLD_DRAW="    if (v.nextIdx != null) {\n      const pts = vehicleSegmentVisualPoints(v, v.nextIdx);\n      const a = pts.currentOut;\n      const b = pts.next;\n      const p = clamp(v.t, 0, 1);\n      // Patch 13: ไม่ใช้ Bezier/รถโค้งแล้ว วาดเป็นเส้นตรงจากจุดปัจจุบันไปจุดถัดไป\n      return {\n        x: a.x + (b.x - a.x) * p,\n        y: a.y + (b.y - a.y) * p,\n        phaseT: p,\n        angle: Math.atan2(b.y - a.y, b.x - a.x)\n      };\n    }\n";
const NEW_DRAW="    if (v.nextIdx != null) {\n      const pts = vehicleSegmentVisualPoints(v, v.nextIdx);\n      const p = clamp(v.t, 0, 1);\n      const turn = turnMotionGeometry(v, v.nextIdx);\n\n      if (turn) {\n        const point = turnMotionBezierPoint(turn, p);\n        const steerT = turnMotionSmooth01(p);\n        return {\n          x: point.x,\n          y: point.y,\n          phaseT: p,\n          angle: turnMotionLerpAngle(turn.entryAngle, turn.exitAngle, steerT),\n          visualTurn: true\n        };\n      }\n\n      const upcoming = turnMotionUpcoming(v);\n      const a = pts.currentOut;\n      const b = upcoming ? upcoming.start : pts.next;\n      return {\n        x: a.x + (b.x - a.x) * p,\n        y: a.y + (b.y - a.y) * p,\n        phaseT: p,\n        angle: Math.atan2(b.y - a.y, b.x - a.x)\n      };\n    }\n";
(async()=>{
  const msg=document.getElementById('bootMsg');
  try{
    const r=await fetch('./index.html?turnv2src=20260825',{cache:'no-store'});
    if(!r.ok) throw new Error('โหลด index.html ไม่สำเร็จ: HTTP '+r.status);
    let src=await r.text();
    let applied=0;
    const replaceExactlyOnce=(before,after,label)=>{
      const count=src.split(before).length-1;
      if(count!==1) throw new Error(label+': expected 1 match, found '+count);
      src=src.replace(before,after);
      applied++;
    };
    src=src.replace("const BUILD_VERSION = 'version-2-final-checked-2026-06-14';", "const BUILD_VERSION = 'version-2-turn-motion-v2-audited-2026-08-25';");
    if(!src.includes('const TURN_MOTION_DIR_CACHE = new Map();')){
      const marker='  function roadCellScreenCenter(i, zt) {';
      const count=src.split(marker).length-1;
      if(count!==1) throw new Error('Patch helper: expected 1 roadCellScreenCenter, found '+count);
      src=src.replace(marker,HELPER+marker);
      applied++;
    } else applied++;
    replaceExactlyOnce(OLD_SPEED,SPEED,'Patch speed');
    replaceExactlyOnce(OLD_DRAW,NEW_DRAW,'Patch draw');
    if(applied!==3) throw new Error('Patch validation failed: '+applied+'/3');
    if(!src.includes('turnMotionGeometry(v, v.nextIdx)') || !src.includes('turnMotionSpeedTarget(v, angle)')) throw new Error('Patch validation: signature missing');
    document.open();document.write(src);document.close();
  } catch(err) {
    console.error(err);
    msg.className='small err';
    msg.textContent='เปิดเกมไม่สำเร็จ\n'+(err&&err.stack?err.stack:String(err));
  }
})();
</script></body></html>
