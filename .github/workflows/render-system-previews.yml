name: Capture actual clinic screens with synthetic data
on:
  push:
    branches: [main]
    paths:
      - '.github/system-preview/**'
      - '.github/workflows/render-system-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer
        run: npm install --no-save --package-lock=false playwright sharp chart.js
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Capture synthetic screens
        run: node .github/system-preview/capture.cjs
      - name: Save image assets
        run: |
          git config user.name 'SM Works Preview Builder'
          git config user.email 'preview-builder@users.noreply.github.com'
          git add assets/system-preview
          git commit -m 'Add actual clinic screen captures using synthetic data' || exit 0
          git push
